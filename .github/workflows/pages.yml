name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages. `enablement: true` turns Pages
# on automatically the first time this runs, so no repository setting has to
# be toggled by hand. The site lands at:
#   https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - claude/betterdecisions-app-gpzcbw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run unit tests
        run: node --test

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is static; serve it from the root.
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
