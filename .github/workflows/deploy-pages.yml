name: Enable GitHub Pages for Archetype Atlas

# Enables Pages in "deploy from a branch" mode pointing at this branch's docs/
# folder, using the workflow's own token (pages: write). Branch-source Pages is
# not restricted to the default branch, so it serves the game from the PR branch.
on:
  push:
    branches: ["claude/personality-archetypes-societies-kptvyf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at this branch's docs/ folder
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          body="{\"source\":{\"branch\":\"${BRANCH}\",\"path\":\"/docs\"}}"
          echo "Requesting Pages source: ${body}"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" -d "${body}" || true)
          echo "POST /pages -> HTTP ${code}"; cat /tmp/resp.json || true; echo
          if [ "${code}" = "409" ] || [ "${code}" = "422" ]; then
            echo "Pages already exists; updating source via PUT"
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages" -d "${body}" || true)
            echo "PUT /pages -> HTTP ${code}"; cat /tmp/resp.json || true; echo
          fi
          case "${code}" in
            201|204) echo "Pages configured." ;;
            *) echo "Failed to configure Pages (HTTP ${code})."; exit 1 ;;
          esac
      - name: Show the site URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 5
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" || true
