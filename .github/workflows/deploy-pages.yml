name: Publish Archetype Atlas to gh-pages

# The Pages site serves from gh-pages (legacy branch build); the workflow-type
# deploy path is blocked by an admin-locked environment policy. So publishing
# is a branch sync: copy archetype-atlas/ from main into gh-pages and push.
on:
  push:
    branches: [main]
    paths: ["archetype-atlas/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Sync game into gh-pages/archetype-atlas
        run: |
          set -euo pipefail
          rm -rf site/archetype-atlas
          cp -r main/archetype-atlas site/archetype-atlas
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to publish."; exit 0; }
          git commit -m "Sync Archetype Atlas from main @ ${GITHUB_SHA::7}"
          git push origin gh-pages
