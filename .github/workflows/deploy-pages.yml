name: Publish site to GitHub Pages

# Keeps the gh-pages branch (the hosted site) in sync with the game branch.
# GitHub Pages serves gh-pages at https://githubthebub.github.io/taskmind/

on:
  push:
    branches: [main, claude/big-five-personality-game-cazxnq]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync this commit to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
