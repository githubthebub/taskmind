name: Deploy Archetype Atlas to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the game as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: archetype-atlas

  # No `environment:` block — the auto-created github-pages environment carries
  # a branch policy that rejects every branch and only an admin can edit it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Live URL
        run: echo "Live at ${{ steps.deployment.outputs.page_url }}"

  # If workflow-type deploy is refused, switch the site to branch-source mode,
  # which serves main:/docs via GitHub's own builder and needs no environment.
  branch-fallback:
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages to branch source (main /docs)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          body='{"build_type":"legacy","source":{"branch":"main","path":"/docs"}}'
          code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" -d "$body")
          echo "PUT /pages -> HTTP ${code}"; cat /tmp/r.json || true; echo
          echo "--- current pages config ---"
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages"
          [ "${code}" = "204" ] || [ "${code}" = "200" ]
