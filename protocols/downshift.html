<title>Downshift — Arousal → Sleep Protocol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --ground:#06070c;
    --ground-2:#0a0c14;
    --bone:#c9c3b8;
    --bone-dim:#8a8578;
    --slate:#4a5470;
    --line:#1a1d2a;
    --accent:#ff7a45; /* migrates per phase via JS */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ground);
    color:var(--bone);
    font-family:var(--serif);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;
    padding:max(20px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
    transition:opacity 20s ease;
  }
  body.ended #stage{opacity:0}
  body.ended.manual #stage{transition:opacity 2s ease}

  /* ---------- descent track ---------- */
  header{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;transition:opacity 3s ease}
  #track{display:flex;gap:6px}
  #track .seg{
    flex:1;height:2px;background:var(--line);border-radius:2px;position:relative;overflow:hidden;
  }
  #track .seg i{
    position:absolute;inset:0;transform-origin:left;transform:scaleX(0);
    background:var(--accent);display:block;transition:background 4s ease;
  }
  #phaseRow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--sans)}
  #eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim);
    transition:color 4s ease;
  }
  #phaseNum{font-size:11px;letter-spacing:.22em;color:var(--slate)}
  body.deep header{opacity:.15}
  body.void header{opacity:0}

  /* ---------- orb ---------- */
  #orbWrap{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(28px,6vh,56px);width:100%;
  }
  #orb{
    width:min(42vw,220px);aspect-ratio:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%,
      color-mix(in oklab,var(--accent) 34%,transparent) 0%,
      color-mix(in oklab,var(--accent) 12%,transparent) 46%,
      transparent 72%);
    box-shadow:
      0 0 60px color-mix(in oklab,var(--accent) 22%,transparent),
      0 0 140px color-mix(in oklab,var(--accent) 10%,transparent),
      inset 0 0 40px color-mix(in oklab,var(--accent) 14%,transparent);
    border:1px solid color-mix(in oklab,var(--accent) 30%,transparent);
    transform:scale(1);
    will-change:transform;
    transition:box-shadow 4s ease,background 4s ease,border-color 4s ease,opacity 6s ease;
  }
  body.deep #orb{opacity:.35}
  body.void #orb{opacity:.08}
  #breathLabel{
    font-family:var(--sans);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    color:color-mix(in oklab,var(--accent) 75%,var(--bone));
    transition:color 4s ease,opacity .6s ease;text-align:center;padding-left:.3em;
  }
  /* ---------- narration ---------- */
  #line{
    width:min(560px,100%);min-height:5.2em;text-align:center;
    font-size:clamp(1.15rem,3.4vw,1.5rem);line-height:1.55;
    text-wrap:balance;color:var(--bone);
    opacity:0;transition:opacity 1.1s ease,color 6s ease;
  }
  #line.show{opacity:1}
  body.deep #line{color:var(--bone-dim)}

  /* ---------- footer / gates ---------- */
  footer{
    width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;
    min-height:92px;justify-content:flex-end;
  }
  #gate{
    display:none;
    font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--bone);background:transparent;
    border:1px solid color-mix(in oklab,var(--accent) 45%,transparent);
    border-radius:999px;padding:16px 30px;cursor:pointer;
    animation:gatePulse 3.2s ease-in-out infinite;
  }
  #gate.show{display:block}
  #gate:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @keyframes gatePulse{
    0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 18%,transparent)}
    50%{box-shadow:0 0 24px 2px color-mix(in oklab,var(--accent) 18%,transparent)}
  }
  #util{
    display:flex;gap:22px;font-family:var(--sans);font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;transition:opacity 3s ease;
  }
  #util button{
    background:none;border:none;color:var(--slate);cursor:pointer;
    font:inherit;letter-spacing:inherit;padding:8px 4px;
  }
  #util button:hover{color:var(--bone-dim)}
  #util button:focus-visible{outline:1px solid var(--slate);outline-offset:2px}
  body.deep #util{opacity:.25}
  body.void #util{opacity:.12}

  /* ---------- start screen ---------- */
  #start{
    position:fixed;inset:0;background:var(--ground);z-index:10;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 2.5s ease;padding:28px;
  }
  #start.gone{opacity:0;pointer-events:none}
  #startInner{width:min(400px,100%);display:flex;flex-direction:column;gap:26px;text-align:center;align-items:center}
  #startInner .mark{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,rgba(255,122,69,.5),rgba(255,122,69,.12) 55%,transparent 75%);
    box-shadow:0 0 44px rgba(255,122,69,.25);
    border:1px solid rgba(255,122,69,.35);
  }
  h1{font-size:clamp(1.7rem,6vw,2.2rem);font-weight:500;letter-spacing:.02em;text-wrap:balance}
  #startInner p.sub{color:var(--bone-dim);font-size:1.02rem;line-height:1.6;text-wrap:balance}
  .note{
    font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--slate);line-height:2;
  }
  #voiceRow{
    display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);cursor:pointer;
  }
  #voiceRow .sw{
    width:38px;height:20px;border-radius:999px;border:1px solid var(--slate);position:relative;
    transition:background .25s;flex:none;
  }
  #voiceRow .sw::after{
    content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:var(--bone-dim);transition:transform .25s,background .25s;
  }
  #voiceRow.on .sw{background:rgba(255,122,69,.22);border-color:rgba(255,122,69,.5)}
  #voiceRow.on .sw::after{transform:translateX(18px);background:#ff9d6e}
  #begin{
    font-family:var(--sans);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    color:#0a0704;background:linear-gradient(180deg,#ffa26e,#f07a3e);
    border:none;border-radius:999px;padding:17px 46px;cursor:pointer;margin-top:4px;
  }
  #begin:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    #gate{animation:none;box-shadow:0 0 18px 1px color-mix(in oklab,var(--accent) 16%,transparent)}
  }
</style>

<div id="start">
  <div id="startInner">
    <div class="mark" aria-hidden="true"></div>
    <h1>Downshift</h1>
    <p class="sub">A four-phase guided descent: intercept the charge, drain it, cool it, and slip into sleep. One instruction at a time — the sound and the orb do the rest.</p>
    <div class="note">
      Headphones required · lie down · ~15 minutes<br>
      Phase 1 · Intercept &nbsp;→&nbsp; 2 · Drain &nbsp;→&nbsp; 3 · Cool &nbsp;→&nbsp; 4 · Sleep
    </div>
    <div id="voiceRow" class="on" role="switch" aria-checked="true" tabindex="0">
      <span class="sw" aria-hidden="true"></span> Spoken guidance
    </div>
    <button id="begin">Begin the descent</button>
  </div>
</div>

<div id="stage" aria-live="polite">
  <header>
    <div id="track" aria-hidden="true">
      <div class="seg"><i></i></div><div class="seg"><i></i></div>
      <div class="seg"><i></i></div><div class="seg"><i></i></div>
    </div>
    <div id="phaseRow">
      <span id="eyebrow">Preparing</span>
      <span id="phaseNum"></span>
    </div>
  </header>

  <div id="orbWrap">
    <div id="orb" aria-hidden="true"><span id="breathLabel"></span></div>
    <p id="line"></p>
  </div>

  <footer>
    <button id="gate"></button>
    <div id="util">
      <button id="skip">Skip phase ›</button>
      <button id="end">✕ End session</button>
    </div>
  </footer>
</div>

<script>
'use strict';
/* ============================================================
   DOWNSHIFT — 4-phase arousal→sleep sequencer
   Audio: Web Audio API, fully synthesized. Voice: speechSynthesis.
   ============================================================ */

const $ = id => document.getElementById(id);
const orb = $('orb'), breathLabel = $('breathLabel'), line = $('line'),
      gate = $('gate'), eyebrow = $('eyebrow'), phaseNum = $('phaseNum'),
      segs = [...document.querySelectorAll('#track .seg i')];

const PHASE_META = [
  {name:'Vagal Intercept', accent:'#ff7a45', est:185},
  {name:'The Physical Drain', accent:'#d08a3e', est:135},
  {name:'Thermal Downshift', accent:'#7fb4c4', est:185},
  {name:'The Final Lock', accent:'#4a5470', est:250},
];

let voiceOn = true;
let ended = false;
let phaseCtl = null;          // AbortController for current phase
let phaseStart = 0, phaseEst = 0, phaseIdx = -1;

/* ---------------- scheduling core ---------------- */
const abortErr = () => Object.assign(new Error('phase-abort'), {isAbort:true});

function wait(sec){
  const sig = phaseCtl.signal;
  return new Promise((res, rej) => {
    if (sig.aborted) return rej(abortErr());
    const t = setTimeout(() => { sig.removeEventListener('abort', onAb); res(); }, sec*1000);
    const onAb = () => { clearTimeout(t); rej(abortErr()); };
    sig.addEventListener('abort', onAb, {once:true});
  });
}

/* ---------------- progress track ---------------- */
let trackRaf = null;
function setPhase(i){
  phaseIdx = i; phaseStart = performance.now(); phaseEst = PHASE_META[i].est;
  const m = PHASE_META[i];
  document.documentElement.style.setProperty('--accent', m.accent);
  eyebrow.textContent = m.name;
  phaseNum.textContent = 'Phase ' + (i+1) + ' of 4';
  segs.forEach((s,j) => { s.style.transform = j < i ? 'scaleX(1)' : (j===i ? s.style.transform : 'scaleX(0)'); });
  cancelAnimationFrame(trackRaf);
  const tick = () => {
    if (ended || phaseIdx !== i) return;
    const f = Math.min(1,(performance.now()-phaseStart)/1000/phaseEst);
    segs[i].style.transform = `scaleX(${f})`;
    trackRaf = requestAnimationFrame(tick);
  };
  tick();
}

/* ---------------- narration + voice ---------------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  return voices.find(v => /^en/i.test(v.lang) && /daniel|george|male|uk english/i.test(v.name))
      || voices.find(v => /^en(-|_)?(GB|US)/i.test(v.lang))
      || voices.find(v => /^en/i.test(v.lang)) || null;
}
function speak(text, rate=0.82, pitch=0.68){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const clean = text.replace(/["“”]/g,'').replace(/—/g,', ');
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickVoice(); if (v) u.voice = v;
    u.rate = rate; u.pitch = pitch; u.volume = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function showLine(text){
  line.classList.remove('show');
  setTimeout(() => { line.textContent = text; line.classList.add('show'); }, 250);
}
async function say(text, dur, opts={}){
  showLine(text);
  speak(text, opts.rate, opts.pitch);
  await wait(dur);
}
function cue(text, spokenShort){   // instant command, no wait built in
  showLine(text);
  if (spokenShort !== null) speak(spokenShort ?? text, 0.9, 0.68);
}

/* ---------------- breath orb driver ---------------- */
const breath = { scale:1, anim:0 };
function setOrbScale(s){ breath.scale = s; orb.style.transform = `scale(${s})`; }
const easeIO = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function breathAnim(target, sec){
  const id = ++breath.anim, from = breath.scale, t0 = performance.now();
  const step = now => {
    if (breath.anim !== id) return;
    const f = Math.min(1,(now-t0)/(sec*1000));
    setOrbScale(from + (target-from)*easeIO(f));
    if (f < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
async function breathTo(target, sec, label){
  breathLabel.textContent = label || '';
  breathAnim(target, sec);
  await wait(sec);
}
async function holdBreath(sec, label){
  breathLabel.textContent = label || '';
  await wait(sec);
}

/* ---------------- gate (tap input) ---------------- */
function raceGate(text, capSec){
  gate.textContent = text;
  gate.classList.add('show');
  return new Promise((res, rej) => {
    const sig = phaseCtl.signal;
    let t = null;
    const done = tapped => { cleanup(); res(tapped); };
    const onTap = () => done(true);
    const onAb = () => { cleanup(); rej(abortErr()); };
    const cleanup = () => {
      gate.classList.remove('show');
      gate.removeEventListener('click', onTap);
      sig.removeEventListener('abort', onAb);
      if (t) clearTimeout(t);
    };
    gate.addEventListener('click', onTap);
    sig.addEventListener('abort', onAb, {once:true});
    if (capSec) t = setTimeout(() => done(false), capSec*1000);
  });
}

/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const A = { ctx:null, master:null, nodes:{} };

function audioInit(){
  A.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = A.ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  A.master = A.ctx.createGain(); A.master.gain.value = 0.9;
  A.master.connect(comp); comp.connect(A.ctx.destination);
}
const now = () => A.ctx.currentTime;
function gainNode(v){ const g = A.ctx.createGain(); g.gain.value = v; return g; }
function fadeKill(g, oscs, sec){
  g.gain.setTargetAtTime(0.0001, now(), sec/4);
  setTimeout(() => oscs.forEach(o => { try{o.stop()}catch(e){} }), sec*1000+300);
}

/* -- pre-roll: pink-ish ambient noise -- */
function startAmbient(){
  const len = A.ctx.sampleRate * 4, buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for (let i=0;i<len;i++){
    const w = Math.random()*2-1;
    b0 = .997*b0 + .029*w; b1 = .985*b1 + .032*w; b2 = .95*b2 + .048*w;
    d[i] = (b0+b1+b2)*.25;
  }
  const src = A.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 900;
  const g = gainNode(0.0001);
  src.connect(lp); lp.connect(g); g.connect(A.master); src.start();
  g.gain.setTargetAtTime(0.12, now(), 1.5);
  A.nodes.ambient = {g, src};
}
function hardCutAmbient(){
  const n = A.nodes.ambient; if (!n) return;
  n.g.gain.cancelScheduledValues(now()); n.g.gain.setValueAtTime(0, now()); // hard cut, no fade
  try{ n.src.stop(now()+0.05); }catch(e){}
  A.nodes.ambient = null;
}

/* -- Phase 1: 110 Hz sub-bass + spatialized chime -- */
function startSubBass(){
  const o = A.ctx.createOscillator(); o.type='sine'; o.frequency.value = 110;
  const g = gainNode(0.0001);
  o.connect(g); g.connect(A.master); o.start();
  g.gain.setValueAtTime(0.0001, now());
  g.gain.exponentialRampToValueAtTime(0.28, now()+0.15); // sharp entry
  A.nodes.sub = {g, oscs:[o]};
}
function chimeStrike(){
  if (!A.ctx || ended) return;
  const pan = A.ctx.createStereoPanner();
  pan.pan.setValueAtTime(-1, now());
  pan.pan.linearRampToValueAtTime(1, now()+4);          // 3D sweep L→R over 4 s
  const g = gainNode(0.0001);
  g.connect(pan); pan.connect(A.master);
  const base = 660, partials = [[1,.22],[2.76,.10],[5.40,.045]];
  const oscs = partials.map(([m,amp]) => {
    const o = A.ctx.createOscillator(); o.type='sine'; o.frequency.value = base*m;
    const og = gainNode(amp); o.connect(og); og.connect(g); o.start(); return o;
  });
  g.gain.setValueAtTime(0.0001, now());
  g.gain.exponentialRampToValueAtTime(1, now()+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now()+4.2);
  setTimeout(() => oscs.forEach(o => { try{o.stop()}catch(e){} }), 4600);
}
function stopSubBass(){ const n=A.nodes.sub; if(n){ fadeKill(n.g, n.oscs, 5); A.nodes.sub=null; } }

/* -- Phase 2: industrial drone, 60 BPM pulse, octave drops -- */
function startDrone(){
  const o1 = A.ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value = 55;
  const o2 = A.ctx.createOscillator(); o2.type='sawtooth'; o2.frequency.value = 55.6;
  const o3 = A.ctx.createOscillator(); o3.type='sine';     o3.frequency.value = 55;
  const lp = A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 170; lp.Q.value = 2;
  const pulse = gainNode(0.6);
  const lfo = A.ctx.createOscillator(); lfo.frequency.value = 1;  // 60 BPM
  const lfoG = gainNode(0.35);
  lfo.connect(lfoG); lfoG.connect(pulse.gain);
  const g = gainNode(0.0001);
  o1.connect(lp); o2.connect(lp); lp.connect(pulse); o3.connect(pulse);
  pulse.connect(g); g.connect(A.master);
  [o1,o2,o3,lfo].forEach(o=>o.start());
  g.gain.setTargetAtTime(0.30, now(), 1.2);
  A.nodes.drone = {g, oscs:[o1,o2,o3,lfo], freqOscs:[o1,o2,o3], baseFreqs:[55,55.6,55]};
}
function octaveRestore(){
  const n = A.nodes.drone; if (!n) return;
  n.freqOscs.forEach((o,i) => {
    const f = o.frequency;
    f.cancelScheduledValues(now());
    f.setValueAtTime(Math.max(f.value, 1), now());
    f.exponentialRampToValueAtTime(n.baseFreqs[i], now()+1.5);
  });
}
function octaveDrop(stayDown){
  const n = A.nodes.drone; if (!n) return;
  n.freqOscs.forEach(o => {
    const f = o.frequency;
    f.cancelScheduledValues(now());
    f.setValueAtTime(f.value, now());
    f.exponentialRampToValueAtTime(f.value/2, now()+0.08);   // sudden drop
    if (!stayDown) f.exponentialRampToValueAtTime(f.value, now()+4.5);
  });
}
function stopDrone(sec=6){ const n=A.nodes.drone; if(n){ fadeKill(n.g, n.oscs, sec); A.nodes.drone=null; } }

/* -- Phase 3: layered AUM stack @432 Hz reference -- */
function startAum(){
  const layers = [[108,.16],[216,.13],[432,.09],[648,.04]];
  const g = gainNode(0.0001);
  const oscs = [];
  layers.forEach(([f,amp]) => {
    const o = A.ctx.createOscillator(); o.type='sine'; o.frequency.value = f;
    const vib = A.ctx.createOscillator(); vib.frequency.value = 0.13 + Math.abs(f%7)/40;
    const vibG = gainNode(f*0.0012);
    vib.connect(vibG); vibG.connect(o.frequency);
    const og = gainNode(amp);
    o.connect(og); og.connect(g);
    o.start(); vib.start(); oscs.push(o, vib);
  });
  g.connect(A.master);
  g.gain.setTargetAtTime(0.3, now(), 3);
  A.nodes.aum = {g, oscs, swell:g.gain};
}
function aumSwell(up, sec){
  const n = A.nodes.aum; if (!n) return;
  n.swell.setTargetAtTime(up ? 0.42 : 0.22, now(), sec/3);
}
function stopAum(sec=25){ const n=A.nodes.aum; if(n){ fadeKill(n.g, n.oscs, sec); A.nodes.aum=null; } }

/* -- Phase 4: 4 Hz Delta binaural (136 L / 140 R) -- */
function startBinaural(){
  const merger = A.ctx.createChannelMerger(2);
  const oL = A.ctx.createOscillator(); oL.frequency.value = 136;
  const oR = A.ctx.createOscillator(); oR.frequency.value = 140;
  const gL = gainNode(1), gR = gainNode(1);
  oL.connect(gL); gL.connect(merger, 0, 0);
  oR.connect(gR); gR.connect(merger, 0, 1);
  const g = gainNode(0.0001);
  merger.connect(g); g.connect(A.master);
  oL.start(); oR.start();
  g.gain.setTargetAtTime(0.05, now(), 4);   // barely perceptible
  A.nodes.bin = {g, oscs:[oL,oR]};
}
function fadeBinauralToSilence(){ const n=A.nodes.bin; if(n){ fadeKill(n.g, n.oscs, 90); A.nodes.bin=null; } }

function killAllAudio(){
  hardCutAmbient(); stopSubBass(); stopDrone(2); stopAum(2);
  const n=A.nodes.bin; if(n){ fadeKill(n.g,n.oscs,1); A.nodes.bin=null; }
}

/* ============================================================
   PHASE SCRIPTS
   ============================================================ */

async function preRoll(){
  eyebrow.textContent = 'State capture'; phaseNum.textContent = '';
  startAmbient();
  await say("Stop. Don't close anything. Don't fix anything. You are exactly where you are — and that is the starting position.", 9);
  await say("Lie down or sit back. Your only job for the next fifteen minutes is to follow one instruction at a time.", 8);
  await say("The first sound you hear will be sharp. That's deliberate. When it hits, begin.", 6.5);
}

/* ---- one physiological-sigh cycle ---- */
async function sighCycle(guided){
  chimeStrike();
  cue(guided ? 'Inhale now — deep, through the nose, slow. Fill the bottom of the lungs first.' : 'Inhale — slow, through the nose.',
      'Inhale now');
  await breathTo(1.30, 3.6, 'Inhale');
  cue(guided ? 'At the very top — snap a second, sharp inhale. Stack it on top.' : 'Snap the second inhale.',
      'Snap the second inhale');
  await breathTo(1.44, 1.0, 'Snap');
  cue(guided ? 'Hold. Eyes hard right — as far as they go. Head perfectly still.' : 'Hold — eyes hard right.',
      'Hold. Eyes hard right');
  await holdBreath(2.4, 'Hold · eyes right');
  cue(guided ? 'Exhale — long, slow, audible. “Haaaaa…” Let the eyes drift back to center.' : 'Exhale — “Haaaaa…” — eyes float home.',
      'Exhale. Haaaaa');
  await breathTo(0.82, 8, 'Exhale');
  await holdBreath(1.2, '');
}

async function phase1(){
  setPhase(0);
  hardCutAmbient();          // hard cut — the intercept
  startSubBass();
  chimeStrike();
  await say("That sound is the intercept. Everything before it is on the other side of a line.", 6.5);
  await say("Do not push the desire away. Do not fight the images — fighting is fuel. What you feel is three months of stored charge. Proof of voltage.", 11);
  await say("Say silently, one time: “This power is mine. I am grateful it is this strong.” Mean it.", 8.5);
  await sighCycle(true);
  await sighCycle(true);
  showLine("Keep cycling on your own rhythm. You are waiting for one signal: an involuntary yawn, or an involuntary swallow. You cannot force it.");
  speak("Keep cycling. Wait for an involuntary yawn or swallow. When it arrives, tap the screen.");
  // loop minimal cycles under the gate, cap ≈ 2.5 min
  const gateP = raceGate('Tap when the yawn or swallow arrives', 150);
  let settled = false;
  gateP.finally(() => settled = true).catch(()=>{});
  await wait(7);
  while (!settled){
    await sighCycle(false);
    if (settled) break;
  }
  await gateP;
  stopSubBass();
  await say("There it is. Received. Phase one is closed.", 6, {rate:0.75});
}

/* ---- one drain cycle ---- */
async function drainCycle(i, last){
  cue('Inhale — six beats. Slow.', 'Inhale. Six beats');
  await breathTo(1.38, 6, 'Inhale · 6');
  cue('Hold — and SQUEEZE. Quads, glutes, core — eighty percent. Blood into the thighs. Heat out of the pelvis.',
      'Hold and squeeze. Quads, glutes, core. Eighty percent.');
  await holdBreath(5, 'Squeeze · 80%');
  octaveDrop(last);
  cue('DROP. Exhale everything. Release one hundred percent of the tension — instantly.', 'Drop. Release everything.');
  await breathTo(0.80, 5, 'Release');
}

async function phase2(){
  setPhase(1);
  startDrone();
  await say("New sound. New job. This phase is mechanical: drain the charge out of the pelvis and burn it in the big muscles — a surge bled off into a ground wire. The pulse is your clock.", 12);
  await drainCycle(0, false);
  await say("You are not someone resisting a craving. You are a high-performance vehicle that has crossed the finish line. The engine is hot because it performed. Now the ignition turns off.", 12);
  await drainCycle(1, false);
  await holdBreath(3, '');
  await drainCycle(2, true);   // drone stays down
  await say("The sound stays down there with you. Nothing left to burn. The engine is cold and ticking, and there is nowhere to drive tonight.", 10, {rate:0.75});
  const again = await raceGate('Still hot? Tap to run the drain once more', 9);
  if (again){ octaveRestore(); await breathTo(1, 2, ''); await drainCycle(0, true); await holdBreath(2,''); }
  stopDrone(8);
}

/* ---- one AUM cycle ---- */
async function aumCycle(inText, outText, spokenIn, spokenOut){
  aumSwell(true, 4);
  if (inText !== null) cue(inText, spokenIn);
  await breathTo(1.34, 4, 'Inhale · 4');
  aumSwell(false, 8);
  if (outText !== null) cue(outText, spokenOut);
  await breathTo(0.80, 8, 'Exhale · AUM');
}

async function phase3(){
  setPhase(2);
  startAum();
  await say("The machine sounds are gone. What remains is a resonance. It will carry the heat out of your body — and you will hum along, silently, inside your throat.", 11);
  await aumCycle(
    'Inhale — four — all attention to the exact center of the chest. Warmth gathers there.',
    'Exhale — eight — echo the AUM silently in your throat. Warm liquid down the arms… out through the palms of the hands.',
    'Inhale, four. Attention to the center of the chest.',
    'Exhale, eight. Silent AUM. Heat out through the palms.');
  await aumCycle(
    'Inhale — four — back to the center of the chest.',
    'Exhale — the warm liquid drains down the legs… and out through the soles of the feet. The body quietly empties its heat into the dark.',
    'Inhale, four.',
    'Exhale. Heat drains out through the soles of the feet.');
  await aumCycle(
    'Inhale — four.',
    'Notice what the heat leaves behind: a cool, tingling, deeply pleasant stillness. Rest your whole attention on it. This is sukha.',
    null,
    'Notice the cool, pleasant stillness the heat leaves behind. Rest on it.');
  await aumCycle(
    'Inhale — four.',
    'Beneath the coolness: three months of unbroken reserve, sealed like deep groundwater. You are not running on empty. You are wealthy — resting on your own stored power.',
    null,
    'Three months of reserve beneath you. You are wealthy. Nothing to seek.');
  document.body.classList.add('deep');
  await aumCycle('Inhale — four.', 'Exhale — eight. Cooler each round.', null, null);
  stopAum(45);   // 45+ s layered fade under the last cycles
  await aumCycle(null, null, null, null);
  showLine('');
}

async function phase4(){
  setPhase(3);
  startBinaural();
  await say("Last instructions. After these, no more words.", 6, {rate:0.72});
  await say("Become completely still. Choose your final position now — one last adjustment — and then the body does not move again. Not the fingers. Not the feet. The body is furniture: warm, heavy, switched off.", 16, {rate:0.72});
  await say("Breathe naturally. No counting the inhale. Only this: at the very bottom of each exhale — in the silent gap before the next breath begins on its own — place one number. Start at thirty.", 15, {rate:0.72});
  await say("If you lose count — perfect. That is the slipstream taking you. Do not climb back. Whatever number floats by next is the right one.", 11, {rate:0.7});
  breathLabel.textContent = '';
  await say("Thirty.", 4, {rate:0.6, pitch:0.6});
  // narrator silent forever; UI extinguishes; beat fades to obsidian silence
  document.body.classList.add('void');
  showLine('');
  await wait(20);
  fadeBinauralToSilence();
  await wait(95);
  endSession(true);
}

/* ============================================================
   SESSION CONTROL
   ============================================================ */
const PHASES = [preRoll, phase1, phase2, phase3, phase4];

async function runSession(){
  for (const ph of PHASES){
    if (ended) return;
    phaseCtl = new AbortController();
    try { await ph(); }
    catch(e){ if (!(e && e.isAbort)) console.error(e); if (ended) return; }
  }
  if (!ended) endSession(false);   // e.g. phase 4 was skipped
}

function skipPhase(){
  if (phaseCtl) phaseCtl.abort();
  try{ speechSynthesis.cancel(); }catch(e){}
  // silence whatever the current phase left running
  hardCutAmbient(); stopSubBass(); stopDrone(2); stopAum(4);
  breath.anim++; setOrbScale(1); breathLabel.textContent='';
}

function endSession(natural){
  if (ended) return;
  ended = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  if (phaseCtl) phaseCtl.abort();
  document.body.classList.add('ended','void');
  if (!natural) document.body.classList.add('manual');
  if (!natural) killAllAudio(); // natural end: binaural already fading on its own
  setTimeout(() => { try{ A.ctx && A.ctx.close(); }catch(e){} }, natural ? 4000 : 3500);
}

$('skip').addEventListener('click', skipPhase);
$('end').addEventListener('click', () => endSession(false));

/* voice toggle */
const vr = $('voiceRow');
function toggleVoice(){
  voiceOn = !voiceOn;
  vr.classList.toggle('on', voiceOn);
  vr.setAttribute('aria-checked', String(voiceOn));
}
vr.addEventListener('click', toggleVoice);
vr.addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); toggleVoice(); }});

/* begin */
$('begin').addEventListener('click', async () => {
  audioInit();
  try{ await A.ctx.resume(); }catch(e){}
  if ('wakeLock' in navigator){ try{ await navigator.wakeLock.request('screen'); }catch(e){} }
  if (voiceOn && 'speechSynthesis' in window){ loadVoices(); }
  $('start').classList.add('gone');
  runSession();
});
