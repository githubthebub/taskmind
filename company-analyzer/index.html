<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    padding: 2rem 1rem 1.5rem;
    text-align: center;
    border-bottom: 1px solid #222;
  }
  header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
  header p { color: #888; margin-top: 0.4rem; font-size: 0.9rem; }

  .input-area {
    width: 100%;
    max-width: 640px;
    padding: 2rem 1rem;
    display: flex;
    gap: 0.5rem;
  }
  #url-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1a1a;
    color: #e0e0e0;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #url-input:focus { border-color: #4f8ff7; }
  #url-input::placeholder { color: #555; }
  #analyze-btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    background: #4f8ff7;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  #analyze-btn:hover { background: #3a7be0; }
  #analyze-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  #error {
    max-width: 640px;
    padding: 0 1rem;
    color: #f87171;
    font-size: 0.85rem;
    min-height: 1.2em;
  }

  #loading {
    display: none;
    padding: 3rem 1rem;
    text-align: center;
    color: #888;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #333;
    border-top-color: #4f8ff7;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results {
    display: none;
    width: 100%;
    max-width: 720px;
    padding: 0 1rem 3rem;
  }

  .card {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #4f8ff7;
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.8rem;
  }
  .card p, .card li {
    line-height: 1.6;
    color: #ccc;
    font-size: 0.92rem;
  }
  .card ul { padding-left: 1.2rem; }
  .card li { margin-bottom: 0.5rem; }
  .card li strong { color: #e0e0e0; }

  .outreach-box {
    background: #111;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 1rem;
    white-space: pre-wrap;
    font-size: 0.88rem;
    line-height: 1.7;
    color: #ccc;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    background: #333;
    border: none;
    color: #aaa;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .copy-btn:hover { background: #444; color: #fff; }

  .opp-num {
    display: inline-block;
    background: #4f8ff7;
    color: #fff;
    width: 22px; height: 22px;
    border-radius: 50%;
    text-align: center;
    line-height: 22px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-right: 0.4rem;
  }
  .time-badge {
    display: inline-block;
    background: #1e3a1e;
    color: #6ee06e;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.78rem;
    margin-left: 0.3rem;
  }
</style>
</head>
<body>

<header>
  <h1>Company Analyzer</h1>
  <p>Paste a company website URL to get automation insights and outreach copy</p>
</header>

<div class="input-area">
  <input type="text" id="url-input" placeholder="https://example.com" />
  <button id="analyze-btn" onclick="analyze()">Analyze</button>
</div>
<div id="error"></div>

<div id="loading">
  <div class="spinner"></div>
  <p>Analyzing company website...</p>
</div>

<div id="results">
  <div class="card">
    <h2>Company Summary</h2>
    <p id="summary"></p>
  </div>

  <div class="card">
    <h2>Automation Opportunities</h2>
    <ul id="opportunities"></ul>
  </div>

  <div class="card">
    <h2>Outreach Message</h2>
    <div class="outreach-box" id="outreach">
      <button class="copy-btn" onclick="copyOutreach()">Copy</button>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('url-input');
const btn = document.getElementById('analyze-btn');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');
const resultsEl = document.getElementById('results');

input.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });

async function analyze() {
  const url = input.value.trim();
  if (!url) { errorEl.textContent = 'Please enter a URL.'; return; }

  errorEl.textContent = '';
  btn.disabled = true;
  loadingEl.style.display = 'block';
  resultsEl.style.display = 'none';

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Server error' }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    render(data);
  } catch (e) {
    errorEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    loadingEl.style.display = 'none';
  }
}

function render(data) {
  document.getElementById('summary').textContent = data.summary;

  const ul = document.getElementById('opportunities');
  ul.innerHTML = '';
  data.opportunities.forEach((opp, i) => {
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="opp-num">${i + 1}</span>` +
      `<strong>${esc(opp.title)}</strong>` +
      `<span class="time-badge">${esc(opp.time_saved)}</span>` +
      `<br>${esc(opp.description)}`;
    ul.appendChild(li);
  });

  const outreachBox = document.getElementById('outreach');
  const copyBtn = outreachBox.querySelector('.copy-btn');
  outreachBox.textContent = data.outreach;
  outreachBox.appendChild(copyBtn);

  resultsEl.style.display = 'block';
  resultsEl.scrollIntoView({ behavior: 'smooth' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function copyOutreach() {
  const text = document.getElementById('outreach').textContent.replace('Copy', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}
</script>
</body>
</html>
