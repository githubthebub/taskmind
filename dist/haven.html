<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haven — the companion that wants you to leave</title>
<meta name="description" content="A companion built to downregulate your nervous system, not monetize your loneliness.">
<style>
/* =========================================================
   Haven — visual system
   Calm, dark, unhurried. Everything animates slowly.
   ========================================================= */

:root {
  --c1: #0e1024; --c2: #181a35; --c3: #232042;        /* ambient, per companion */
  --accent: #a99df2;
  --accent-soft: rgba(169,157,242,.16);
  --glow: rgba(183,166,240,.35);
  --ink: #eceaf4;
  --ink-dim: rgba(236,234,244,.62);
  --ink-faint: rgba(236,234,244,.38);
  --card: rgba(255,255,255,.055);
  --card-edge: rgba(255,255,255,.10);
  --radius: 22px;
  --breath: 0;                                         /* 0..1, set by JS */
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--c1);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- ambient background ---------- */
.bg-gradient {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(120% 90% at 70% -10%, var(--c3) 0%, transparent 60%),
    radial-gradient(100% 80% at 10% 110%, var(--c2) 0%, transparent 55%),
    var(--c1);
  transition: background 2s ease;
}
.bg-particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bg-particles span {
  position: absolute;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--glow);
  filter: blur(1px);
  opacity: 0;
  animation: drift linear infinite;
}
@keyframes drift {
  0%   { transform: translateY(20px); opacity: 0; }
  15%  { opacity: .5; }
  85%  { opacity: .25; }
  100% { transform: translateY(-90vh); opacity: 0; }
}

/* ---------- layout ---------- */
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 20px 140px;
  min-height: 100vh;
}
.screen { animation: fadeUp .8s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: .2px; }
h1 { font-size: 2.1rem; line-height: 1.15; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.08rem; }
p  { line-height: 1.65; }

.dim   { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: .85rem; }
.accent{ color: var(--accent); }
.hidden{ display: none !important; }

.stack   { display: flex; flex-direction: column; gap: 16px; }
.row     { display: flex; gap: 12px; align-items: center; }
.spread  { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* ---------- cards & buttons ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius);
  padding: 20px 22px;
  backdrop-filter: blur(14px);
}
.card.click { cursor: pointer; transition: transform .35s ease, border-color .35s ease, background .35s ease; }
.card.click:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--accent-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--sans); font-size: 1rem; font-weight: 600;
  color: var(--c1);
  background: var(--accent);
  border: none; border-radius: 16px;
  padding: 15px 26px;
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease, opacity .3s ease;
  box-shadow: 0 6px 30px -8px var(--glow);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 34px -8px var(--glow); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn.ghost {
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--card-edge); box-shadow: none;
}
.btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
.btn.wide { width: 100%; }

.chip {
  font-size: .92rem; font-weight: 500;
  color: var(--ink-dim);
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: 999px;
  padding: 11px 18px;
  cursor: pointer;
  transition: all .3s ease;
}
.chip:hover { color: var(--ink); border-color: var(--ink-faint); }
.chip.on {
  color: var(--c1); background: var(--accent);
  border-color: var(--accent);
}
.chips { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- sliders ---------- */
input[type="range"] {
  width: 100%; appearance: none; -webkit-appearance: none;
  height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,.12) var(--fill, 50%));
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--ink); border: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.4);
  cursor: pointer;
}

/* ---------- companion portrait ---------- */
.portrait-wrap {
  position: relative;
  width: min(72vw, 300px);
  margin: 0 auto;
}
.portrait-glow {
  position: absolute; inset: -12%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
  opacity: calc(.45 + var(--breath) * .55);
  transform: scale(calc(.94 + var(--breath) * .12));
  z-index: 0;
  transition: opacity .2s linear;
}
.portrait {
  position: relative; z-index: 1;
  width: 100%; aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 26px;
  border: 1px solid var(--card-edge);
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
  transform: scale(calc(1 + var(--breath) * .022));
  transition: transform .15s linear;
  display: block;
}
.portrait.ambient { animation: ambientBreath 7s ease-in-out infinite; transform: none; }
@keyframes ambientBreath {
  0%, 100% { transform: scale(1); filter: brightness(.97); }
  40%      { transform: scale(1.018); filter: brightness(1.04); }
  60%      { transform: scale(1.018); filter: brightness(1.04); }
}
.portrait-sm {
  width: 74px; height: 96px; object-fit: cover;
  border-radius: 16px; border: 1px solid var(--card-edge);
  flex-shrink: 0;
}

/* portrait fallback when image missing */
.portrait-fallback {
  width: 100%; aspect-ratio: 3/4;
  border-radius: 26px;
  border: 1px solid var(--card-edge);
  background: linear-gradient(160deg, var(--c2), var(--c3));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 4rem; color: var(--accent);
}
.portrait-fallback.portrait-sm { width: 74px; height: 96px; font-size: 1.7rem; border-radius: 16px; }

/* ---------- speech bubble ---------- */
.bubble {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: 20px;
  padding: 18px 22px;
  font-size: 1.06rem;
  line-height: 1.7;
  min-height: 64px;
  backdrop-filter: blur(14px);
}
.bubble .cursor {
  display: inline-block; width: 8px; height: 1.1em;
  background: var(--accent); vertical-align: text-bottom;
  margin-left: 2px; border-radius: 2px;
  animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- breath ring ---------- */
.breath-stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.ring-wrap { position: relative; width: 230px; height: 230px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 3; }
.ring-fill  {
  fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round;
  filter: drop-shadow(0 0 10px var(--glow));
}
.ring-core {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 4px;
}
.ring-core .phase-name { font-family: var(--serif); font-size: 1.5rem; }
.ring-core .phase-count { color: var(--ink-faint); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
.ring-orb {
  position: absolute; left: 50%; top: 50%;
  width: 130px; height: 130px;
  margin: -65px 0 0 -65px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, var(--accent-soft), transparent 70%),
              radial-gradient(circle, var(--glow), transparent 72%);
  transform: scale(calc(.55 + var(--breath) * .5));
  transition: transform .15s linear;
  z-index: -1;
}

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat {
  background: var(--card); border: 1px solid var(--card-edge);
  border-radius: 18px; padding: 16px 18px;
}
.stat .num { font-family: var(--serif); font-size: 1.9rem; color: var(--accent); line-height: 1.2; }
.stat .lbl { color: var(--ink-faint); font-size: .82rem; margin-top: 2px; }

.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
.bars .bar {
  flex: 1; border-radius: 6px 6px 3px 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-soft));
  min-height: 4px; opacity: .85;
  position: relative;
}
.bars .bar.neg { background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.06)); }

/* ---------- SOS button ---------- */
.sos-btn {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 50;
  display: flex; align-items: center; gap: 10px;
  background: rgba(20, 16, 30, .82);
  color: var(--ink);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 14px 26px;
  font-size: .98rem; font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px -10px var(--glow);
  transition: transform .3s ease;
}
.sos-btn:hover { transform: translateX(-50%) translateY(-2px); }
.sos-wave {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent);
  animation: sosPulse 2.6s ease-in-out infinite;
}
@keyframes sosPulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--glow); }
  50%      { box-shadow: 0 0 0 10px transparent; }
}

/* ---------- urge wave animation ---------- */
.wave-stage {
  position: relative; height: 140px; overflow: hidden;
  border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--card-edge);
}
.wave-stage svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 80%; }
.wave-stage .w1 { animation: waveSlide 9s linear infinite; opacity: .5; }
.wave-stage .w2 { animation: waveSlide 13s linear infinite reverse; opacity: .3; }
@keyframes waveSlide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.wave-timer {
  position: absolute; top: 14px; left: 0; right: 0; text-align: center;
  font-family: var(--serif); font-size: 1.6rem; color: var(--ink);
}

/* ---------- misc ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.brand { font-family: var(--serif); font-size: 1.25rem; letter-spacing: .04em; }
.brand em { color: var(--accent); font-style: normal; }
.linklike {
  background: none; border: none; color: var(--ink-faint);
  font-size: .9rem; cursor: pointer; padding: 6px 4px;
}
.linklike:hover { color: var(--ink); }

.divider { border: none; border-top: 1px solid var(--card-edge); margin: 8px 0; }

.notice {
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  background: var(--accent-soft);
  border-radius: 0 14px 14px 0;
  font-size: .92rem; line-height: 1.6; color: var(--ink-dim);
}

.fade-slow { animation: fadeUp 1.6s ease both; }

@media (prefers-reduced-motion: reduce) {
  .bg-particles span, .portrait.ambient, .sos-wave,
  .wave-stage .w1, .wave-stage .w2, .portrait-fallback::before { animation: none !important; }
  .screen, .fade-slow { animation-duration: .01s; }
}

@media (max-width: 480px) {
  main { padding: 20px 14px 130px; }
  h1 { font-size: 1.7rem; }
  .stat .num { font-size: 1.5rem; }
}

</style>
</head>
<body>

  <!-- ambient background layers -->
  <div class="bg-gradient" id="bgGradient"></div>
  <div class="bg-particles" id="bgParticles" aria-hidden="true"></div>

  <button id="sosBtn" class="sos-btn hidden" title="Feeling the pull? Ride it out here.">
    <span class="sos-wave" aria-hidden="true"></span>
    <span class="sos-label">I'm feeling the pull</span>
  </button>

/* =========================================================
   Haven — local-only state. No accounts, no servers.
   ========================================================= */

const STORE_KEY = 'haven.v1';

const State = {
  data: null,

  defaults() {
    return {
      profile: {
        companion: null,        // companion id
        startPoint: null,       // onboarding self-assessment id
        monthlySpend: 0,        // what they told us they spend / month
        name: '',               // what the companions call you (text surfaces only)
        goalName: '',           // what the redirected money is for
        goalAmount: 0,
        lastMilestone: 0,       // highest milestone greeting already shown
        createdAt: Date.now()
      },
      settings: { voice: true, ambient: true },
      sessions: [],             // {ts, practiceId, minutes, before, after}
      urges: [],                // {ts, type, spotName, before, after, avoided}
      checkins: []              // {ts, tension}
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      this.data = raw ? Object.assign(this.defaults(), JSON.parse(raw)) : this.defaults();
    } catch (e) {
      this.data = this.defaults();
    }
    return this.data;
  },

  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { /* private mode */ }
  },

  reset() {
    localStorage.removeItem(STORE_KEY);
    this.data = this.defaults();
  },

  get profile()  { return this.data.profile; },
  get companion(){ return COMPANIONS[this.data.profile.companion] || null; },

  logSession(practiceId, minutes, before, after) {
    this.data.sessions.push({ ts: Date.now(), practiceId, minutes, before, after });
    this.save();
  },

  logUrge(entry) {
    this.data.urges.push(Object.assign({ ts: Date.now() }, entry));
    this.save();
  },

  /* ---------- derived stats ---------- */

  minutesToday() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    return this.data.sessions
      .filter(s => s.ts >= start.getTime())
      .reduce((sum, s) => sum + s.minutes, 0);
  },

  totalMinutes() {
    return this.data.sessions.reduce((sum, s) => sum + s.minutes, 0);
  },

  daysShownUp() {
    const days = new Set();
    this.data.sessions.forEach(s => days.add(new Date(s.ts).toDateString()));
    this.data.urges.forEach(u => days.add(new Date(u.ts).toDateString()));
    return days.size;
  },

  urgesSurfed() { return this.data.urges.length; },

  moneyRedirected() {
    return this.data.urges.reduce((sum, u) => sum + (u.avoided || 0), 0);
  },

  /* average tension drop across sessions that recorded both ends */
  avgRelease() {
    const pairs = this.data.sessions.filter(s => s.before != null && s.after != null);
    if (!pairs.length) return null;
    const total = pairs.reduce((sum, s) => sum + (s.before - s.after), 0);
    return total / pairs.length;
  },

  recentSessions(n) {
    return this.data.sessions.slice(-n);
  }
};


/* ---- js/breath.js ---- */
/* =========================================================
   Haven — breath engine
   Drives a timed phase loop and reports progress so the UI
   (ring, character glow, cues) can move with the breath.
   ========================================================= */

class BreathEngine {
  /**
   * @param {object} pattern   entry from PATTERNS
   * @param {number} cycles    how many full cycles to run
   * @param {object} cbs       { onPhase(phase, cycle, cycles), onProgress(phaseFrac, phase), onCycle(i), onDone() }
   */
  constructor(pattern, cycles, cbs) {
    this.pattern = pattern;
    this.cycles = cycles;
    this.cbs = cbs || {};
    this._raf = null;
    this._running = false;
    this._stopped = false;
  }

  start() {
    this._running = true;
    this._cycle = 0;
    this._phaseIx = -1;
    this._phaseStart = 0;
    this._nextPhase(performance.now());
    this._tick = this._tick.bind(this);
    this._raf = requestAnimationFrame(this._tick);
  }

  stop() {
    this._stopped = true;
    this._running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  _nextPhase(now) {
    this._phaseIx++;
    if (this._phaseIx >= this.pattern.phases.length) {
      this._phaseIx = 0;
      this._cycle++;
      if (this.cbs.onCycle) this.cbs.onCycle(this._cycle);
      if (this._cycle >= this.cycles) {
        this._running = false;
        if (this.cbs.onDone) this.cbs.onDone();
        return;
      }
    }
    this._phaseStart = now;
    const phase = this.pattern.phases[this._phaseIx];
    if (this.cbs.onPhase) this.cbs.onPhase(phase, this._cycle, this.cycles);
  }

  _tick(now) {
    if (!this._running || this._stopped) return;
    const phase = this.pattern.phases[this._phaseIx];
    const frac = Math.min(1, (now - this._phaseStart) / (phase.secs * 1000));
    if (this.cbs.onProgress) this.cbs.onProgress(frac, phase);
    if (frac >= 1) {
      this._nextPhase(now);
      if (!this._running) return;
    }
    this._raf = requestAnimationFrame(this._tick);
  }
}

/* Maps breath phase progress to a 0..1 "fullness" for ring & character.
   Inhale ramps up, hold keeps level, exhale ramps down with an ease. */
function breathFullness(frac, phase, prevFullness) {
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  if (phase.kind === 'in')  {
    // top-up inhales start from where the last inhale left off
    const base = phase.name === 'Top-up' ? 0.72 : 0.08;
    const top  = phase.name === 'Top-up' ? 1.0  : 0.72;
    return base + (top - base) * easeInOut(frac);
  }
  if (phase.kind === 'hold') return prevFullness != null ? prevFullness : 1;
  return 1.0 - 0.92 * easeInOut(frac); // out
}

/* ---------- tiny DOM + speech helpers (shared with app.js) ---------- */

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function pick(textOrMap) {
  if (typeof textOrMap === 'string') return textOrMap;
  const c = State.profile.companion || 'sera';
  return textOrMap[c] || textOrMap.sera;
}

/* stable key for a spoken line — must match tools/voice-corpus.js */
function lineKey(text) {
  let h = 5381;
  for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

let _voiceAudio = null;
let _voiceDone = null;   // resolver of the in-flight speak() promise

function _resolveVoice() {
  if (_voiceDone) { const r = _voiceDone; _voiceDone = null; r(); }
  Ambient.duck(false);
}

function stopSpeech() {
  if (_voiceAudio) { _voiceAudio.pause(); _voiceAudio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  _resolveVoice();
}

function speakSynth(text, res) {
  if (!window.speechSynthesis) { res(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.86; u.pitch = 1.0; u.volume = 0.9;
  u.onend = u.onerror = () => res();
  speechSynthesis.speak(u);
}

/* Speak with the companion's pre-generated AI voice clip when the library
   has it (local file first, then the hosted copy), else fall back to the
   browser's speech synthesis. Nothing is generated at runtime.
   Returns { spoke, done } — done resolves when the line has finished. */
function speak(text, cidOverride) {
  if (!State.data.settings.voice) return { spoke: false, done: Promise.resolve() };
  stopSpeech();
  const cid = cidOverride || State.profile.companion || 'sera';
  const lib = (typeof VOICE_LIB !== 'undefined' && VOICE_LIB[cid]) || null;
  const key = lineKey(text);
  const done = new Promise(res => { _voiceDone = res; });
  const finish = () => _resolveVoice();
  Ambient.duck(true);

  if (lib && lib[key]) {
    const audio = new Audio();
    _voiceAudio = audio;
    let stage = 0;                                  // 0 = local file, 1 = hosted
    audio.onended = () => { if (audio === _voiceAudio) finish(); };
    audio.onerror = () => {
      if (audio !== _voiceAudio) return;
      if (stage === 0) { stage = 1; audio.src = lib[key]; audio.play().catch(() => {}); }
      else speakSynth(text, finish);
    };
    const ext = (lib[key].split('.').pop() || 'mp3').split('?')[0];
    audio.src = `assets/voice/${cid}/${key}.${ext}`;
    audio.play().catch(() => {});
    return { spoke: true, done };
  }
  speakSynth(text, finish);
  return { spoke: true, done };
}

/* ---------- ambient sound bed ----------
   Procedural brown noise through a slow lowpass — a distant-tide texture.
   The filter opens with the inhale and settles with the exhale; the whole
   bed ducks while a companion is speaking. No audio assets, no cost. */
const Ambient = {
  ctx: null, gain: null, filter: null, running: false,

  start() {
    if (State.data.settings.ambient === false) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const len = this.ctx.sampleRate * 4;
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < len; i++) {
          const white = Math.random() * 2 - 1;
          last = (last + 0.02 * white) / 1.02;
          d[i] = last * 3.5;
        }
        const src = this.ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass'; this.filter.frequency.value = 320; this.filter.Q.value = 0.4;
        this.gain = this.ctx.createGain();
        this.gain.gain.value = 0;
        src.connect(this.filter); this.filter.connect(this.gain); this.gain.connect(this.ctx.destination);
        src.start();
      }
      this.ctx.resume();
      this.running = true;
      this.gain.gain.setTargetAtTime(0.05, this.ctx.currentTime, 2);
    } catch (e) { /* no audio available — silence is also calm */ }
  },

  stop() {
    if (this.gain) this.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.8);
    this.running = false;
  },

  setBreath(v) {
    if (this.running && this.filter) {
      this.filter.frequency.setTargetAtTime(280 + 260 * v, this.ctx.currentTime, 0.15);
    }
  },

  duck(speaking) {
    if (this.running && this.gain) {
      this.gain.gain.setTargetAtTime(speaking ? 0.018 : 0.05, this.ctx.currentTime, 0.4);
    }
  }
};

/* ---------- screen wake lock (sessions run eyes-closed) ---------- */
const Wake = {
  lock: null,
  async on() {
    try { this.lock = await (navigator.wakeLock && navigator.wakeLock.request('screen')); }
    catch (e) { this.lock = null; }
  },
  off() {
    try { if (this.lock) this.lock.release(); } catch (e) { /* already gone */ }
    this.lock = null;
  }
};

function pulse() { if (navigator.vibrate) navigator.vibrate(12); }

function typewrite(node, text, msPerChar, done) {
  node.textContent = '';
  const cursor = el('<span class="cursor"></span>');
  node.appendChild(cursor);
  let i = 0;
  const step = () => {
    if (!node.isConnected) return;                 // screen was torn down
    if (i < text.length) {
      cursor.before(document.createTextNode(text[i++]));
      setTimeout(step, msPerChar);
    } else {
      cursor.remove();
      if (done) done();
    }
  };
  step();
}

function setBreathVar(v) {
  const clamped = Math.max(0, Math.min(1, v));
  document.documentElement.style.setProperty('--breath', String(clamped));
  Ambient.setBreath(clamped);
}

function fmtMoney(n) {
  return '$' + (Math.round(n * 100) / 100).toLocaleString();
}

/* ---------- tension slider component ---------- */

function tensionSlider(label, initial, onChange) {
  const wrap = el(`
    <div class="card stack">
      <div class="spread">
        <h3>${label}</h3>
        <span class="accent" style="font-family:var(--serif);font-size:1.5rem" data-val>${initial}</span>
      </div>
      <input type="range" min="0" max="10" step="1" value="${initial}">
      <div class="spread faint"><span>loose · calm</span><span>wound tight</span></div>
    </div>`);
  const input = wrap.querySelector('input');
  const val = wrap.querySelector('[data-val]');
  const paint = () => {
    input.style.setProperty('--fill', (input.value / 10 * 100) + '%');
    val.textContent = input.value;
    if (onChange) onChange(Number(input.value));
  };
  input.addEventListener('input', paint);
  paint();
  return wrap;
}

/* =========================================================
   Session player
   ========================================================= */

const Session = {
  active: null,

  start(practice) {
    const c = State.companion;
    this.active = { practice, before: null, after: null, cancelled: false, engine: null };
    const app = document.getElementById('app');
    app.innerHTML = '';
    document.getElementById('sosBtn').classList.add('hidden');

    /* --- pre check-in --- */
    let tension = 5;
    const pre = el(`
      <div class="screen stack">
        <div class="topbar">
          <span class="brand">${practice.title}</span>
          <button class="linklike" data-x>close</button>
        </div>
        <p class="dim">${pick(c.greetings[App.timeOfDay()])}</p>
      </div>`);
    pre.appendChild(tensionSlider('How wound up are you right now?', tension, v => tension = v));
    const go = el('<button class="btn wide">Begin</button>');
    pre.appendChild(go);
    pre.querySelector('[data-x]').onclick = () => this.abort();
    go.onclick = () => {
      this.active.before = tension;
      Ambient.start();
      Wake.on();
      this._run();
    };
    app.appendChild(pre);
  },

  abort() {
    if (this.active && this.active.engine) this.active.engine.stop();
    stopSpeech();
    this.active = null;
    setBreathVar(0);
    App.home();
  },

  _stage() {
    const c = State.companion;
    const app = document.getElementById('app');
    app.innerHTML = '';
    const stage = el(`
      <div class="screen stack" style="align-items:center; text-align:center;">
        <div class="topbar" style="width:100%; text-align:left;">
          <span class="brand">${this.active.practice.title}</span>
          <span class="row" style="gap:14px">
            <button class="linklike" data-voice>${State.data.settings.voice ? 'voice on' : 'voice off'}</button>
            <button class="linklike" data-amb>${State.data.settings.ambient === false ? 'sound off' : 'sound on'}</button>
            <button class="linklike" data-x>end</button>
          </span>
        </div>
        <div class="portrait-wrap" style="width:min(50vw,190px)">
          <div class="portrait-glow"></div>
          ${App.portraitImg(c, 'portrait')}
        </div>
        <div class="bubble" data-bubble style="width:100%"></div>
        <div data-zone style="width:100%"></div>
      </div>`);
    stage.querySelector('[data-x]').onclick = () => this.abort();
    const vbtn = stage.querySelector('[data-voice]');
    vbtn.onclick = () => {
      State.data.settings.voice = !State.data.settings.voice;
      State.save();
      vbtn.textContent = State.data.settings.voice ? 'voice on' : 'voice off';
      if (!State.data.settings.voice) stopSpeech();
    };
    const abtn = stage.querySelector('[data-amb]');
    abtn.onclick = () => {
      State.data.settings.ambient = State.data.settings.ambient === false;
      State.save();
      abtn.textContent = State.data.settings.ambient ? 'sound on' : 'sound off';
      if (State.data.settings.ambient) Ambient.start(); else Ambient.stop();
    };
    app.appendChild(stage);
    return {
      bubble: stage.querySelector('[data-bubble]'),
      zone: stage.querySelector('[data-zone]')
    };
  },

  _run() {
    const steps = this.active.practice.script;
    const ui = this._stage();
    let ix = 0;

    const next = () => {
      if (!this.active) return;
      if (ix >= steps.length) return this._finish();
      const step = steps[ix++];
      if (step.t === 'say')    return this._say(ui, step, next);
      if (step.t === 'breath') return this._breath(ui, step, next);
      if (step.t === 'still')  return this._still(ui, step, next);
      if (step.t === 'scan')   return this._scan(ui, step, next);
      if (step.t === 'choose') return this._choose(ui, step, next);
      next();
    };
    next();
  },

  _say(ui, step, next) {
    ui.zone.innerHTML = '';
    const text = pick(step.text);
    const voice = speak(text);
    typewrite(ui.bubble, text, 34, () => {
      const hold = step.hold != null ? step.hold : Math.max(2200, text.length * 42);
      const proceed = () => { if (this.active) next(); };
      if (voice.spoke) {
        // pace to the voice: advance shortly after the companion finishes,
        // with a generous safety timeout in case audio stalls
        let advanced = false;
        const go = () => { if (!advanced) { advanced = true; setTimeout(proceed, 800); } };
        voice.done.then(go);
        setTimeout(go, hold + 15000);
      } else {
        setTimeout(proceed, hold);
      }
    });
  },

  /* interactive fork: companion asks, you pick, they respond */
  _choose(ui, step, next) {
    ui.zone.innerHTML = '';
    speak(step.prompt);
    typewrite(ui.bubble, step.prompt, 32, null);
    const chips = el('<div class="chips" style="justify-content:center"></div>');
    step.options.forEach(opt => {
      const ch = el(`<button class="chip">${opt.label}</button>`);
      ch.onclick = () => {
        chips.querySelectorAll('.chip').forEach(x => { x.disabled = true; x.classList.remove('on'); });
        ch.classList.add('on');
        const voice = speak(opt.reply);
        typewrite(ui.bubble, opt.reply, 32, () => {
          const hold = Math.max(2600, opt.reply.length * 40);
          const proceed = () => { if (this.active) next(); };
          if (voice.spoke) {
            let advanced = false;
            const go = () => { if (!advanced) { advanced = true; setTimeout(proceed, 900); } };
            voice.done.then(go);
            setTimeout(go, hold + 15000);
          } else {
            setTimeout(proceed, hold);
          }
        });
      };
      chips.appendChild(ch);
    });
    ui.zone.appendChild(chips);
  },

  _still(ui, step, next) {
    ui.zone.innerHTML = '';
    ui.bubble.textContent = step.text;
    speak(step.text);
    const bar = el(`<div class="card"><div class="faint" style="text-align:center" data-t></div></div>`);
    ui.zone.appendChild(bar);
    let left = step.secs;
    const t = bar.querySelector('[data-t]');
    const tick = () => {
      if (!this.active) return;
      t.textContent = left > 0 ? `${left}s of quiet` : '';
      if (left-- > 0) setTimeout(tick, 1000); else next();
    };
    tick();
  },

  _breath(ui, step, next) {
    const pattern = PATTERNS[step.pattern];
    ui.zone.innerHTML = '';
    ui.bubble.textContent = pattern.phases[0].cue;

    const R = 108, CIRC = 2 * Math.PI * R;
    const ring = el(`
      <div class="breath-stage">
        <div class="ring-wrap">
          <div class="ring-orb"></div>
          <svg viewBox="0 0 230 230">
            <circle class="ring-track" cx="115" cy="115" r="${R}"></circle>
            <circle class="ring-fill" cx="115" cy="115" r="${R}"
                    stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"></circle>
          </svg>
          <div class="ring-core">
            <div class="phase-name" data-phase>Ready</div>
            <div class="phase-count" data-count></div>
          </div>
        </div>
      </div>`);
    ui.zone.appendChild(ring);

    const fill = ring.querySelector('.ring-fill');
    const phaseEl = ring.querySelector('[data-phase]');
    const countEl = ring.querySelector('[data-count]');
    let coachIx = 0;
    let lastFullness = 0;

    const engine = new BreathEngine(pattern, step.cycles, {
      onPhase: (phase, cycle, cycles) => {
        phaseEl.textContent = phase.name;
        countEl.textContent = `breath ${cycle + 1} of ${cycles}`;
        pulse();
      },
      onProgress: (frac, phase) => {
        lastFullness = breathFullness(frac, phase, lastFullness);
        setBreathVar(lastFullness);
        fill.style.strokeDashoffset = String(CIRC * (1 - lastFullness));
      },
      onCycle: () => {
        if (step.coach && coachIx < step.coach.length) {
          const line = step.coach[coachIx++];
          ui.bubble.textContent = line;
          speak(line);
        }
      },
      onDone: () => { setBreathVar(0); if (this.active) next(); }
    });
    this.active.engine = engine;
    engine.start();
  },

  _scan(ui, step, next) {
    ui.zone.innerHTML = '';
    const prog = el(`
      <div class="card stack">
        <div class="spread">
          <h3 data-region></h3>
          <span class="faint" data-ix></span>
        </div>
        <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden">
          <div data-bar style="height:100%;width:0;background:var(--accent);transition:width 1s linear"></div>
        </div>
      </div>`);
    ui.zone.appendChild(prog);
    const regionEl = prog.querySelector('[data-region]');
    const ixEl = prog.querySelector('[data-ix]');
    const barEl = prog.querySelector('[data-bar]');

    let r = 0;
    const runRegion = () => {
      if (!this.active) return;
      if (r >= step.regions.length) return next();
      const region = step.regions[r];
      regionEl.textContent = region.name;
      ixEl.textContent = `${r + 1} / ${step.regions.length}`;
      speak(region.text);
      typewrite(ui.bubble, region.text, 30, null);
      barEl.style.width = '0%';
      let elapsed = 0;
      const tick = () => {
        if (!this.active) return;
        elapsed++;
        barEl.style.width = Math.min(100, elapsed / region.secs * 100) + '%';
        if (elapsed < region.secs) setTimeout(tick, 1000);
        else { r++; runRegion(); }
      };
      setTimeout(tick, 1000);
    };
    runRegion();
  },

  _finish() {
    const c = State.companion;
    const p = this.active.practice;
    const before = this.active.before;
    const app = document.getElementById('app');
    app.innerHTML = '';

    let after = Math.max(0, (before != null ? before : 5) - 2);
    const doneScreen = el(`
      <div class="screen stack">
        <h2>And… back.</h2>
        <p class="dim">Before you go — same question, honest answer.</p>
      </div>`);
    doneScreen.appendChild(tensionSlider('How wound up are you now?', after, v => after = v));
    const save = el('<button class="btn wide">Done</button>');
    doneScreen.appendChild(save);
    app.appendChild(doneScreen);

    save.onclick = () => {
      State.logSession(p.id, p.minutes, before, after);
      const delta = before - after;
      const farewell = c.farewells[Math.floor((State.data.sessions.length - 1) % c.farewells.length)];
      app.innerHTML = '';
      const gem = GEMS[Math.floor(Math.random() * GEMS.length)];
      const out = el(`
        <div class="screen stack" style="text-align:center; align-items:center;">
          <div class="portrait-wrap" style="width:min(46vw,170px)">
            <div class="portrait-glow" style="--breath:.35"></div>
            ${App.portraitImg(c, 'portrait ambient')}
          </div>
          <h2>${delta > 0 ? `Tension down ${delta} point${delta === 1 ? '' : 's'}.` : delta === 0 ? 'You showed up. That counts.' : 'Some days are like that. Showing up still counts.'}</h2>
          <div class="bubble" style="width:100%" data-bye></div>
          <div class="card fade-slow" style="width:100%"><p class="dim" style="font-style:italic; font-family:var(--serif); font-size:1rem">“${gem}”</p></div>
          <button class="btn wide" data-home>Close &amp; go live your life</button>
        </div>`);
      app.appendChild(out);
      speak(farewell);
      typewrite(out.querySelector('[data-bye]'), farewell, 34, null);
      out.querySelector('[data-home]').onclick = () => { this.active = null; App.home(); };
    };
  }
};

const Surf = {
  start() {

      chips.appendChild(ch);
    });

  },

  _step2(log) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    let intensity = 7;
    const s2 = el(`
      <div class="screen stack">
        <div class="topbar"><span class="brand">The Pull</span><button class="linklike" data-x>close</button></div>
        <div class="stack">
          <h3>Where do you feel it in your body?</h3>
          <p class="dim">Urges are physical. Finding the sensation is how you get upstream of it.</p>
          <div class="chips" data-spots></div>
        </div>
      </div>`);
    s2.querySelector('[data-x]').onclick = () => App.home();
    s2.appendChild(tensionSlider('How strong is it?', intensity, v => intensity = v));
    const go = el('<button class="btn wide" disabled>Ride the wave</button>');
    const spots = s2.querySelector('[data-spots]');
    BODY_SPOTS.forEach(name => {
      const ch = el(`<button class="chip">${name}</button>`);
      ch.onclick = () => {
        spots.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
        ch.classList.add('on');
        log.spot = name;
        go.disabled = false;
      };
      spots.appendChild(ch);
    });
    s2.appendChild(go);
    go.onclick = () => { log.before = intensity; this._wave(log); };
    app.appendChild(s2);
  },

  _wave(log) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const TOTAL = 96;   // 8 breaths at 12s
    const s3 = el(`
      <div class="screen stack">
        <div class="topbar"><span class="brand">Riding it out</span><span class="faint">don't switch apps — that's the wave talking</span></div>
        <div class="wave-stage">
          <div class="wave-timer" data-t>90</div>
          <svg class="w1" viewBox="0 0 1200 100" preserveAspectRatio="none">
            <path d="M0 60 Q 75 20 150 60 T 300 60 T 450 60 T 600 60 T 750 60 T 900 60 T 1050 60 T 1200 60 V100 H0 Z" fill="var(--accent)"/>
          </svg>
          <svg class="w2" viewBox="0 0 1200 100" preserveAspectRatio="none">
            <path d="M0 65 Q 100 35 200 65 T 400 65 T 600 65 T 800 65 T 1000 65 T 1200 65 V100 H0 Z" fill="var(--accent)"/>
          </svg>
        </div>
        <div class="bubble" data-b></div>
        <div class="breath-stage">
          <div class="ring-wrap" style="width:170px;height:170px">
            <div class="ring-orb" style="width:96px;height:96px;margin:-48px 0 0 -48px"></div>
            <svg viewBox="0 0 230 230">
              <circle class="ring-track" cx="115" cy="115" r="108"></circle>
              <circle class="ring-fill" cx="115" cy="115" r="108"
                      stroke-dasharray="${2 * Math.PI * 108}" stroke-dashoffset="${2 * Math.PI * 108}"></circle>
            </svg>
            <div class="ring-core"><div class="phase-name" data-phase style="font-size:1.1rem">In</div></div>
          </div>
        </div>
      </div>`);
    app.appendChild(s3);

    const bubble = s3.querySelector('[data-b]');
    const timerEl = s3.querySelector('[data-t]');
    const fill = s3.querySelector('.ring-fill');
    const phaseEl = s3.querySelector('[data-phase]');
    const CIRC = 2 * Math.PI * 108;

    let lineIx = 0, lastFullness = 0, left = TOTAL, alive = true;

    const showLine = () => {
      if (!alive || lineIx >= SURF_LINES.length) return;
      const line = SURF_LINES[lineIx++];
      bubble.textContent = line;
      speak(line);
    };
    showLine();

    Ambient.start();
    Wake.on();
    const engine = new BreathEngine(PATTERNS.surf, 8, {
      onPhase: p => { phaseEl.textContent = p.name; pulse(); },
      onProgress: (frac, phase) => {
        lastFullness = breathFullness(frac, phase, lastFullness);
        setBreathVar(lastFullness);
        fill.style.strokeDashoffset = String(CIRC * (1 - lastFullness));
      },
      onCycle: showLine,
      onDone: () => { alive = false; setBreathVar(0); this._after(log); }
    });

    const countdown = () => {
      if (!alive) return;
      timerEl.textContent = String(Math.max(0, left--));
      if (left >= 0) setTimeout(countdown, 1000);
    };
    countdown();
    engine.start();
  },

  _after(log) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    let after = Math.max(0, log.before - 3);
    const s4 = el(`
      <div class="screen stack">
        <h2>The wave broke.</h2>
        <p class="dim">You just watched an urge peak without obeying it. That circuit is now slightly weaker. Rate it again:</p>
      </div>`);
    s4.appendChild(tensionSlider('How strong is the pull now?', after, v => after = v));

    const type = URGE_TYPES.find(u => u.id === log.type);
    let moneyRow = null;
    if (type && type.spend) {
      moneyRow = el(`
        <div class="card stack">
          <h3>What would that have cost you?</h3>
          <p class="faint">Honest guess. This money is now redirected to your actual life.</p>
          <div class="chips" data-m>
            <button class="chip" data-v="5">$5</button>
            <button class="chip" data-v="20">$20</button>
            <button class="chip" data-v="50">$50</button>
            <button class="chip" data-v="100">$100</button>
            <button class="chip on" data-v="0">Nothing</button>
          </div>
        </div>`);
      moneyRow.querySelectorAll('.chip').forEach(ch => {
        ch.onclick = () => {
          moneyRow.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
          ch.classList.add('on');
          log.avoided = Number(ch.dataset.v);
        };
      });
      s4.appendChild(moneyRow);
    }

    const done = el('<button class="btn wide">Log it &amp; close</button>');
    s4.appendChild(done);
    done.onclick = () => {
      log.after = after;
      State.logUrge(log);
      const c = State.companion;
      app.innerHTML = '';
      const closeLine = pick(SURF_CLOSER);
      const gem = GEMS[Math.floor(Math.random() * GEMS.length)];
      const goalName = State.profile.goalName;
      const goalAmount = State.profile.goalAmount || 0;
      const out = el(`
        <div class="screen stack" style="text-align:center;align-items:center;">
          <div class="stat" style="min-width:200px">
            <div class="num">${State.urgesSurfed()}</div>
            <div class="lbl">waves surfed, total</div>
          </div>
          ${log.avoided ? `<div class="stat" style="min-width:200px"><div class="num">${fmtMoney(State.moneyRedirected())}</div><div class="lbl">${goalName && goalAmount ? `toward ${goalName} — ${Math.min(100, Math.round(State.moneyRedirected() / goalAmount * 100))}% there` : 'redirected to your real life, total'}</div></div>` : ''}
          <div class="bubble" style="width:100%" data-b></div>
          <div class="card fade-slow" style="width:100%"><p class="dim" style="font-style:italic; font-family:var(--serif); font-size:1rem">“${gem}”</p></div>
          <button class="btn wide" data-h>Close &amp; go live your life</button>
        </div>`);
      app.appendChild(out);
      speak(closeLine);
      typewrite(out.querySelector('[data-b]'), closeLine, 32, null);
      out.querySelector('[data-h]').onclick = () => App.home();
    };
    app.appendChild(s4);
  }
};

/* =========================================================
   Haven — screens, onboarding, home, journey
   ========================================================= */

const App = {

  /* ---------- boot ---------- */
  init() {
    State.load();
    this._particles();
    document.getElementById('sosBtn').onclick = () => Surf.start();
    if (!State.profile.companion) this.onboard();
    else { this.applyTheme(); this.home(); }
  },

  timeOfDay() {
    const h = new Date().getHours();
    if (h < 5)  return 'night';
    if (h < 12) return 'morning';
    if (h < 18) return 'afternoon';
    if (h < 23) return 'evening';
    return 'night';
  },

  applyTheme() {
    const c = State.companion;
    if (!c) return;
    const r = document.documentElement.style;
    r.setProperty('--accent', c.accent);
    r.setProperty('--accent-soft', c.accentSoft);
    r.setProperty('--glow', c.glow);
    r.setProperty('--c1', c.palette[0]);
    r.setProperty('--c2', c.palette[1]);
    r.setProperty('--c3', c.palette[2]);
  },

  _particles() {
    const holder = document.getElementById('bgParticles');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.bottom = (Math.random() * -10) + 'vh';
      s.style.animationDuration = (14 + Math.random() * 22) + 's';
      s.style.animationDelay = (Math.random() * 20) + 's';
      s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
      holder.appendChild(s);
    }
  },

  /* Companion media: breathing video loop → local/hosted portrait → styled monogram.
     Videos carry their own motion, so the 'ambient' CSS breath animation is dropped. */
  portraitImg(c, cls) {
    if (c.videoRemote || c.video) {
      const vcls = cls.replace(/\bambient\b/, '').trim();
      return `<video class="${vcls}" autoplay muted loop playsinline disablepictureinpicture
        poster="${c.portrait}" data-id="${c.id}" data-cls="${cls}"
        onerror="App.videoFallback(this)">
        ${c.video ? `<source src="${c.video}" type="video/mp4">` : ''}
        ${c.videoRemote ? `<source src="${c.videoRemote}" type="video/mp4" onerror="App.videoFallback(this.parentNode)">` : ''}
      </video>`;
    }
    return this._imgTag(c.portrait, c.portraitRemote, c.name[0], cls);
  },

  _imgTag(src, remote, initial, cls) {
    return `<img class="${cls}" src="${src}" alt=""
      data-remote="${remote || ''}" data-initial="${initial}"
      onerror="App.portraitFallback(this)">`;
  },

  videoFallback(video) {
    if (!video || video.tagName !== 'VIDEO' || !video.isConnected) return;
    const c = COMPANIONS[video.dataset.id];
    const cls = video.dataset.cls || video.className;
    video.replaceWith(el(this._imgTag(c.portrait, c.portraitRemote, c.name[0], cls)));
  },

  portraitFallback(img) {
    if (img.dataset.remote) {
      const remote = img.dataset.remote;
      img.dataset.remote = '';
      img.src = remote;
      return;
    }
    const fb = el(`<div class="portrait-fallback ${img.className}">${img.dataset.initial || '·'}</div>`);
    img.replaceWith(fb);
  },

  /* ---------- onboarding ---------- */
  onboard() {
    const app = document.getElementById('app');
    document.getElementById('sosBtn').classList.add('hidden');
    app.innerHTML = '';

    const s1 = el(`
      <div class="screen stack" style="padding-top:6vh">
        <h1>You've seen the ads.<br><span class="accent">This is the antidote.</span></h1>
        <p class="dim">The apps with the beautiful faces are built to keep you paying and coming back —
        dopamine spikes, manufactured scarcity, affection by the token.</p>
        <p class="dim"><strong style="color:var(--ink)">Haven</strong> looks like them on purpose, and does the opposite.
        The companions here are trained on one job: downregulating your nervous system —
        longer exhales, lower cortisol, a quieter mind — and then telling you to log off.</p>
        <div class="notice">No account. No feed. No paywalled affection. Everything stays on this device.</div>
        <button class="btn wide">Start</button>
      </div>`);
    s1.querySelector('.btn').onclick = () => step2();
    app.appendChild(s1);

    const step2 = () => {
      app.innerHTML = '';
      const s2 = el(`
        <div class="screen stack">
          <h2>Where are you right now?</h2>
          <p class="dim">Honest answer — it only changes what we emphasize. Nobody sees this but you.</p>
          <div class="stack" data-opts></div>
        </div>`);
      const opts = [
        { id: 'deep',   label: 'In deep', body: 'Paying for OnlyFans / AI girlfriends / parasocial content and it doesn’t feel like a choice anymore.' },
        { id: 'edge',   label: 'On the edge', body: 'Not paying (much) yet, but the scrolling and the pull are getting louder.' },
        { id: 'tense',  label: 'Just wound up', body: 'Here for the nervous-system side: stress, tension, a mind that won’t shut up.' },
        { id: 'curious',label: 'Curious', body: 'Just want to see what a companion app with a conscience looks like.' }
      ];
      const holder = s2.querySelector('[data-opts]');
      opts.forEach(o => {
        const cardEl = el(`<div class="card click stack" style="gap:6px"><h3>${o.label}</h3><p class="dim" style="font-size:.94rem">${o.body}</p></div>`);
        cardEl.onclick = () => { State.profile.startPoint = o.id; State.save(); step3(o.id); };
        holder.appendChild(cardEl);
      });
      app.appendChild(s2);
    };

    const step3 = (startPoint) => {
      app.innerHTML = '';
      if (startPoint !== 'deep' && startPoint !== 'edge') { State.profile.monthlySpend = 0; State.save(); return step3b(); }
      let spend = 50;
      const s3 = el(`
        <div class="screen stack">
          <h2>What does it cost you a month?</h2>
          <p class="dim">Subscriptions, tips, tokens, "just this once." Rough guess. We’ll count what you keep.</p>

      const cardEl = el(`

      const v = cardEl.querySelector('[data-v]');

        spend = Number(input.value);

      };
      input.addEventListener('input', paint); paint();
      s3.appendChild(cardEl);

      go.onclick = () => { State.profile.monthlySpend = spend; State.save(); step3b(); };

      app.appendChild(s3);
    };

    const step3b = () => {
      app.innerHTML = '';
      const hasSpend = State.profile.monthlySpend > 0;
      const s = el(`
        <div class="screen stack">
          <h2>Two quick things</h2>
          <div class="card stack">
            <h3>What should we call you?</h3>

            <input type="text" data-name maxlength="24" placeholder="optional"
              style="background:var(--card);border:1px solid var(--card-edge);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:1rem;outline:none">
          </div>
          ${hasSpend ? `
          <div class="card stack">
            <h3>What's that money actually for?</h3>
            <p class="faint">Every dollar you don't send her is a dollar toward something real. Name the something — concrete goals beat abstract savings, every time.</p>
            <input type="text" data-goal maxlength="40" placeholder="e.g. Japan trip, a good bike, moving out"
              style="background:var(--card);border:1px solid var(--card-edge);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:1rem;outline:none">
            <div class="spread"><span class="dim">It costs about</span><span class="accent" style="font-family:var(--serif);font-size:1.4rem" data-gv>$1,000</span></div>
            <input type="range" data-gamt min="100" max="5000" step="100" value="1000">
          </div>` : ''}
          <button class="btn wide">Next</button>
        </div>`);
      const gamt = s.querySelector('[data-gamt]');
      if (gamt) {
        const gv = s.querySelector('[data-gv]');
        const paint = () => {
          gv.textContent = '$' + Number(gamt.value).toLocaleString();

        };

  _welcome(c) {

    const w = el(`
      <div class="screen stack" style="text-align:center; align-items:center; padding-top:4vh">
        <div class="portrait-wrap">
          <div class="portrait-glow" style="--breath:.4"></div>
          ${this.portraitImg(c, 'portrait ambient')}

        <div class="bubble" style="width:100%" data-b></div>
        <button class="btn wide">Take the first breath</button>

    typewrite(w.querySelector('[data-b]'), line, 32, null);
    speak(line);
    w.querySelector('.btn').onclick = () => Session.start(PRACTICES[0]);
  },

  /* ---------- home ---------- */
  home() {
    const c = State.companion;
    if (!c) return this.onboard();
    stopSpeech();
    Ambient.stop();
    Wake.off();
    this.applyTheme();
    const app = document.getElementById('app');
    document.getElementById('sosBtn').classList.remove('hidden');
    app.innerHTML = '';

    const minsToday = State.minutesToday();
    const overCap = minsToday >= DAILY_SOFT_CAP_MIN;

    /* milestone greetings: the companion notices you coming back */
    let greeting = overCap ? pick(CAP_LINES) : pick(c.greetings[this.timeOfDay()]);
    if (!overCap) {
      const days = State.daysShownUp();
      if (MILESTONE_LINES[days] && (State.profile.lastMilestone || 0) < days) {
        greeting = pick(MILESTONE_LINES[days]);
        State.profile.lastMilestone = days;
        State.save();
      }
    }

    const name = State.profile.name;
    const home = el(`
      <div class="screen stack">
        <div class="topbar">
          <span class="brand">ha<em>v</em>en${name ? ` <span class="faint" style="font-size:.8rem">· ${name}</span>` : ''}</span>
          <span class="row" style="gap:14px">
            <button class="linklike" data-nav="roster">companions</button>
            <button class="linklike" data-nav="journey">journey</button>
            <button class="linklike" data-nav="why">why</button>
          </span>
        </div>
        <div class="row" style="align-items:flex-start; gap:16px">
          <div class="portrait-wrap" style="width:112px; margin:0; flex-shrink:0">
            <div class="portrait-glow" style="--breath:.3"></div>
            ${this.portraitImg(c, 'portrait ambient')}
          </div>
          <div class="stack" style="gap:10px; flex:1">
            <h2 style="font-size:1.2rem">${c.name}</h2>
            <div class="bubble" style="font-size:.98rem; padding:14px 16px" data-greet></div>
          </div>
        </div>
        ${overCap ? '<div class="notice">Soft cap reached — ' + minsToday + ' min today. Practices still work, but ' + c.name + ' would rather you take the calm outside.</div>' : ''}
        <div class="stack" data-practices style="gap:10px"></div>
        <div class="faint" style="text-align:center; padding-top:8px">
          Feeling the pull toward the old stuff? The button below is the whole reason this app exists.
        </div>
      </div>`);

    typewrite(home.querySelector('[data-greet]'), greeting, 26, null);
    home.querySelectorAll('[data-nav]').forEach(b => {
      b.onclick = () => {
        if (b.dataset.nav === 'journey') this.journey();
        else if (b.dataset.nav === 'why') this.why();
        else this.roster();
      };
    });

    /* grouped catalog; the night section leads late in the evening */
    let groups = [
      ['now', 'Right now · fast resets'],
      ['breath', 'Breath & body'],
      ['mind', 'Working with the mind'],
      ['deep', 'Go deeper'],
      ['night', 'For the night']
    ];
    const h = new Date().getHours();
    if (h >= 21 || h < 5) groups.unshift(groups.pop());

    const list = home.querySelector('[data-practices]');
    groups.forEach(([gid, glabel]) => {
      const items = PRACTICES.filter(p => (p.group || 'unwind') === gid);
      if (!items.length) return;
      list.appendChild(el(`<h3 class="dim" style="margin-top:10px; font-size:.95rem">${glabel}</h3>`));
      items.forEach(p => {
        const champ = p.champion && COMPANIONS[p.champion];
        const item = el(`
          <div class="card click spread">
            <div>
              <h3>${p.title}</h3>
              <div class="faint">${p.subtitle}${champ ? ` · <span style="color:${champ.accent}">${champ.name}'s</span>` : ''}</div>
            </div>
            <span class="accent" style="font-size:1.4rem">›</span>
          </div>`);
        item.onclick = () => Session.start(p);
        list.appendChild(item);
      });
    });

    app.appendChild(home);
  },

  /* ---------- companion roster (switch anytime) ---------- */
  roster() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const r = el(`
      <div class="screen stack">
        <div class="topbar">
          <button class="linklike" data-back>‹ back</button>
          <span class="brand">companions</span>
        </div>
        <p class="dim">Five voices, one job: getting your nervous system back. Each has a specialty — and all of them will tell you to log off.</p>
        <div class="stack" data-list></div>
      </div>`);
    r.querySelector('[data-back]').onclick = () => this.home();
    const list = r.querySelector('[data-list]');
    Object.values(COMPANIONS).forEach(c => {
      const current = State.profile.companion === c.id;
      const owned = PRACTICES.filter(p => p.champion === c.id).map(p => p.title).join(' · ');
      const cardEl = el(`
        <div class="card click row" style="align-items:flex-start; ${current ? `border-color:${c.accent}` : ''}">
          ${this.portraitImg(c, 'portrait-sm')}
          <div class="stack" style="gap:6px; flex:1">
            <div class="row" style="gap:10px"><h3>${c.name}</h3><span class="faint">${c.role}</span>${current ? '<span class="faint">· current</span>' : ''}</div>
            <p class="dim" style="font-size:.93rem">${c.bio}</p>
            ${owned ? `<p class="faint">Specialty: ${owned}</p>` : ''}
            <button class="linklike" data-hear style="align-self:flex-start; padding-left:0">&#9654; hear ${c.name}'s voice</button>
          </div>
        </div>`);
      cardEl.querySelector('[data-hear]').onclick = e => {
        e.stopPropagation();
        speak(WELCOME_LINES[c.id], c.id);
      };
      cardEl.onclick = () => {
        State.profile.companion = c.id;
        State.save();
        stopSpeech();
        this.home();
      };
      list.appendChild(cardEl);
    });
    app.appendChild(r);
  },

  /* ---------- journey / dashboard ---------- */
  journey() {
    const app = document.getElementById('app');
    document.getElementById('sosBtn').classList.remove('hidden');
    app.innerHTML = '';

    const rel = State.avgRelease();
    const monthly = State.profile.monthlySpend;
    const redirected = State.moneyRedirected();
    const goalName = State.profile.goalName;
    const goalAmount = State.profile.goalAmount || 0;
    const goalPct = goalAmount ? Math.min(100, redirected / goalAmount * 100) : 0;
    const name = State.profile.name;
    const j = el(`
      <div class="screen stack">
        <div class="topbar">
          <button class="linklike" data-back>‹ back</button>
          <span class="brand">${name ? name + "'s" : 'your'} journey</span>
        </div>
        <div class="stat-grid">
          <div class="stat"><div class="num">${State.totalMinutes()}</div><div class="lbl">minutes regulated</div></div>
          <div class="stat"><div class="num">${State.urgesSurfed()}</div><div class="lbl">waves surfed</div></div>
          <div class="stat"><div class="num">${fmtMoney(redirected)}</div><div class="lbl">redirected to real life</div></div>
          <div class="stat"><div class="num">${State.daysShownUp()}</div><div class="lbl">days you showed up</div></div>
        </div>
        <p class="faint" style="text-align:center; margin-top:-6px">Every day and every wave is a vote for the person you're becoming.</p>
        ${rel != null ? `<div class="notice">On average, a session drops your tension by <strong>${rel.toFixed(1)} points</strong>. Your nervous system is learning the way down.</div>` : ''}
        ${goalName && goalAmount ? `
        <div class="card stack" style="gap:10px">
          <div class="spread"><h3>${goalName}</h3><span class="accent" style="font-family:var(--serif)">${fmtMoney(redirected)} / ${fmtMoney(goalAmount)}</span></div>
          <div style="height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden">
            <div style="height:100%;width:${goalPct}%;background:var(--accent);border-radius:4px;transition:width 1s ease"></div>
          </div>
          <p class="faint">Funded entirely by waves you didn't obey. The other apps call this churn; you can call it ${goalPct >= 100 ? 'done — go book it' : Math.round(goalPct) + '% of the way there'}.</p>
        </div>` : ''}
        ${monthly > 0 ? `<div class="card"><h3>The old cost</h3><p class="dim" style="font-size:.95rem;margin-top:6px">You said the old habit ran about <strong style="color:var(--accent)">${fmtMoney(monthly)}/month</strong> — ${fmtMoney(monthly * 12)} a year. That's ${Math.max(1, Math.round(monthly * 12 / 45))} good dinners out, ${Math.max(1, Math.round(monthly * 12 / 55))} months of a gym, or ${(monthly * 12 / 450).toFixed(1)} flights somewhere warm — every year, forever.</p></div>` : ''}
        <div class="card stack" data-chart-card>
          <h3>Tension: walked in → walked out</h3>
          <p class="faint">Each pair is one session. Left bar before, right bar after.</p>
          <div class="bars" data-chart></div>
        </div>
        <div class="card stack">
          <h3>Our promises</h3>
          <div class="stack" data-promises style="gap:12px"></div>
        </div>
        <div class="card stack">
          <h3>If it's bigger than an app</h3>
          <p class="dim" style="font-size:.93rem">If spending or porn use feels genuinely out of control, that's not a willpower failure — it's a loop that deserves real support. SMART Recovery (smartrecovery.org) and Sex Addicts Anonymous (saa-recovery.org) are free and anonymous. Haven is a tool, not treatment.</p>
        </div>
        <button class="linklike" data-reset style="align-self:center">start over (erases everything)</button>
      </div>`);

    j.querySelector('[data-back]').onclick = () => this.home();
    j.querySelector('[data-reset]').onclick = () => {
      if (confirm('Erase all local data and start over?')) { State.reset(); location.reload(); }
    };

    const chart = j.querySelector('[data-chart]');
    const recent = State.recentSessions(7).filter(s => s.before != null && s.after != null);
    if (!recent.length) {
      j.querySelector('[data-chart-card]').innerHTML =
        '<h3>Tension: walked in → walked out</h3><p class="faint" style="margin-top:6px">Finish a practice and your before/after will show here.</p>';
    } else {
      recent.forEach(s => {
        const b = el(`<div class="bar neg" style="height:${Math.max(6, s.before / 10 * 100)}%"></div>`);
        const a = el(`<div class="bar" style="height:${Math.max(6, s.after / 10 * 100)}%; margin-right:6px"></div>`);
        chart.appendChild(b); chart.appendChild(a);
      });
    }

    const ph = j.querySelector('[data-promises]');
    PROMISES.forEach(p => {
      ph.appendChild(el(`<div><strong style="font-size:.95rem">${p.title}</strong><p class="dim" style="font-size:.9rem">${p.body}</p></div>`));
    });

    app.appendChild(j);
  },

  /* ---------- why this works ---------- */
  why() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const w = el(`
      <div class="screen stack">
        <div class="topbar">
          <button class="linklike" data-back>‹ back</button>
          <span class="brand">why this works</span>
        </div>
        <p class="dim">No magic, no woo — the practices here are the boring, replicated parts of stress physiology. The honest version:</p>
        <div class="stack" data-sci></div>
        <div class="card stack">
          <h3>The alchemy, disclosed</h3>
          <p class="dim" style="font-size:.93rem">The apps we're replacing run sophisticated psychology on you without telling you. We run some too — here's the complete list, because a trick you can see is a tool, and one you can't is a leash:</p>
          <div class="stack" style="gap:10px" data-tricks></div>
          <p class="faint">Frames borrowed shamelessly from Rory Sutherland (meaning changes the medicine), James Clear (identity votes), BJ Fogg (anchor moments), and the relapse-prevention literature. All of it aimed at the door, not the feed.</p>
        </div>
        <div class="notice">Haven is a self-regulation tool, not medical or psychological care. If you're struggling, a real human professional beats any app — including this one.</div>
      </div>`);
    const tricks = [
      ['Story frames', 'Pilot’s sigh, emperor’s triage, monk’s hum. Same physiology, better clothes — a practice with a story gets done twice as often.'],
      ['Variable warmth', 'You never know which closing line you’ll get. That’s the slot-machine mechanic every feed uses — ours pays out in sentences and ends the session.'],
      ['Being noticed', 'The companions mark your day 2, 3, 7, 14, 30. Feeling seen is the product the other apps sell; here it’s free and it wants you gone.'],
      ['Concrete money', '"$40 saved" is noise; "12% of the Japan trip" is a plan. Vivid beats abstract, so we make your redirected money vivid.'],
      ['Identity votes', 'Stats are framed as votes for who you’re becoming, not scores to protect. Scores create fear of loss; identity creates direction.'],
      ['A cast, not a catalog', 'Specialists (the night voice, the morning one) make the same six techniques feel like a world. Positioning is free; content is expensive.']
    ];
    const th = w.querySelector('[data-tricks]');
    tricks.forEach(([t, b]) => th.appendChild(el(`<div><strong style="font-size:.95rem">${t}.</strong> <span class="dim" style="font-size:.9rem">${b}</span></div>`)));
    w.querySelector('[data-back]').onclick = () => this.home();
    const holder = w.querySelector('[data-sci]');
    SCIENCE.forEach(s => {
      holder.appendChild(el(`<div class="card stack" style="gap:8px"><h3>${s.title}</h3><p class="dim" style="font-size:.94rem">${s.body}</p></div>`));
    });
    app.appendChild(w);
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>

</body>
</html>
