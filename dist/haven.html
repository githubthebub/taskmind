<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haven — the companion that wants you to leave</title>
<meta name="description" content="A companion built to downregulate your nervous system, not monetize your loneliness.">
<style>
/* =========================================================
   Haven — visual system
   Calm, dark, unhurried. Everything animates slowly.
   ========================================================= */

:root {
  --c1: #0e1024; --c2: #181a35; --c3: #232042;        /* ambient, per companion */
  --accent: #a99df2;
  --accent-soft: rgba(169,157,242,.16);
  --glow: rgba(183,166,240,.35);
  --ink: #eceaf4;
  --ink-dim: rgba(236,234,244,.62);
  --ink-faint: rgba(236,234,244,.38);
  --card: rgba(255,255,255,.055);
  --card-edge: rgba(255,255,255,.10);
  --radius: 22px;
  --breath: 0;                                         /* 0..1, set by JS */
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--c1);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- ambient background ---------- */
.bg-gradient {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(120% 90% at 70% -10%, var(--c3) 0%, transparent 60%),
    radial-gradient(100% 80% at 10% 110%, var(--c2) 0%, transparent 55%),
    var(--c1);
  transition: background 2s ease;
}
.bg-particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bg-particles span {
  position: absolute;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--glow);
  filter: blur(1px);
  opacity: 0;
  animation: drift linear infinite;
}
@keyframes drift {
  0%   { transform: translateY(20px); opacity: 0; }
  15%  { opacity: .5; }
  85%  { opacity: .25; }
  100% { transform: translateY(-90vh); opacity: 0; }
}

/* ---------- layout ---------- */
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 20px 140px;
  min-height: 100vh;
}
.screen { animation: fadeUp .8s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: .2px; }
h1 { font-size: 2.1rem; line-height: 1.15; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.08rem; }
p  { line-height: 1.65; }

.dim   { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: .85rem; }
.accent{ color: var(--accent); }
.hidden{ display: none !important; }

.stack   { display: flex; flex-direction: column; gap: 16px; }
.row     { display: flex; gap: 12px; align-items: center; }
.spread  { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* ---------- cards & buttons ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius);
  padding: 20px 22px;
  backdrop-filter: blur(14px);
}
.card.click { cursor: pointer; transition: transform .35s ease, border-color .35s ease, background .35s ease; }
.card.click:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--accent-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--sans); font-size: 1rem; font-weight: 600;
  color: var(--c1);
  background: var(--accent);
  border: none; border-radius: 16px;
  padding: 15px 26px;
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease, opacity .3s ease;
  box-shadow: 0 6px 30px -8px var(--glow);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 34px -8px var(--glow); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn.ghost {
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--card-edge); box-shadow: none;
}
.btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
.btn.wide { width: 100%; }

.chip {
  font-size: .92rem; font-weight: 500;
  color: var(--ink-dim);
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: 999px;
  padding: 11px 18px;
  cursor: pointer;
  transition: all .3s ease;
}
.chip:hover { color: var(--ink); border-color: var(--ink-faint); }
.chip.on {
  color: var(--c1); background: var(--accent);
  border-color: var(--accent);
}
.chips { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- sliders ---------- */
input[type="range"] {
  width: 100%; appearance: none; -webkit-appearance: none;
  height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,.12) var(--fill, 50%));
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--ink); border: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.4);
  cursor: pointer;
}

/* ---------- companion portrait ---------- */
.portrait-wrap {
  position: relative;
  width: min(72vw, 300px);
  margin: 0 auto;
}
.portrait-glow {
  position: absolute; inset: -12%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
  opacity: calc(.45 + var(--breath) * .55);
  transform: scale(calc(.94 + var(--breath) * .12));
  z-index: 0;
  transition: opacity .2s linear;
}
.portrait {
  position: relative; z-index: 1;
  width: 100%; aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 26px;
  border: 1px solid var(--card-edge);
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
  transform: scale(calc(1 + var(--breath) * .022));
  transition: transform .15s linear;
  display: block;
}
.portrait.ambient { animation: ambientBreath 7s ease-in-out infinite; transform: none; }
@keyframes ambientBreath {
  0%, 100% { transform: scale(1); filter: brightness(.97); }
  40%      { transform: scale(1.018); filter: brightness(1.04); }
  60%      { transform: scale(1.018); filter: brightness(1.04); }
}
.portrait-sm {
  width: 74px; height: 96px; object-fit: cover;
  border-radius: 16px; border: 1px solid var(--card-edge);
  flex-shrink: 0;
}

/* portrait fallback when image missing */
.portrait-fallback {
  width: 100%; aspect-ratio: 3/4;
  border-radius: 26px;
  border: 1px solid var(--card-edge);
  background: linear-gradient(160deg, var(--c2), var(--c3));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 4rem; color: var(--accent);
}
.portrait-fallback.portrait-sm { width: 74px; height: 96px; font-size: 1.7rem; border-radius: 16px; }

/* ---------- speech bubble ---------- */
.bubble {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: 20px;
  padding: 18px 22px;
  font-size: 1.06rem;
  line-height: 1.7;
  min-height: 64px;
  backdrop-filter: blur(14px);
}
.bubble .cursor {
  display: inline-block; width: 8px; height: 1.1em;
  background: var(--accent); vertical-align: text-bottom;
  margin-left: 2px; border-radius: 2px;
  animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- breath ring ---------- */
.breath-stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.ring-wrap { position: relative; width: 230px; height: 230px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 3; }
.ring-fill  {
  fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round;
  filter: drop-shadow(0 0 10px var(--glow));
}
.ring-core {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 4px;
}
.ring-core .phase-name { font-family: var(--serif); font-size: 1.5rem; }
.ring-core .phase-count { color: var(--ink-faint); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
.ring-orb {
  position: absolute; left: 50%; top: 50%;
  width: 130px; height: 130px;
  margin: -65px 0 0 -65px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, var(--accent-soft), transparent 70%),
              radial-gradient(circle, var(--glow), transparent 72%);
  transform: scale(calc(.55 + var(--breath) * .5));
  transition: transform .15s linear;
  z-index: -1;
}

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat {
  background: var(--card); border: 1px solid var(--card-edge);
  border-radius: 18px; padding: 16px 18px;
}
.stat .num { font-family: var(--serif); font-size: 1.9rem; color: var(--accent); line-height: 1.2; }
.stat .lbl { color: var(--ink-faint); font-size: .82rem; margin-top: 2px; }

.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
.bars .bar {
  flex: 1; border-radius: 6px 6px 3px 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-soft));
  min-height: 4px; opacity: .85;
  position: relative;
}
.bars .bar.neg { background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.06)); }

/* ---------- SOS button ---------- */
.sos-btn {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 50;
  display: flex; align-items: center; gap: 10px;
  background: rgba(20, 16, 30, .82);
  color: var(--ink);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 14px 26px;
  font-size: .98rem; font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px -10px var(--glow);
  transition: transform .3s ease;
}
.sos-btn:hover { transform: translateX(-50%) translateY(-2px); }
.sos-wave {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent);
  animation: sosPulse 2.6s ease-in-out infinite;
}
@keyframes sosPulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--glow); }
  50%      { box-shadow: 0 0 0 10px transparent; }
}

/* ---------- urge wave animation ---------- */
.wave-stage {
  position: relative; height: 140px; overflow: hidden;
  border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--card-edge);
}
.wave-stage svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 80%; }
.wave-stage .w1 { animation: waveSlide 9s linear infinite; opacity: .5; }
.wave-stage .w2 { animation: waveSlide 13s linear infinite reverse; opacity: .3; }
@keyframes waveSlide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.wave-timer {
  position: absolute; top: 14px; left: 0; right: 0; text-align: center;
  font-family: var(--serif); font-size: 1.6rem; color: var(--ink);
}

/* ---------- misc ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.brand { font-family: var(--serif); font-size: 1.25rem; letter-spacing: .04em; }
.brand em { color: var(--accent); font-style: normal; }
.linklike {
  background: none; border: none; color: var(--ink-faint);
  font-size: .9rem; cursor: pointer; padding: 6px 4px;
}
.linklike:hover { color: var(--ink); }

.divider { border: none; border-top: 1px solid var(--card-edge); margin: 8px 0; }

.notice {
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  background: var(--accent-soft);
  border-radius: 0 14px 14px 0;
  font-size: .92rem; line-height: 1.6; color: var(--ink-dim);
}

.fade-slow { animation: fadeUp 1.6s ease both; }

@media (max-width: 480px) {
  main { padding: 20px 14px 130px; }
  h1 { font-size: 1.7rem; }
  .stat .num { font-size: 1.5rem; }
}

</style>
</head>
<body>

  <!-- ambient background layers -->
  <div class="bg-gradient" id="bgGradient"></div>
  <div class="bg-particles" id="bgParticles" aria-hidden="true"></div>

  <main id="app" aria-live="polite"></main>

  <!-- always-available SOS button -->
  <button id="sosBtn" class="sos-btn hidden" title="Feeling the pull? Ride it out here.">
    <span class="sos-wave" aria-hidden="true"></span>
    <span class="sos-label">I'm feeling the pull</span>
  </button>
<script>
/* ---- js/data.js ---- */
/* =========================================================

   long exhales, attention pulled out of rumination (DMN)
   and into the body. No hooks, no scarcity, no "miss you".
   ========================================================= */

   Breath patterns
   Each phase: { name, kind: 'in'|'hold'|'out', secs, cue }

   { t:'scan',   regions: [...] }    — body-scan sequence

const STORE_KEY = 'haven.v1';

const State = {
  data: null,

  defaults() {
    return {
      profile: {
        companion: null,        // 'sera' | 'noa' | 'kai'
        startPoint: null,       // onboarding self-assessment id
        monthlySpend: 0,        // what they told us they spend / month
        createdAt: Date.now()
      },
      settings: { voice: false },
      sessions: [],             // {ts, practiceId, minutes, before, after}
      urges: [],                // {ts, type, spotName, before, after, avoided}
      checkins: []              // {ts, tension}
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      this.data = raw ? Object.assign(this.defaults(), JSON.parse(raw)) : this.defaults();
    } catch (e) {
      this.data = this.defaults();
    }
    return this.data;
  },

  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { /* private mode */ }
  },

  reset() {
    localStorage.removeItem(STORE_KEY);
    this.data = this.defaults();
  },

  get profile()  { return this.data.profile; },
  get companion(){ return COMPANIONS[this.data.profile.companion] || null; },

  logSession(practiceId, minutes, before, after) {
    this.data.sessions.push({ ts: Date.now(), practiceId, minutes, before, after });
    this.save();
  },

  logUrge(entry) {
    this.data.urges.push(Object.assign({ ts: Date.now() }, entry));
    this.save();
  },

  /* ---------- derived stats ---------- */

  minutesToday() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    return this.data.sessions
      .filter(s => s.ts >= start.getTime())
      .reduce((sum, s) => sum + s.minutes, 0);
  },

  totalMinutes() {
    return this.data.sessions.reduce((sum, s) => sum + s.minutes, 0);
  },

  daysShownUp() {
    const days = new Set();
    this.data.sessions.forEach(s => days.add(new Date(s.ts).toDateString()));
    this.data.urges.forEach(u => days.add(new Date(u.ts).toDateString()));
    return days.size;
  },

  urgesSurfed() { return this.data.urges.length; },

  moneyRedirected() {
    return this.data.urges.reduce((sum, u) => sum + (u.avoided || 0), 0);
  },

  /* average tension drop across sessions that recorded both ends */
  avgRelease() {
    const pairs = this.data.sessions.filter(s => s.before != null && s.after != null);
    if (!pairs.length) return null;
    const total = pairs.reduce((sum, s) => sum + (s.before - s.after), 0);
    return total / pairs.length;
  },

  recentSessions(n) {
    return this.data.sessions.slice(-n);
  }
};

/* =========================================================
   Haven — breath engine
   Drives a timed phase loop and reports progress so the UI
   (ring, character glow, cues) can move with the breath.
   ========================================================= */

class BreathEngine {
  /**
   * @param {object} pattern   entry from PATTERNS
   * @param {number} cycles    how many full cycles to run
   * @param {object} cbs       { onPhase(phase, cycle, cycles), onProgress(phaseFrac, phase), onCycle(i), onDone() }
   */
  constructor(pattern, cycles, cbs) {
    this.pattern = pattern;
    this.cycles = cycles;
    this.cbs = cbs || {};
    this._raf = null;
    this._running = false;
    this._stopped = false;
  }

  start() {
    this._running = true;
    this._cycle = 0;
    this._phaseIx = -1;
    this._phaseStart = 0;
    this._nextPhase(performance.now());
    this._tick = this._tick.bind(this);
    this._raf = requestAnimationFrame(this._tick);
  }

  stop() {
    this._stopped = true;
    this._running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  _nextPhase(now) {
    this._phaseIx++;
    if (this._phaseIx >= this.pattern.phases.length) {
      this._phaseIx = 0;
      this._cycle++;
      if (this.cbs.onCycle) this.cbs.onCycle(this._cycle);
      if (this._cycle >= this.cycles) {
        this._running = false;
        if (this.cbs.onDone) this.cbs.onDone();
        return;
      }
    }
    this._phaseStart = now;
    const phase = this.pattern.phases[this._phaseIx];
    if (this.cbs.onPhase) this.cbs.onPhase(phase, this._cycle, this.cycles);
  }

  _tick(now) {
    if (!this._running || this._stopped) return;
    const phase = this.pattern.phases[this._phaseIx];
    const frac = Math.min(1, (now - this._phaseStart) / (phase.secs * 1000));
    if (this.cbs.onProgress) this.cbs.onProgress(frac, phase);
    if (frac >= 1) {
      this._nextPhase(now);
      if (!this._running) return;
    }
    this._raf = requestAnimationFrame(this._tick);
  }
}

/* Maps breath phase progress to a 0..1 "fullness" for ring & character.
   Inhale ramps up, hold keeps level, exhale ramps down with an ease. */
function breathFullness(frac, phase, prevFullness) {
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  if (phase.kind === 'in')  {
    // top-up inhales start from where the last inhale left off
    const base = phase.name === 'Top-up' ? 0.72 : 0.08;
    const top  = phase.name === 'Top-up' ? 1.0  : 0.72;
    return base + (top - base) * easeInOut(frac);
  }
  if (phase.kind === 'hold') return prevFullness != null ? prevFullness : 1;
  return 1.0 - 0.92 * easeInOut(frac); // out
}

/* ---------- tiny DOM + speech helpers (shared with app.js) ---------- */

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function pick(textOrMap) {
  if (typeof textOrMap === 'string') return textOrMap;
  const c = State.profile.companion || 'sera';
  return textOrMap[c] || textOrMap.sera;
}

function speak(text) {
  if (!State.data.settings.voice || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.86; u.pitch = 1.0; u.volume = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function typewrite(node, text, msPerChar, done) {
  node.textContent = '';
  const cursor = el('<span class="cursor"></span>');
  node.appendChild(cursor);
  let i = 0;
  const step = () => {
    if (!node.isConnected) return;                 // screen was torn down
    if (i < text.length) {
      cursor.before(document.createTextNode(text[i++]));
      setTimeout(step, msPerChar);
    } else {
      cursor.remove();
      if (done) done();
    }
  };
  step();
}

function setBreathVar(v) {
  document.documentElement.style.setProperty('--breath', String(Math.max(0, Math.min(1, v))));
}

function fmtMoney(n) {
  return '$' + (Math.round(n * 100) / 100).toLocaleString();
}

/* ---------- tension slider component ---------- */

function tensionSlider(label, initial, onChange) {
  const wrap = el(`
    <div class="card stack">
      <div class="spread">
        <h3>${label}</h3>
        <span class="accent" style="font-family:var(--serif);font-size:1.5rem" data-val>${initial}</span>
      </div>
      <input type="range" min="0" max="10" step="1" value="${initial}">
      <div class="spread faint"><span>loose · calm</span><span>wound tight</span></div>
    </div>`);
  const input = wrap.querySelector('input');
  const val = wrap.querySelector('[data-val]');
  const paint = () => {
    input.style.setProperty('--fill', (input.value / 10 * 100) + '%');
    val.textContent = input.value;
    if (onChange) onChange(Number(input.value));
  };
  input.addEventListener('input', paint);
  paint();
  return wrap;
}

  start(practice) {

    const app = document.getElementById('app');
    app.innerHTML = '';
    document.getElementById('sosBtn').classList.add('hidden');

    const pre = el(`

    pre.appendChild(tensionSlider('How wound up are you right now?', tension, v => tension = v));
    const go = el('<button class="btn wide">Begin</button>');
    pre.appendChild(go);
    pre.querySelector('[data-x]').onclick = () => this.abort();
    go.onclick = () => { this.active.before = tension; this._run(); };
    app.appendChild(pre);
  },

  abort() {
    if (this.active && this.active.engine) this.active.engine.stop();
    if (window.speechSynthesis) speechSynthesis.cancel();
    this.active = null;
    setBreathVar(0);
    App.home();
  },

  _stage() {
    const c = State.companion;
    const app = document.getElementById('app');
    app.innerHTML = '';
    const stage = el(`
      <div class="screen stack" style="align-items:center; text-align:center;">
        <div class="topbar" style="width:100%; text-align:left;">
          <span class="brand">${this.active.practice.title}</span>
          <span class="row" style="gap:14px">
            <button class="linklike" data-voice>${State.data.settings.voice ? 'voice on' : 'voice off'}</button>
            <button class="linklike" data-x>end</button>
          </span>
        </div>
        <div class="portrait-wrap" style="width:min(50vw,190px)">
          <div class="portrait-glow"></div>
          ${App.portraitImg(c, 'portrait')}
        </div>
        <div class="bubble" data-bubble style="width:100%"></div>
        <div data-zone style="width:100%"></div>
      </div>`);
    stage.querySelector('[data-x]').onclick = () => this.abort();
    const vbtn = stage.querySelector('[data-voice]');
    vbtn.onclick = () => {
      State.data.settings.voice = !State.data.settings.voice;
      State.save();
      vbtn.textContent = State.data.settings.voice ? 'voice on' : 'voice off';
      if (!State.data.settings.voice && window.speechSynthesis) speechSynthesis.cancel();
    };
    app.appendChild(stage);
    return {
      bubble: stage.querySelector('[data-bubble]'),
      zone: stage.querySelector('[data-zone]')
    };
  },

  _run() {
    const steps = this.active.practice.script;
    const ui = this._stage();
    let ix = 0;

    const next = () => {
      if (!this.active) return;
      if (ix >= steps.length) return this._finish();
      const step = steps[ix++];
      if (step.t === 'say')    return this._say(ui, step, next);
      if (step.t === 'breath') return this._breath(ui, step, next);
      if (step.t === 'still')  return this._still(ui, step, next);
      if (step.t === 'scan')   return this._scan(ui, step, next);
      next();
    };
    next();
  },

  _say(ui, step, next) {
    ui.zone.innerHTML = '';
    const text = pick(step.text);
    speak(text);
    typewrite(ui.bubble, text, 34, () => {
      const hold = step.hold != null ? step.hold : Math.max(2200, text.length * 42);
      setTimeout(() => { if (this.active) next(); }, hold);
    });
  },

  _still(ui, step, next) {
    ui.zone.innerHTML = '';
    ui.bubble.textContent = step.text;
    speak(step.text);
    const bar = el(`<div class="card"><div class="faint" style="text-align:center" data-t></div></div>`);
    ui.zone.appendChild(bar);
    let left = step.secs;
    const t = bar.querySelector('[data-t]');
    const tick = () => {
      if (!this.active) return;
      t.textContent = left > 0 ? `${left}s of quiet` : '';
      if (left-- > 0) setTimeout(tick, 1000); else next();
    };
    tick();
  },

  _breath(ui, step, next) {
    const pattern = PATTERNS[step.pattern];
    ui.zone.innerHTML = '';
    ui.bubble.textContent = pattern.phases[0].cue;

    const R = 108, CIRC = 2 * Math.PI * R;
    const ring = el(`
      <div class="breath-stage">
        <div class="ring-wrap">
          <div class="ring-orb"></div>
          <svg viewBox="0 0 230 230">
            <circle class="ring-track" cx="115" cy="115" r="${R}"></circle>
            <circle class="ring-fill" cx="115" cy="115" r="${R}"
                    stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"></circle>
          </svg>
          <div class="ring-core">
            <div class="phase-name" data-phase>Ready</div>
            <div class="phase-count" data-count></div>
          </div>
        </div>
      </div>`);
    ui.zone.appendChild(ring);

    const fill = ring.querySelector('.ring-fill');
    const phaseEl = ring.querySelector('[data-phase]');
    const countEl = ring.querySelector('[data-count]');
    let coachIx = 0;
    let lastFullness = 0;

    const engine = new BreathEngine(pattern, step.cycles, {
      onPhase: (phase, cycle, cycles) => {
        phaseEl.textContent = phase.name;
        countEl.textContent = `breath ${cycle + 1} of ${cycles}`;
      },
      onProgress: (frac, phase) => {
        lastFullness = breathFullness(frac, phase, lastFullness);
        setBreathVar(lastFullness);
        fill.style.strokeDashoffset = String(CIRC * (1 - lastFullness));
      },
      onCycle: () => {
        if (step.coach && coachIx < step.coach.length) {
          const line = step.coach[coachIx++];
          ui.bubble.textContent = line;
          speak(line);
        }
      },
      onDone: () => { setBreathVar(0); if (this.active) next(); }
    });
    this.active.engine = engine;
    engine.start();
  },

  _scan(ui, step, next) {
    ui.zone.innerHTML = '';
    const prog = el(`
      <div class="card stack">
        <div class="spread">
          <h3 data-region></h3>
          <span class="faint" data-ix></span>
        </div>
        <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden">
          <div data-bar style="height:100%;width:0;background:var(--accent);transition:width 1s linear"></div>
        </div>
      </div>`);
    ui.zone.appendChild(prog);
    const regionEl = prog.querySelector('[data-region]');
    const ixEl = prog.querySelector('[data-ix]');
    const barEl = prog.querySelector('[data-bar]');

    let r = 0;
    const runRegion = () => {
      if (!this.active) return;
      if (r >= step.regions.length) return next();
      const region = step.regions[r];
      regionEl.textContent = region.name;
      ixEl.textContent = `${r + 1} / ${step.regions.length}`;
      speak(region.text);
      typewrite(ui.bubble, region.text, 30, null);
      barEl.style.width = '0%';
      let elapsed = 0;
      const tick = () => {
        if (!this.active) return;
        elapsed++;
        barEl.style.width = Math.min(100, elapsed / region.secs * 100) + '%';
        if (elapsed < region.secs) setTimeout(tick, 1000);
        else { r++; runRegion(); }
      };
      setTimeout(tick, 1000);
    };
    runRegion();
  },

  _finish() {
    const c = State.companion;
    const p = this.active.practice;
    const before = this.active.before;
    const app = document.getElementById('app');
    app.innerHTML = '';

    let after = Math.max(0, (before != null ? before : 5) - 2);
    const doneScreen = el(`
      <div class="screen stack">
        <h2>And… back.</h2>
        <p class="dim">Before you go — same question, honest answer.</p>
      </div>`);
    doneScreen.appendChild(tensionSlider('How wound up are you now?', after, v => after = v));
    const save = el('<button class="btn wide">Done</button>');
    doneScreen.appendChild(save);
    app.appendChild(doneScreen);

    save.onclick = () => {
      State.logSession(p.id, p.minutes, before, after);
      const delta = before - after;
      const farewell = c.farewells[Math.floor((State.data.sessions.length - 1) % c.farewells.length)];
      app.innerHTML = '';
      const out = el(`
        <div class="screen stack" style="text-align:center; align-items:center;">
          <div class="portrait-wrap" style="width:min(46vw,170px)">
            <div class="portrait-glow" style="--breath:.35"></div>
            ${App.portraitImg(c, 'portrait ambient')}
          </div>
          <h2>${delta > 0 ? `Tension down ${delta} point${delta === 1 ? '' : 's'}.` : delta === 0 ? 'You showed up. That counts.' : 'Some days are like that. Showing up still counts.'}</h2>
          <div class="bubble" style="width:100%" data-bye></div>
          <button class="btn wide" data-home>Close &amp; go live your life</button>
        </div>`);
      app.appendChild(out);
      speak(farewell);
      typewrite(out.querySelector('[data-bye]'), farewell, 34, null);
      out.querySelector('[data-home]').onclick = () => { this.active = null; App.home(); };
    };
  }
};

    const s2 = el(`
      <div class="screen stack">

    app.appendChild(s2);
  },

  _wave(log) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const TOTAL = 96;   // 8 breaths at 12s
    const s3 = el(`
      <div class="screen stack">
        <div class="topbar"><span class="brand">Riding it out</span><span class="faint">don't switch apps — that's the wave talking</span></div>
        <div class="wave-stage">
          <div class="wave-timer" data-t>90</div>
          <svg class="w1" viewBox="0 0 1200 100" preserveAspectRatio="none">
            <path d="M0 60 Q 75 20 150 60 T 300 60 T 450 60 T 600 60 T 750 60 T 900 60 T 1050 60 T 1200 60 V100 H0 Z" fill="var(--accent)"/>
          </svg>
          <svg class="w2" viewBox="0 0 1200 100" preserveAspectRatio="none">
            <path d="M0 65 Q 100 35 200 65 T 400 65 T 600 65 T 800 65 T 1000 65 T 1200 65 V100 H0 Z" fill="var(--accent)"/>
          </svg>
        </div>
        <div class="bubble" data-b></div>
        <div class="breath-stage">
          <div class="ring-wrap" style="width:170px;height:170px">
            <div class="ring-orb" style="width:96px;height:96px;margin:-48px 0 0 -48px"></div>
            <svg viewBox="0 0 230 230">
              <circle class="ring-track" cx="115" cy="115" r="108"></circle>
              <circle class="ring-fill" cx="115" cy="115" r="108"
                      stroke-dasharray="${2 * Math.PI * 108}" stroke-dashoffset="${2 * Math.PI * 108}"></circle>
            </svg>
            <div class="ring-core"><div class="phase-name" data-phase style="font-size:1.1rem">In</div></div>
          </div>
        </div>
      </div>`);
    app.appendChild(s3);

    const bubble = s3.querySelector('[data-b]');
    const timerEl = s3.querySelector('[data-t]');
    const fill = s3.querySelector('.ring-fill');
    const phaseEl = s3.querySelector('[data-phase]');
    const CIRC = 2 * Math.PI * 108;

    let lineIx = 0, lastFullness = 0, left = TOTAL, alive = true;

    const showLine = () => {
      if (!alive || lineIx >= SURF_LINES.length) return;
      const line = SURF_LINES[lineIx++];
      bubble.textContent = line;
      speak(line);
    };
    showLine();

    const engine = new BreathEngine(PATTERNS.surf, 8, {
      onPhase: p => { phaseEl.textContent = p.name; },
      onProgress: (frac, phase) => {
        lastFullness = breathFullness(frac, phase, lastFullness);
        setBreathVar(lastFullness);
        fill.style.strokeDashoffset = String(CIRC * (1 - lastFullness));
      },
      onCycle: showLine,
      onDone: () => { alive = false; setBreathVar(0); this._after(log); }
    });

    const countdown = () => {
      if (!alive) return;
      timerEl.textContent = String(Math.max(0, left--));
      if (left >= 0) setTimeout(countdown, 1000);
    };
    countdown();
    engine.start();
  },

  _after(log) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    let after = Math.max(0, log.before - 3);
    const s4 = el(`
      <div class="screen stack">

      moneyRow.querySelectorAll('.chip').forEach(ch => {
        ch.onclick = () => {
          moneyRow.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
          ch.classList.add('on');
          log.avoided = Number(ch.dataset.v);
        };
      });
      s4.appendChild(moneyRow);
    }

    const done = el('<button class="btn wide">Log it &amp; close</button>');
    s4.appendChild(done);
    done.onclick = () => {
      log.after = after;
      State.logUrge(log);
      const c = State.companion;
      app.innerHTML = '';
      const closeLine = pick({
        sera: "Proud of you. Genuinely. Now do one kind, real-world thing for yourself — water, a walk, a window. Off you go.",
        noa: "Logged. Notice what you feel now versus five minutes ago. That difference is yours to keep.",
        kai: "Rep completed. Every surfed wave makes the next one smaller. Now get out of the app — that's an order, warmly."
      });
      const out = el(`
        <div class="screen stack" style="text-align:center;align-items:center;">
          <div class="stat" style="min-width:200px">
            <div class="num">${State.urgesSurfed()}</div>
            <div class="lbl">waves surfed, total</div>
          </div>
          ${log.avoided ? `<div class="stat" style="min-width:200px"><div class="num">${fmtMoney(State.moneyRedirected())}</div><div class="lbl">redirected to your real life, total</div></div>` : ''}
          <div class="bubble" style="width:100%" data-b></div>
          <button class="btn wide" data-h>Close &amp; go live your life</button>
        </div>`);
      app.appendChild(out);
      speak(closeLine);
      typewrite(out.querySelector('[data-b]'), closeLine, 32, null);
      out.querySelector('[data-h]').onclick = () => App.home();
    };
    app.appendChild(s4);
  }
};

const App = {

  /* ---------- boot ---------- */
  init() {
    State.load();
    this._particles();
    document.getElementById('sosBtn').onclick = () => Surf.start();
    if (!State.profile.companion) this.onboard();
    else { this.applyTheme(); this.home(); }
  },

  timeOfDay() {
    const h = new Date().getHours();
    if (h < 5)  return 'night';
    if (h < 12) return 'morning';
    if (h < 18) return 'afternoon';
    if (h < 23) return 'evening';
    return 'night';
  },

  applyTheme() {
    const c = State.companion;
    if (!c) return;
    const r = document.documentElement.style;
    r.setProperty('--accent', c.accent);
    r.setProperty('--accent-soft', c.accentSoft);
    r.setProperty('--glow', c.glow);
    r.setProperty('--c1', c.palette[0]);
    r.setProperty('--c2', c.palette[1]);
    r.setProperty('--c3', c.palette[2]);
  },

  _particles() {
    const holder = document.getElementById('bgParticles');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.bottom = (Math.random() * -10) + 'vh';
      s.style.animationDuration = (14 + Math.random() * 22) + 's';
      s.style.animationDelay = (Math.random() * 20) + 's';
      s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
      holder.appendChild(s);
    }
  },

  /* Companion media: breathing video loop → local/hosted portrait → styled monogram.
     Videos carry their own motion, so the 'ambient' CSS breath animation is dropped. */
  portraitImg(c, cls) {
    if (c.videoRemote || c.video) {
      const vcls = cls.replace(/\bambient\b/, '').trim();
      return `<video class="${vcls}" autoplay muted loop playsinline disablepictureinpicture
        poster="${c.portrait}" data-id="${c.id}" data-cls="${cls}"
        onerror="App.videoFallback(this)">
        ${c.video ? `<source src="${c.video}" type="video/mp4">` : ''}
        ${c.videoRemote ? `<source src="${c.videoRemote}" type="video/mp4" onerror="App.videoFallback(this.parentNode)">` : ''}
      </video>`;
    }
    return this._imgTag(c.portrait, c.portraitRemote, c.name[0], cls);
  },

  _imgTag(src, remote, initial, cls) {
    return `<img class="${cls}" src="${src}" alt=""
      data-remote="${remote || ''}" data-initial="${initial}"
      onerror="App.portraitFallback(this)">`;
  },

  videoFallback(video) {
    if (!video || video.tagName !== 'VIDEO' || !video.isConnected) return;
    const c = COMPANIONS[video.dataset.id];
    const cls = video.dataset.cls || video.className;
    video.replaceWith(el(this._imgTag(c.portrait, c.portraitRemote, c.name[0], cls)));
  },

  portraitFallback(img) {
    if (img.dataset.remote) {
      const remote = img.dataset.remote;
      img.dataset.remote = '';
      img.src = remote;
      return;
    }
    const fb = el(`<div class="portrait-fallback ${img.className}">${img.dataset.initial || '·'}</div>`);
    img.replaceWith(fb);
  },

          </div>
        </div>
        ${overCap ? '<div class="notice">Soft cap reached — ' + minsToday + ' min today. Practices still work, but ' + c.name + ' would rather you take the calm outside.</div>' : ''}
        <h3 class="dim" style="margin-top:6px">Practices</h3>
        <div class="stack" data-practices style="gap:10px"></div>
        <div class="faint" style="text-align:center; padding-top:8px">
          Feeling the pull toward the old stuff? The button below is the whole reason this app exists.
        </div>
      </div>`);

    typewrite(home.querySelector('[data-greet]'), greeting, 26, null);
    home.querySelectorAll('[data-nav]').forEach(b => {
      b.onclick = () => b.dataset.nav === 'journey' ? this.journey() : this.why();
    });

    const list = home.querySelector('[data-practices]');
    PRACTICES.forEach(p => {
      const item = el(`
        <div class="card click spread">
          <div>
            <h3>${p.title}</h3>
            <div class="faint">${p.subtitle}</div>
          </div>
          <span class="accent" style="font-size:1.4rem">›</span>
        </div>`);
      item.onclick = () => Session.start(p);
      list.appendChild(item);
    });

    app.appendChild(home);
  },

  /* ---------- journey / dashboard ---------- */
  journey() {
    const app = document.getElementById('app');
    document.getElementById('sosBtn').classList.remove('hidden');
    app.innerHTML = '';

    const rel = State.avgRelease();
    const monthly = State.profile.monthlySpend;
    const j = el(`
      <div class="screen stack">
        <div class="topbar">
          <button class="linklike" data-back>‹ back</button>
          <span class="brand">your journey</span>
        </div>
        <div class="stat-grid">
          <div class="stat"><div class="num">${State.totalMinutes()}</div><div class="lbl">minutes regulated</div></div>
          <div class="stat"><div class="num">${State.urgesSurfed()}</div><div class="lbl">waves surfed</div></div>
          <div class="stat"><div class="num">${fmtMoney(State.moneyRedirected())}</div><div class="lbl">redirected to real life</div></div>
          <div class="stat"><div class="num">${State.daysShownUp()}</div><div class="lbl">days you showed up</div></div>
        </div>
        ${rel != null ? `<div class="notice">On average, a session drops your tension by <strong>${rel.toFixed(1)} points</strong>. Your nervous system is learning the way down.</div>` : ''}
        ${monthly > 0 ? `<div class="card"><h3>The old cost</h3><p class="dim" style="font-size:.95rem;margin-top:6px">You said the old habit ran about <strong style="color:var(--accent)">${fmtMoney(monthly)}/month</strong> — ${fmtMoney(monthly * 12)} a year. Every wave you surf keeps a piece of that yours.</p></div>` : ''}
        <div class="card stack" data-chart-card>
          <h3>Tension: walked in → walked out</h3>
          <p class="faint">Each pair is one session. Left bar before, right bar after.</p>
          <div class="bars" data-chart></div>
        </div>
        <div class="card stack">
          <h3>Our promises</h3>
          <div class="stack" data-promises style="gap:12px"></div>
        </div>
        <div class="card stack">
          <h3>If it's bigger than an app</h3>
          <p class="dim" style="font-size:.93rem">If spending or porn use feels genuinely out of control, that's not a willpower failure — it's a loop that deserves real support. SMART Recovery (smartrecovery.org) and Sex Addicts Anonymous (saa-recovery.org) are free and anonymous. Haven is a tool, not treatment.</p>
        </div>
        <button class="linklike" data-reset style="align-self:center">start over (erases everything)</button>
      </div>`);

    j.querySelector('[data-back]').onclick = () => this.home();
    j.querySelector('[data-reset]').onclick = () => {
      if (confirm('Erase all local data and start over?')) { State.reset(); location.reload(); }
    };

    const chart = j.querySelector('[data-chart]');
    const recent = State.recentSessions(7).filter(s => s.before != null && s.after != null);
    if (!recent.length) {
      j.querySelector('[data-chart-card]').innerHTML =
        '<h3>Tension: walked in → walked out</h3><p class="faint" style="margin-top:6px">Finish a practice and your before/after will show here.</p>';
    } else {
      recent.forEach(s => {
        const b = el(`<div class="bar neg" style="height:${Math.max(6, s.before / 10 * 100)}%"></div>`);
        const a = el(`<div class="bar" style="height:${Math.max(6, s.after / 10 * 100)}%; margin-right:6px"></div>`);
        chart.appendChild(b); chart.appendChild(a);
      });
    }

    const ph = j.querySelector('[data-promises]');
    PROMISES.forEach(p => {
      ph.appendChild(el(`<div><strong style="font-size:.95rem">${p.title}</strong><p class="dim" style="font-size:.9rem">${p.body}</p></div>`));
    });

    app.appendChild(j);
  },

  /* ---------- why this works ---------- */
  why() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const w = el(`
      <div class="screen stack">
        <div class="topbar">
          <button class="linklike" data-back>‹ back</button>
          <span class="brand">why this works</span>
        </div>
        <p class="dim">No magic, no woo — the practices here are the boring, replicated parts of stress physiology. The honest version:</p>
        <div class="stack" data-sci></div>
        <div class="notice">Haven is a self-regulation tool, not medical or psychological care. If you're struggling, a real human professional beats any app — including this one.</div>
      </div>`);
    w.querySelector('[data-back]').onclick = () => this.home();
    const holder = w.querySelector('[data-sci]');
    SCIENCE.forEach(s => {
      holder.appendChild(el(`<div class="card stack" style="gap:8px"><h3>${s.title}</h3><p class="dim" style="font-size:.94rem">${s.body}</p></div>`));
    });
    app.appendChild(w);
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>

</body>
</html>
