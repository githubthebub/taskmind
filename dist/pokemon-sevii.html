/* Pokémon Sevii Adventures — page chrome */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body{
  background: radial-gradient(ellipse at 50% -10%, #1d3a5f 0%, #0b1526 62%, #060a14 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; overflow:hidden;
  font-family: system-ui, sans-serif;
  touch-action:none;
  -webkit-user-select:none; user-select:none;
}
#game{
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius:6px;
  box-shadow: 0 0 0 4px #223, 0 0 0 6px #446, 0 18px 60px rgba(0,0,0,0.6);
  background:#000;
}
#gamepad{ display:none; width:100%; max-width:560px; padding:2px 14px 10px; }
@media (pointer:coarse){
  #gamepad{ display:flex; justify-content:space-between; align-items:center; }
}
.dpad{ position:relative; width:132px; height:132px; }
.dpad button, .keys button{
  position:absolute; border:none; border-radius:10px;
  background:#2a3450; color:#9fb3d9; font-size:16px; font-weight:700;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4);
  touch-action:none;
}
.dpad button{ width:44px; height:44px; }
.dpad button.on, .keys button.on{ background:#44548a; color:#fff; }
.dpad .up{ left:44px; top:0; } .dpad .down{ left:44px; top:88px; }
.dpad .left{ left:0; top:44px; } .dpad .right{ left:88px; top:44px; }
.keys{ position:relative; width:170px; height:132px; }
.keys .a{ width:56px; height:56px; border-radius:50%; right:0; top:18px; left:auto;
  background:#7a2b35; color:#ffd9de; font-size:20px; }
.keys .b{ width:50px; height:50px; border-radius:50%; left:8px; top:62px;
  background:#2b4a7a; color:#d9e6ff; font-size:18px; }
.keys .st{ width:64px; height:26px; left:40px; top:2px; font-size:11px; border-radius:13px;
  background:#3a3a46; color:#cfcfda; }
.keys .a.on{ background:#a83d4b; } .keys .b.on{ background:#3d63a8; } .keys .st.on{ background:#55556a; }

<script>
/* ============================================================
   audio.js — WebAudio chiptune sequencer + SFX (all original).
   Unlocks on first user input. M toggles mute.
   ============================================================ */
'use strict';

const SND = {
  ctx:null, master:null, musicG:null, sfxG:null,
  muted:false, songName:null, _timer:null, _tracks:null, _songT:0,
};

SND.init = function(){
  if(SND.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  SND.ctx = new AC();
  SND.master = SND.ctx.createGain(); SND.master.gain.value = 0.55;
  SND.master.connect(SND.ctx.destination);
  SND.musicG = SND.ctx.createGain(); SND.musicG.gain.value = 0.42;
  SND.musicG.connect(SND.master);
  SND.sfxG = SND.ctx.createGain(); SND.sfxG.gain.value = 0.8;
  SND.sfxG.connect(SND.master);
  if(SND._pendingSong){ SND.music(SND._pendingSong); SND._pendingSong=null; }
};
SND.toggleMute = function(){
  SND.muted = !SND.muted;
  if(SND.master) SND.master.gain.value = SND.muted ? 0 : 0.55;
  return SND.muted;
};

// ---- note helpers ----
const NOTE_IDX = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nfreq(n){
  // e.g. 'C4', 'F#3'
  const m = /^([A-G]#?)(\d)$/.exec(n);
  if(!m) return 0;
  const midi = (Number(m[2])+1)*12 + NOTE_IDX[m[1]];
  return 440*Math.pow(2,(midi-69)/12);
}
// parse "C4:2 - :1 E4:1" → [{f,beats}] ('-' = rest)
function parseNotes(str){
  return str.trim().split(/\s+/).map(tok=>{
    const [n,b] = tok.split(':');
    return { f: n==='-' ? 0 : nfreq(n), beats: Number(b||1) };
  });
}

// ---- songs (original compositions) ----
const SONGS = {
  title:{ bpm:126, tracks:[
    { wave:'square', vol:0.16, notes:'E4:1 G4:1 B4:1 E5:2 D5:1 B4:2 A4:1 B4:1 G4:2 - :2 C5:1 B4:1 A4:1 G4:2 A4:1 B4:3 - :1' },
    { wave:'triangle', vol:0.30, notes:'E3:2 E3:2 C3:2 C3:2 D3:2 D3:2 G2:2 G2:2 A2:2 A2:2 C3:2 C3:2 D3:2 D3:2 B2:2 B2:2'.replace('B2:2 B2:2','B2:2 B2:2') },
    { wave:'noise', vol:0.05, notes:'C5:1 - :1 C5:1 - :1 C5:1 - :1 C5:0.5 C5:0.5 C5:1 - :1 C5:1 - :1 C5:1 - :1 C5:1 - :1' },
  ]},

SND.music = function(name){
  if(SND.songName === name) return;
  if(!SND.ctx){ SND._pendingSong = name; SND.songName = name; return; }
  SND.stopMusic();
  SND.songName = name;
  const song = SONGS[name];
  if(!song) return;
  const beat = 60/song.bpm;
  SND._tracks = song.tracks.map(t=>({
    wave:t.wave, vol:t.vol,
    notes:parseNotes(t.notes),
    len:0, i:0, t:SND.ctx.currentTime + 0.08,
  }));
  for(const tr of SND._tracks) tr.len = tr.notes.reduce((a,n)=>a+n.beats,0);
  SND._timer = setInterval(()=>{
    if(!SND.ctx) return;
    const horizon = SND.ctx.currentTime + 0.45;
    for(const tr of SND._tracks){
      while(tr.t < horizon){
        const n = tr.notes[tr.i];
        const dur = n.beats*beat;
        if(n.f>0) SND._playNote(tr.wave, n.f, tr.t, dur, tr.vol);
        tr.t += dur;
        tr.i = (tr.i+1)%tr.notes.length;
      }
    }
  }, 120);
};
SND.stopMusic = function(){
  if(SND._timer){ clearInterval(SND._timer); SND._timer=null; }
  SND.songName = null;
  SND._tracks = null;
};
SND._noiseBuf = null;
SND._playNote = function(wave, freq, t, dur, vol){
  const c = SND.ctx;
  const g = c.createGain();
  g.connect(SND.musicG);
  const sus = Math.max(0.03, dur*0.82);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+0.008);
  g.gain.setValueAtTime(vol, t+sus*0.7);
  g.gain.linearRampToValueAtTime(0, t+sus);
  if(wave==='noise'){
    if(!SND._noiseBuf){
      const b = c.createBuffer(1, c.sampleRate*0.5, c.sampleRate);
      const d = b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      SND._noiseBuf = b;
    }
    const s = c.createBufferSource(); s.buffer=SND._noiseBuf;
    s.playbackRate.value = freq>700? 2.4 : 1.1;
    const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value = freq>700? 6000:2000;
    s.connect(f); f.connect(g);
    s.start(t); s.stop(t+Math.min(sus,0.09));
  } else {
    const o = c.createOscillator();
    o.type = wave; o.frequency.value = freq;
    o.connect(g);
    o.start(t); o.stop(t+sus+0.02);
  }
};

// ---- SFX ----
function tone(freq, dur, wave, vol, slide, delay){
  if(!SND.ctx) return;
  const c = SND.ctx, t = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = wave||'square'; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
  g.gain.setValueAtTime(vol||0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(SND.sfxG);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(dur, vol, delay, low){
  if(!SND.ctx) return;
  const c = SND.ctx, t = c.currentTime + (delay||0);
  if(!SND._noiseBuf) SND._playNote('noise',100,t,0.001,0); // ensure buffer
  const s = c.createBufferSource(); s.buffer = SND._noiseBuf;
  s.playbackRate.value = low? 0.35 : 0.9;
  const g = c.createGain();
  g.gain.setValueAtTime(vol||0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  s.connect(g); g.connect(SND.sfxG);
  s.start(t); s.stop(t+dur);
}

   sprites.js — all art is drawn in code (original artwork).
   - Tiles: 16x16 pixel style
   - Overworld characters: 16x20 pixel style
   - Battle sprites: 48x48 (mons) / 48x56 (trainers) vector style
   ============================================================ */
'use strict';

const SPR = { _c:{} };
const OUTC = '#2e2440';

function cv(w,h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
function cx2(c){ const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

// ---- vector helpers (battle sprites) ----
function E(c,cx,cy,rx,ry,f,o,rot){
  c.save(); c.translate(cx,cy); c.rotate(rot||0);
  c.beginPath(); c.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  c.fillStyle=f; c.fill();
  if(o!==0){ c.lineWidth=o||1.4; c.strokeStyle=OUTC; c.stroke(); }
  c.restore();
}
function CIR(c,cx,cy,r,f,o){ E(c,cx,cy,r,r,f,o); }
function PG(c,pts,f,o){
  c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
  c.closePath(); c.fillStyle=f; c.fill();
  if(o!==0){ c.lineWidth=o||1.4; c.strokeStyle=OUTC; c.lineJoin='round'; c.stroke(); }
}
function LN(c,x1,y1,x2,y2,w,col){
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.lineWidth=w; c.strokeStyle=col||OUTC; c.lineCap='round'; c.stroke();
}
function ARC(c,cx,cy,r,a0,a1,w,col){
  c.beginPath(); c.arc(cx,cy,r,a0,a1);
  c.lineWidth=w; c.strokeStyle=col||OUTC; c.lineCap='round'; c.stroke();
}
function EYE(c,x,y,rx,ry,pup){ // white eye with pupil
  E(c,x,y,rx,ry,'#fff',1);
  E(c,x,y+ry*0.15,rx*0.45,ry*0.45,pup||'#2e2440',0);
}
// curved feather/plume: quad curve from p0 to p1 with thickness w
function PLUME(c,x0,y0,cx,cy,x1,y1,w,f,o){
  c.beginPath();
  c.moveTo(x0,y0);
  c.quadraticCurveTo(cx,cy-w*0.5,x1,y1);
  c.quadraticCurveTo(cx,cy+w*0.6,x0,y0+w*0.7);
  c.closePath();
  c.fillStyle=f; c.fill();
  if(o!==0){ c.lineWidth=o||1.3; c.strokeStyle=OUTC; c.lineJoin='round'; c.stroke(); }
}
// spiky fan of triangles around a point
function SPIKES(c,cx,cy,rIn,rOut,a0,a1,n,f,o){
  for(let i=0;i<n;i++){
    const a=a0+(a1-a0)*(i+0.5)/n, da=(a1-a0)/n*0.42;
    PG(c,[[cx+Math.cos(a-da)*rIn,cy+Math.sin(a-da)*rIn],
          [cx+Math.cos(a)*rOut,cy+Math.sin(a)*rOut],
          [cx+Math.cos(a+da)*rIn,cy+Math.sin(a+da)*rIn]],f,o);
  }
}

SPR.mon = function(id, side){
  const key = 'mon:'+id+':'+side;
  if(this._c[key]) return this._c[key];
  const c = cv(48,48), x = cx2(c);
  x.lineJoin='round';
  const fn = (side==='back' && MON_ART[id+'_back']) ? MON_ART[id+'_back'] : MON_ART[id];
  if(fn) fn(x);
  this._c[key] = c;
  return c;
};
SPR.monIcon = function(id){
  const key='icon:'+id;
  if(this._c[key]) return this._c[key];
  const c = cv(20,20), x = cx2(c);
  x.drawImage(SPR.mon(id,'front'), 0,0,48,48, 0,0,20,20);
  this._c[key]=c;
  return c;
};

function drawHumanOW(x, pal, dir, frame){
  const R=(px,py,w,h,col)=>{ x.fillStyle=col; x.fillRect(px,py,w,h); };
  const OUT='#2e2440';
  const legL = frame===1, legR = frame===2;
  // === legs (y14..19) ===
  const legC = pal.pants;
  if(pal.skirt){
    R(4,13,8,4,legC);          // skirt
    R(3,13,10,1,legC);
    R(5,17, 2, legL?1:2, pal.skin); R(9,17, 2, legR?1:2, pal.skin); // legs
    R(5,19-(legL?1:0),2,1,OUT); R(9,19-(legR?1:0),2,1,OUT);         // shoes
  } else {
    R(5,13, 2, legL?5:6, legC); R(9,13, 2, legR?5:6, legC);
    R(5,19-(legL?1:0),2,1,OUT); R(9,19-(legR?1:0),2,1,OUT);
  }
  // === torso (y8..13) ===
  R(4,8,8,5,pal.shirt);
  // arms
  const armY = (frame===0)?9:8;
  R(3,armY,1,4,pal.shirt); R(12,armY,1,4,pal.shirt);
  R(3,armY+4,1,1,pal.skin); R(12,armY+4,1,1,pal.skin);
  // === head (y0..8) ===
  if(dir===1){ // facing up: back of head
    R(4,1,8,7,pal.hair);
    if(pal.hat){ R(3,0,10,3,pal.hat); R(3,3,10,1,pal.hat); }
  } else if(dir===0){ // down
    R(4,1,8,3,pal.hair);
    R(4,4,8,4,pal.skin);
    R(4,4,1,2,pal.hair); R(11,4,1,2,pal.hair);
    R(5,5,1,2,'#2e2440'); R(10,5,1,2,'#2e2440'); // eyes
    if(pal.glasses){ R(5,5,2,1,'#303048'); R(9,5,2,1,'#303048'); R(7,5,2,1,'#303048'); }
    if(pal.hat){ R(3,0,10,3,pal.hat); R(4,3,8,1,pal.hatFront||pal.hat); }
    else R(3,0,10,2,pal.hair);
  } else { // side (draw facing left; right is mirrored by caller)
    R(4,1,8,3,pal.hair); R(9,4,3,4,pal.hair);
    R(4,4,5,4,pal.skin);
    R(5,5,1,2,'#2e2440');
    if(pal.glasses) R(4,5,3,1,'#303048');
    if(pal.hat){ R(3,0,10,3,pal.hat); R(1,2,5,1,pal.hat); }
    else R(3,0,10,2,pal.hair);
  }
  // outline-ish shadow under feet omitted (engine draws shadow)
}

SPR.moltresOW = function(frame){

// surf mount: a friendly blue plesiosaur the hero rides (20x16), dir 0..3, frame 0/1
SPR.surfMount = function(dir, frame){
  const key='surf:'+dir+':'+frame;
  if(this._c[key]) return this._c[key];
  const c = cv(20,16), x = cx2(c);
  x.lineJoin='round';
  const body='#4aa0e0', belly='#bfe6f8', shell='#8cd0f0';
  // wake ripples
  x.strokeStyle='rgba(255,255,255,0.7)'; x.lineWidth=1;
  const wf = frame?0.3:0;
  x.beginPath(); x.arc(4,14,2+wf,Math.PI,0); x.arc(15,14,2-wf,Math.PI,0); x.stroke();
  // body shell
  E(x,10,10,8.5,5.2,body,1.3);
  E(x,10,11,6,3.4,belly,0);
  E(x,10,8.5,7,3.2,shell,0);
  // flippers (paddle)
  const fp = frame?1:-1;
  PG(x,[[4,11],[2,13+fp],[6,12]],body,1);
  PG(x,[[16,11],[18,13-fp],[14,12]],body,1);
  // neck + head, oriented by dir
  let hx=10, hy=4;
  if(dir===2){ hx=3; hy=6; } else if(dir===3){ hx=17; hy=6; } else if(dir===0){ hx=10; hy=7; } else { hx=10; hy=3; }
  // neck
  LN(x,10,7,hx,hy,4.2,OUTC); LN(x,10,7,hx,hy,2.8,body);
  CIR(x,hx,hy,3,body,1.2);
  // eye + horn
  if(dir!==1){
    const ex = dir===2? hx-1 : dir===3? hx+1 : hx-1.4;
    x.fillStyle='#2e2440'; x.fillRect(ex,hy-1,1,1);
    if(dir===0){ x.fillStyle='#2e2440'; x.fillRect(hx+0.6,hy-1,1,1); }
  }
  PG(x,[[hx-1,hy-2.6],[hx,hy-5],[hx+1,hy-2.6]],'#e8f4ff',0.8);
  this._c[key]=c;
  return c;
};

function speckle(x, col, seed, n){
  let s = seed;
  const rnd = ()=>{ s = (s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  x.fillStyle = col;
  for(let i=0;i<n;i++){ x.fillRect((rnd()*15)|0,(rnd()*15)|0,1,1); }
}

SPR.stamp = function(name){
  const key='st:'+name;
  if(this._c[key]) return this._c[key];
  const def = STAMP_ART[name];
  const c = cv(def.w, def.h), x = cx2(c);
  x.lineJoin='round';
  def.draw(x);
  this._c[key]=c;
  return c;
};

// ---- Mon factory
function expForLevel(l){ return l*l*l; }
function calcStats(sp, lvl){
  const b = SPECIES[sp].base;
  return {
    hp:  Math.floor(2*b[0]*lvl/100) + lvl + 10,
    atk: Math.floor(2*b[1]*lvl/100) + 5,
    def: Math.floor(2*b[2]*lvl/100) + 5,
    spa: Math.floor(2*b[3]*lvl/100) + 5,
    spd: Math.floor(2*b[4]*lvl/100) + 5,
    spe: Math.floor(2*b[5]*lvl/100) + 5,
  };
}
function movesAtLevel(sp, lvl){
  const learned = SPECIES[sp].learn.filter(e => e[0] <= lvl).map(e => e[1]);
  return learned.slice(-4);
}
function makeMon(sp, lvl, moves){
  const st = calcStats(sp, lvl);
  const mv = (moves || movesAtLevel(sp, lvl)).map(id => ({ id, pp:MOVES[id].pp, maxpp:MOVES[id].pp }));
  return {
    sp, lvl, nick:SPECIES[sp].name,
    hp:st.hp, maxhp:st.hp, stats:st,
    moves:mv, status:null, sleepTurns:0,
    exp:expForLevel(lvl),
  };
}
function healMon(m){
  m.hp = m.maxhp; m.status = null; m.sleepTurns = 0;
  for(const mv of m.moves) mv.pp = mv.maxpp;
}
/* ============================================================
   maps.js — world maps, NPCs, warps, dialogue scripts.
   Maps are built with carve helpers into 2D char grids.
   ============================================================ */
'use strict';

const SOLID_TILES = new Set(['T','M','r','C','W','K','w','B','X','O','R','Z','H']);
const ENCOUNTER_TILES = new Set(['G','A']);

function grid(w,h,fill){ return Array.from({length:h},()=>Array(w).fill(fill)); }
function rectg(g,x,y,w,h,ch){
  for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++)
    if(j>=0&&j<g.length&&i>=0&&i<g[0].length) g[j][i]=ch;
}
function scatter(g,ch,onto,seed,frac){
  let s=seed;
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let j=0;j<g.length;j++) for(let i=0;i<g[0].length;i++)
    if(g[j][i]===onto && rnd()<frac) g[j][i]=ch;
}

// ---------------- Scripts helper: T = trainer dialogue shortcuts
function trainerScript(id){
  const t = TRAINERS[id];
  return (f)=> f['beat_'+id]
    ? [t.after]
    : [t.intro, {trainer:id}, t.after];
}
// generic Kanto Pokémon Center interior + nurse
function kantoPC(){
  const g = grid(15,10,'F');
  rectg(g,0,0,15,2,'W');
  for(let j=0;j<10;j++){ g[j][0]='W'; g[j][14]='W'; }
  rectg(g,0,9,15,1,'W'); g[9][7]='k';
  rectg(g,3,3,6,1,'K');       // healing counter
  rectg(g,11,1,2,2,'B');      // PC machine
  g[2][1]='B'; g[7][1]='B';   // plants
  return g;
}
function kantoNurse(){
  return { id:'nurse', sprite:'nurse', x:5, y:2, dir:0, script:()=>[
    "Welcome to the POKéMON CENTER! We can restore your tired POKéMON to full health.",
    {q:'Shall I heal your POKéMON?', yes:[
      {heal:true},
      "Thank you! Your POKéMON are back to full health!",
      "We hope to see you again. Safe travels!",
    ], no:[ "Okay! Come back any time." ]},
  ]};
}

/* ============================================================
   ui.js — FRLG-style boxes, typewriter dialogue, menus, bars.
   All UI runs as coroutines awaiting frames (see engine.js).
   ============================================================ */
'use strict';

const VW = 480, VH = 320;           // internal canvas size
const FONT_D = '21px VT323';        // dialogue font
const FONT_DS = '18px VT323';       // small dialogue font
const FONT_U = '9px "Press Start 2P"';   // HUD font
const FONT_UB = '11px "Press Start 2P"'; // HUD big
const INK = '#40424e';
const INK_SHADOW = 'rgba(64,66,78,0.25)';

const UI = {};

UI.rounded = function(x, xx,yy,w,h,r){
  x.beginPath();
  x.moveTo(xx+r,yy);
  x.arcTo(xx+w,yy,xx+w,yy+h,r);
  x.arcTo(xx+w,yy+h,xx,yy+h,r);
  x.arcTo(xx,yy+h,xx,yy,r);
  x.arcTo(xx,yy,xx+w,yy,r);
  x.closePath();
};

// classic FRLG message frame: white with blue double border
UI.box = function(x, xx,yy,w,h,opts){
  opts = opts||{};
  x.save();
  UI.rounded(x, xx+2,yy+3,w,h,6);
  x.fillStyle='rgba(48,56,80,0.35)'; x.fill();     // soft shadow
  UI.rounded(x, xx,yy,w,h,6);
  x.fillStyle = opts.fill || '#f8f8f8'; x.fill();
  x.lineWidth = 3; x.strokeStyle = opts.border || '#5080c0'; x.stroke();
  UI.rounded(x, xx+2.5,yy+2.5,w-5,h-5,4);
  x.lineWidth = 1.5; x.strokeStyle = opts.inner || '#b8d0e8'; x.stroke();
  x.restore();
};
// beige battle info panel
UI.panel = function(x, xx,yy,w,h){
  x.save();
  UI.rounded(x, xx,yy,w,h,5);
  x.fillStyle='#f8f0d0'; x.fill();
  x.lineWidth=3; x.strokeStyle='#786840'; x.stroke();
  UI.rounded(x, xx+2.5,yy+2.5,w-5,h-5,3);
  x.lineWidth=1.5; x.strokeStyle='#e8d8a8'; x.stroke();
  x.restore();
};

UI.text = function(x, str, xx, yy, opts){
  opts = opts||{};
  x.save();
  x.font = opts.font || FONT_D;
  x.textBaseline = 'alphabetic';
  x.textAlign = opts.align || 'left';
  if(opts.shadow !== false){
    x.fillStyle = opts.shadowCol || INK_SHADOW;
    x.fillText(str, xx+1, yy+1);
  }
  x.fillStyle = opts.col || INK;
  x.fillText(str, xx, yy);
  x.restore();
};
UI.wrap = function(x, str, maxw, font){
  x.save(); x.font = font || FONT_D;
  const out = [];
  for(const hard of String(str).split('\n')){
    const words = hard.split(' ');
    let line='';
    for(const w of words){
      const t = line? line+' '+w : w;
      if(x.measureText(t).width > maxw && line){ out.push(line); line=w; }
      else line=t;
    }
    out.push(line);
  }
  x.restore();
  return out;
};

// HP bar: pos, w, ratio
UI.hpbar = function(x, xx, yy, w, ratio){
  ratio = Math.max(0, Math.min(1, ratio));
  x.save();
  x.fillStyle='#584838'; x.fillRect(xx-14, yy-1, w+15, 7);
  x.font='7px "Press Start 2P"'; x.fillStyle='#f8b050'; x.textAlign='left';
  x.fillText('HP', xx-12, yy+5);
  x.fillStyle='#40424e'; x.fillRect(xx+1, yy, w, 5);
  const col = ratio>0.5 ? '#48d068' : ratio>0.2 ? '#f8e038' : '#f05038';
  x.fillStyle=col; x.fillRect(xx+1, yy, Math.round(w*ratio), 5);
  x.fillStyle='rgba(255,255,255,0.35)'; x.fillRect(xx+1, yy, Math.round(w*ratio), 2);
  x.restore();
};
UI.expbar = function(x, xx, yy, w, ratio){
  ratio = Math.max(0, Math.min(1, ratio));
  x.save();
  x.fillStyle='#40424e'; x.fillRect(xx, yy, w, 3);
  x.fillStyle='#48a8f8'; x.fillRect(xx, yy, Math.round(w*ratio), 3);
  x.restore();
};
UI.statusTag = function(x, st, xx, yy){
  if(!st) return;
  const s = STATUS[st]; if(!s) return;
  x.save();
  UI.rounded(x, xx, yy, 26, 11, 3);
  x.fillStyle=s.color; x.fill();
  x.font='7px "Press Start 2P"'; x.fillStyle='#fff'; x.textAlign='center';
  x.fillText(s.tag, xx+13, yy+9);
  x.restore();
};

// ============ Dialogue (typewriter) ============
const Dlg = {
  active:false, lines:[], shown:0, done:false, arrowT:0, speaker:null,
};
Dlg.layout = { x:8, y:VH-78, w:VW-16, h:70, pad:14 };

// say one page of text (auto-wrapped, paginated by 2 lines)
Dlg.say = async function(text){
  const L = Dlg.layout;
  const wrapped = UI.wrap(G_ctx, text, L.w - L.pad*2 - 14, FONT_D);
  for(let start=0; start<wrapped.length; start+=2){
    const page = wrapped.slice(start, start+2);
    Dlg.active=true; Dlg.lines=page; Dlg.shown=0; Dlg.done=false;
    const total = page.join('').length;
    // typewriter
    while(Dlg.shown < total){
      Dlg.shown = Math.min(total, Dlg.shown + (Input.held('A')||Input.held('B') ? 3 : 1.4));
      if(Input.took('A')) { Dlg.shown = total; break; }
      await nextFrame();
    }
    Dlg.done=true;
    SNDsafe('pageDone');
    // wait for A/B
    while(!Input.took('A') && !Input.took('B')) await nextFrame();
    SNDsafe('confirm');
  }
  Dlg.active=false;
};
Dlg.draw = function(x){
  if(!Dlg.active) return;
  const L = Dlg.layout;
  UI.box(x, L.x, L.y, L.w, L.h);
  x.save(); x.font=FONT_D;
  let count=0;
  for(let i=0;i<Dlg.lines.length;i++){
    const line = Dlg.lines[i];
    const take = Math.max(0, Math.min(line.length, Math.floor(Dlg.shown - count)));
    UI.text(x, line.slice(0,take), L.x+L.pad, L.y+27+i*24);
    count += line.length;
  }
  if(Dlg.done){
    Dlg.arrowT += 0.1;
    const dy = Math.sin(Dlg.arrowT)>0 ? 1 : 0;
    x.fillStyle='#e05048';
    x.beginPath();
    x.moveTo(L.x+L.w-22, L.y+L.h-16+dy);
    x.lineTo(L.x+L.w-10, L.y+L.h-16+dy);
    x.lineTo(L.x+L.w-16, L.y+L.h-9+dy);
    x.closePath(); x.fill();
  }
  x.restore();
};

// ============ Menu (list with cursor) ============
// items: array of strings (or {label, disabled}). returns index or -1 (B)
const Menu = { active:false, items:[], sel:0, x:0, y:0, w:0, title:null };
Menu.open = async function(items, opts){
  opts = opts||{};
  Menu.items = items.map(i => typeof i==='string' ? {label:i} : i);
  Menu.sel = opts.sel||0;
  Menu.w = opts.w || (Math.max(...Menu.items.map(i=>i.label.length))*11 + 44);
  Menu.x = opts.x !== undefined ? opts.x : VW - Menu.w - 8;
  Menu.y = opts.y !== undefined ? opts.y : 8;
  Menu.h = Menu.items.length*22 + 18;
  if(opts.bottom) Menu.y = VH - Menu.h - (Dlg.active? 84 : 8);
  Menu.active = true;
  try{
    while(true){
      if(Input.took('UP')){ Menu.sel = (Menu.sel+Menu.items.length-1)%Menu.items.length; SNDsafe('cursor'); }
      if(Input.took('DOWN')){ Menu.sel = (Menu.sel+1)%Menu.items.length; SNDsafe('cursor'); }
      if(Input.took('A')){ SNDsafe('confirm'); return Menu.sel; }
      if(Input.took('B') && !opts.noCancel){ SNDsafe('cancel'); return -1; }
      await nextFrame();
    }
  } finally { Menu.active=false; }
};
Menu.draw = function(x){
  if(!Menu.active) return;
  UI.box(x, Menu.x, Menu.y, Menu.w, Menu.h);
  x.save(); x.font=FONT_D;
  for(let i=0;i<Menu.items.length;i++){
    const it = Menu.items[i];
    UI.text(x, it.label, Menu.x+26, Menu.y+24+i*22, {col: it.disabled? '#a8a8b0' : INK});
    if(i===Menu.sel){
      x.fillStyle='#e05048';
      x.beginPath();
      x.moveTo(Menu.x+10, Menu.y+11+i*22);
      x.lineTo(Menu.x+19, Menu.y+16+i*22);
      x.lineTo(Menu.x+10, Menu.y+21+i*22);
      x.closePath(); x.fill();
    }
  }
  x.restore();
};
UI.yesno = async function(){
  const r = await Menu.open(['YES','NO'], {x:VW-110, y:VH-78-70, w:100});
  return r===0;
};

// ============ Fades & flashes ============
const Fx = { fade:0, flash:0, white:false };
UI.fadeOut = async function(ms){
  ms = ms||400;
  const steps = Math.max(1, Math.round(ms/16.7));
  for(let i=0;i<=steps;i++){ Fx.fade = i/steps; await nextFrame(); }
  Fx.fade = 1;
};
UI.fadeIn = async function(ms){
  ms = ms||400;
  const steps = Math.max(1, Math.round(ms/16.7));
  for(let i=steps;i>=0;i--){ Fx.fade = i/steps; await nextFrame(); }
  Fx.fade = 0;
};
UI.flashBattle = async function(){
  for(let k=0;k<3;k++){
    Fx.white=true;  for(let i=0;i<4;i++){ Fx.flash=1; await nextFrame(); }
    Fx.flash=0; for(let i=0;i<4;i++) await nextFrame();
  }
  Fx.white=false;
};

};

/* ============================================================
   engine.js — input, game loop, overworld, script runner, menus.
   The game logic runs as coroutines that await frames.
   ============================================================ */
'use strict';

const TILE = 16, DS = 2; // art px per tile, draw scale
let G_canvas, G_ctx;
let frameCount = 0;

// ---------------- frame coroutines ----------------
let _waiters = [];
function nextFrame(){ return new Promise(r=>_waiters.push(r)); }
function tickWaiters(){ const w=_waiters; _waiters=[]; for(const r of w) r(); }
async function waitFrames(n){ for(let i=0;i<n;i++) await nextFrame(); }
async function waitMs(ms){ await waitFrames(Math.max(1, Math.round(ms/16.7))); }

// ---------------- input ----------------
const Input = {
  d:{}, pf:{}, // held, pressed-frame-stamp
  held(b){ return !!this.d[b]; },
  pressed(b){ return this.pf[b]===frameCount; },
  took(b){ if(this.pf[b]===frameCount){ this.pf[b]=-1; return true; } return false; },
  press(b){ this.pf[b]=frameCount+1; this.d[b]=true; },
  release(b){ this.d[b]=false; },
};
const KEYMAP = {
  ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
  w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
  W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT',
  z:'A', Z:'A', ' ':'A', Enter:'START',
  x:'B', X:'B', Backspace:'B', Escape:'B',
  Shift:'RUN',
};
function bindInput(){
  window.addEventListener('keydown', e=>{
    const b = KEYMAP[e.key];
    if(!b) return;
    e.preventDefault();
    SND.init();
    if(!Input.d[b]) Input.pf[b] = frameCount+1;
    Input.d[b] = true;
    if(e.key==='m'||e.key==='M') {}
  });
  window.addEventListener('keydown', e=>{
    if(e.key==='m'||e.key==='M'){ SND.init(); const m=SND.toggleMute(); Banner.show(m?'SOUND OFF':'SOUND ON'); }
  });
  window.addEventListener('keyup', e=>{
    const b = KEYMAP[e.key];
    if(b) Input.d[b] = false;
  });
  window.addEventListener('blur', ()=>{ Input.d={}; });
  // touch controls
  document.querySelectorAll('[data-btn]').forEach(el=>{
    const b = el.dataset.btn;
    const down = ev=>{ ev.preventDefault(); SND.init(); if(!Input.d[b]) Input.pf[b]=frameCount+1; Input.d[b]=true; el.classList.add('on'); };
    const up = ev=>{ ev.preventDefault(); Input.d[b]=false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  });
}

const DIRV = [[0,1],[0,-1],[-1,0],[1,0]]; // down,up,left,right

function bagAdd(item,n){ Game.bag[item] = (Game.bag[item]||0)+n; }
function bagTake(item,n){ Game.bag[item] = Math.max(0,(Game.bag[item]||0)-(n||1)); if(!Game.bag[item]) delete Game.bag[item]; }

// ---------------- map handling ----------------
function isVisible(npc){
  if(!npc.vis) return true;
  if(npc.vis[0]==='!') return !Game.flags[npc.vis.slice(1)];
  return !!Game.flags[npc.vis];
}
function loadMap(id, x, y, dir){
  const m = MAPS[id];
  // rebuild grid so field-move changes (cut trees, pushed boulders) reset on entry
  m.grid = m.build(); m.h = m.grid.length; m.w = m.grid[0].length;
  Game.map = m;
  Game.strengthActive = false;
  Game.player.x=x; Game.player.y=y; Game.player.dir=dir!==undefined?dir:0;
  Game.player.moving=false; Game.player.prog=0; Game.player.ox=0; Game.player.oy=0;
  // auto-surf if arriving on water; otherwise dismount
  Game.surfing = (tileAt(m, x, y) === 'w');
  Game.npcs = (m.npcs||[]).map(def=>{
    const rt = Object.assign({}, def);
    if(def.posByFlag && Game.flags[def.posByFlag.flag]){
      rt.x=def.posByFlag.x; rt.y=def.posByFlag.y; rt.dir=def.posByFlag.dir??rt.dir;
    }
    rt.homeX=rt.x; rt.homeY=rt.y;
    rt.ox=0; rt.oy=0; rt.moving=false; rt.prog=0; rt.anim=0; rt.wt=60+Math.random()*120;
    rt.dirN = {down:0,up:1,left:2,right:3}[rt.dir] ?? (typeof rt.dir==='number'?rt.dir:0);
    return rt;
  });
  SND.music(m.music);
  Banner.show(m.name);
}
function tileAt(map,x,y){
  if(x<0||y<0||x>=map.w||y>=map.h) return map.void || 'T';
  return map.grid[y][x];
}
function npcAt(x,y){
  for(const n of Game.npcs) if(isVisible(n) && n.x===x && n.y===y) return n;
  return null;
}
function isBlocked(x,y){
  const t = tileAt(Game.map,x,y);
  if(SOLID_TILES.has(t)) return true;
  if(npcAt(x,y)) return true;
  return false;
}
function warpAt(x,y){
  for(const w of (Game.map.warps||[])) if(w.x===x && w.y===y) return w;
  return null;
}

// ---------------- script runner ----------------
async function runOps(ops, npc){
  for(const op of ops){
    if(typeof op === 'string'){ await Dlg.say(op); continue; }
    if(op.say){ for(const s of op.say) await Dlg.say(s); continue; }
    if(op.q){
      await Dlg.sayHold(op.q);
      const yes = await UI.yesno();
      Dlg.active = false;
      await runOps(yes? op.yes||[] : op.no||[], npc);
      continue;
    }
    if(op.set){ Game.flags[op.set]=true; continue; }
    if(op.sfx){ SND.sfx(op.sfx); await waitMs(400); continue; }
    if(op.music){ SND.music(op.music); continue; }
    if(op.pause){ await waitMs(op.pause); continue; }
    if(op.heal){
      SND.sfx('heal');
      await waitMs(900);
      for(const m of Game.party) healMon(m);
      continue;
    }
    if(op.give){
      bagAdd(op.give.item, op.give.n||1);
      SND.sfx('item');
      const it = ITEMS[op.give.item];
      await Dlg.say(`You received ${op.give.n>1? op.give.n+'× ':''}${it.name}!`);
      continue;
    }
    if(op.take){ bagTake(op.take, 1); continue; }
    if(op.hm){
      Game.flags['hm_'+op.hm] = true;
      bagAdd('hm_'+op.hm, 1);
      SND.sfx('item');
      await Dlg.say('You received the hidden move HM — '+op.hm.toUpperCase()+'!');
      continue;
    }
    if(op.moveNpc){
      const t = Game.npcs.find(n=>n.id===op.moveNpc.id);
      if(t){ t.x=op.moveNpc.x; t.y=op.moveNpc.y; t.homeX=t.x; t.homeY=t.y;
             const d=op.moveNpc.dir;
             t.dirN = typeof d==='number' ? d : ({down:0,up:1,left:2,right:3}[d]??0); }
      continue;
    }
    if(op.trainer){
      const res = await Battle.startTrainer(op.trainer);
      if(res==='loss'){ await blackout(); return 'abort'; }
      Game.flags['beat_'+op.trainer]=true;
      const tr = TRAINERS[op.trainer];
      if(tr.badge && !Game.flags['badge_'+tr.badge]){
        Game.flags['badge_'+tr.badge]=true;
        bagAdd(tr.badge,1);
        SND.sfx('item');
        await Dlg.say('You received the '+ITEMS[tr.badge].name+'!');
      }
      continue;
    }
    if(op.goto){
      Game.busy=true;
      SND.sfx('door');
      await UI.fadeOut(420);
      loadMap(op.goto.to, op.goto.x, op.goto.y, op.goto.dir||0);
      await UI.fadeIn(420);
      continue;
    }
    if(op.wild){
      const res = await Battle.startWild(makeMon(op.wild.sp, op.wild.lvl), {legendary:true});
      if(res==='loss'){ await blackout(); return 'abort'; }
      if(op.wild.resolveFlag && res!=='ran'){ Game.flags[op.wild.resolveFlag]=true; }
      continue;
    }
    if(op.ending){ await Ending.run(); continue; }
  }
}
// say but keep box open (for yes/no)
Dlg.sayHold = async function(text){
  const L = Dlg.layout;
  const wrapped = UI.wrap(G_ctx, text, L.w - L.pad*2 - 14, FONT_D);
  Dlg.active=true; Dlg.lines=wrapped.slice(0,2); Dlg.shown=0; Dlg.done=false;

  while(Dlg.shown < total){

    if(Input.took('A')){ Dlg.shown=total; break; }

  }
  Dlg.done=false; // no arrow; menu takes over
};

async function interactWith(npc){
  Game.busy = true;
  try{
    // face the player (humans only)
    if(npc.sprite && npc.sprite!=='sign' && npc.sprite!=='moltres'){
      npc.dirN = [1,0,3,2][Game.player.dir];
    }
    const def = typeof npc.script==='string' ? SCRIPTS[npc.script] : npc.script;
    const ops = def(Game.flags);

async function interactSimple(text){

function fieldUser(prefTypes){

async function tryFieldMove(kind, tx, ty){

async function blackout(){

// ---------------- world update ----------------
const WALK_SPD = 1.4, RUN_SPD = 2.6;

function worldUpdate(){
  const P = Game.player;

  // NPC idle/wander
  for(const n of Game.npcs){
    if(!isVisible(n)) continue;
    if(n.moving){
      n.prog += 1.0;
      const [dx,dy] = DIRV[n.dirN];
      n.ox = dx*n.prog; n.oy = dy*n.prog;
      n.anim = Math.floor(n.prog/8)%2+1;
      if(n.prog>=TILE){
        n.x+=dx; n.y+=dy; n.moving=false; n.prog=0; n.ox=0; n.oy=0; n.anim=0;
      }
      continue;
    }
    if(Game.busy || !n.wander) continue;
    if(--n.wt<=0){
      n.wt = 80+Math.random()*200;
      const r = Math.floor(Math.random()*5);
      if(r<2){ n.dirN = Math.floor(Math.random()*4); }
      else if(r<4){
        const d = Math.floor(Math.random()*4);
        n.dirN = d;
        const [dx,dy]=DIRV[d];
        const nx=n.x+dx, ny=n.y+dy;
        const t = tileAt(Game.map,nx,ny);
        if(!SOLID_TILES.has(t) && !ENCOUNTER_TILES.has(t) && !npcAt(nx,ny) && !warpAt(nx,ny)
           && !(Game.player.x===nx&&Game.player.y===ny)
           && Math.abs(nx-n.homeX)<=2 && Math.abs(ny-n.homeY)<=2 && t!=='D'){
          n.moving=true; n.prog=0;
        }
      }
    }
  }

  if(Game.busy) return;

  // movement in progress
  if(P.moving){
    P.prog += P.run? RUN_SPD : WALK_SPD;
    const [dx,dy] = DIRV[P.dir];
    if(P.prog>=TILE){
      P.x+=dx; P.y+=dy; P.moving=false; P.prog=0; P.ox=0; P.oy=0;
      P.anim = 0;
      Game.steps++;
      onStepFinish();
    } else {
      P.ox = dx*P.prog; P.oy = dy*P.prog;
      P.anim = Math.floor((P.prog + (P.stepParity?8:0))/8)%2+1;
    }
    return;
  }

  // start menu
  if(Input.took('START')){ openStartMenu(); return; }
  // interact
  if(Input.took('A')){
    const [dx,dy] = DIRV[P.dir];
    let tx=P.x+dx, ty=P.y+dy;
    let n = npcAt(tx,ty);
    if(!n && tileAt(Game.map,tx,ty)==='K') n = npcAt(tx+dx,ty+dy); // across counter
    if(n && n.script){ interactWith(n); return; }
    // field HM moves on the tile we face
    const ft = tileAt(Game.map,tx,ty);
    if(!Game.surfing && ft==='w'){
      if(Game.flags.hm_surf){ tryFieldMove('surf', tx,ty); return; }
    }
    if(ft==='X'){
      if(Game.flags.hm_cut){ tryFieldMove('cut', tx,ty); return; }
      Game.busy=true; interactSimple('This tree looks like it could be CUT down.'); return;
    }
    if(ft==='O'){
      if(Game.flags.hm_strength){ tryFieldMove('strength', tx,ty); return; }
      Game.busy=true; interactSimple('It\'s a big boulder — too heavy to budge by hand.'); return;
    }
  }
  // walking
  let d = -1;
  if(Input.held('UP')) d=1;
  else if(Input.held('DOWN')) d=0;
  else if(Input.held('LEFT')) d=2;
  else if(Input.held('RIGHT')) d=3;
  if(d>=0){
    P.run = (Input.held('RUN') || Input.held('B')) && !Game.surfing;
    if(P.dir!==d){ P.dir=d; P.turnT=6; return; }
    if(P.turnT>0){ P.turnT--; return; }
    const [dx,dy] = DIRV[d];
    const nx = P.x+dx, ny = P.y+dy;
    const t = tileAt(Game.map,nx,ny);
    // Strength: push a boulder if the space beyond it is clear ground
    if(t==='O' && Game.strengthActive && !npcAt(nx,ny)){
      const bx=nx+dx, by=ny+dy, bt=tileAt(Game.map,bx,by);
      if(!SOLID_TILES.has(bt) && bt!=='w' && bt!=='X' && bt!=='O' && !npcAt(bx,by) && !ENCOUNTER_TILES.has(bt) && !warpAt(bx,by)){
        Game.map.grid[ny][nx] = Game.map.ground||'.';
        Game.map.grid[by][bx] = 'O';
        SND.sfx('bump');
        P.moving=true; P.prog=0; P.stepParity=!P.stepParity;
      } else if(Game.time%24===0){ SND.sfx('bump'); }
      return;
    }
    let can;
    if(Game.surfing){
      can = (t==='w') ? !npcAt(nx,ny) : (!SOLID_TILES.has(t) && !npcAt(nx,ny));
    } else {
      can = !isBlocked(nx,ny);
    }
    if(can){
      P.moving=true; P.prog=0;
      P.stepParity = !P.stepParity;
    } else {
      P.anim = 0;
      if(Game.time%24===0) SND.sfx('bump');
    }
  } else { P.anim=0; P.turnT=0; }
}

function onStepFinish(){
  const P = Game.player;
  const t = tileAt(Game.map,P.x,P.y);
  // dismount when surfing onto land
  if(Game.surfing && t!=='w'){ Game.surfing=false; SND.sfx('door'); }
  // warp?
  const w = warpAt(P.x,P.y);
  if(w){ doWarp(w); return; }
  // land encounter (tall grass)?
  if(ENCOUNTER_TILES.has(t) && Game.map.encounters){
    rollEncounter(Game.map.encounters);
    return;
  }
  // cave-floor encounter (every step on the cave ground)
  if(Game.map.floorEncounters && t===Game.map.ground){
    rollEncounter(Game.map.floorEncounters);
    return;
  }
  // water encounter while surfing
  if(Game.surfing && t==='w' && Game.map.waterEncounters){
    rollEncounter(Game.map.waterEncounters);
  }
}
function rollEncounter(enc){
  if(Game.noEncounters) return;
  if(Math.random() >= enc.rate) return;
  const total = enc.list.reduce((a,e)=>a+e[3],0);
  let r = Math.random()*total;
  let pick = enc.list[0];
  for(const e of enc.list){ r-=e[3]; if(r<=0){ pick=e; break; } }
  const lvl = pick[1] + Math.floor(Math.random()*(pick[2]-pick[1]+1));
  startWildEncounter(makeMon(pick[0], lvl));
}
async function doWarp(w){
  Game.busy = true;
  SND.sfx('door');
  await UI.fadeOut(280);
  loadMap(w.to, w.tx, w.ty, w.dir);
  await UI.fadeIn(280);
  Game.busy = false;
}
async function startWildEncounter(mon){
  Game.busy = true;
  const res = await Battle.startWild(mon, {});
  if(res==='loss'){ await blackout(); }
  Game.busy = false;
}

// ---------------- world draw ----------------
function worldDraw(x){
  const P = Game.player, m = Game.map;
  // camera (art px)
  const viewW = VW/DS, viewH = VH/DS;
  let cx = P.x*TILE + P.ox + TILE/2 - viewW/2;
  let cy = P.y*TILE + P.oy + TILE/2 - viewH/2;
  cx = Math.max(0, Math.min(m.w*TILE - viewW, cx));
  cy = Math.max(0, Math.min(m.h*TILE - viewH, cy));
  if(m.w*TILE < viewW) cx = (m.w*TILE - viewW)/2;
  if(m.h*TILE < viewH) cy = (m.h*TILE - viewH)/2;
  cx = Math.round(cx*DS)/DS; cy = Math.round(cy*DS)/DS;
  Game.cam.x=cx; Game.cam.y=cy;

  x.fillStyle = m.outdoor ? '#48a8d8' : '#181820';
  x.fillRect(0,0,VW,VH);

  const x0 = Math.floor(cx/TILE), y0 = Math.floor(cy/TILE);
  const x1 = Math.ceil((cx+viewW)/TILE), y1 = Math.ceil((cy+viewH)/TILE);
  const wf = Math.floor(Game.time/14)%4;   // water frame
  const ff = Math.floor(Game.time/36)%2;   // flower frame
  for(let ty=y0; ty<=y1; ty++){
    for(let tx=x0; tx<=x1; tx++){
      let ch = tileAt(m,tx,ty);
      const px = Math.round((tx*TILE-cx)*DS), py = Math.round((ty*TILE-cy)*DS);
      // ground-base substitutions
      if(ch==='B'){ x.drawImage(SPR.tile(m.ground||'.',0), px, py, TILE*DS, TILE*DS); continue; }
      if(ch==='D'){ x.drawImage(SPR.tile(m.door||m.ground||'p',0), px, py, TILE*DS, TILE*DS); continue; }
      if(ch==='r'||ch==='O'){ x.drawImage(SPR.tile(m.ground||'.',0), px, py, TILE*DS, TILE*DS); }
      let fr = ch==='w'? wf : ch==='f'? ff : 0;
      x.drawImage(SPR.tile(ch,fr), px, py, TILE*DS, TILE*DS);
    }
  }
  // stamps
  for(const [name,sx,sy] of (m.stamps||[])){
    const img = SPR.stamp(name);
    x.drawImage(img, Math.round((sx*TILE-cx)*DS), Math.round((sy*TILE-cy)*DS), img.width*DS, img.height*DS);
  }
  // ruby on pedestal
  if(m.id==='chamber' && !Game.flags.hasRuby){
    const rx=(5.5*TILE-cx)*DS, ry=(2.9*TILE-cy)*DS;
    x.drawImage(SPR.ruby(), Math.round(rx), Math.round(ry), 16*DS, 16*DS);
    const tw = Game.time%90;
    if(tw<12){
      x.save(); x.strokeStyle='#fff'; x.lineWidth=2; x.globalAlpha=1-tw/12;
      const sx2=rx+26, sy2=ry-2;
      x.beginPath(); x.moveTo(sx2-5,sy2); x.lineTo(sx2+5,sy2); x.moveTo(sx2,sy2-5); x.lineTo(sx2,sy2+5); x.stroke();
      x.restore();
    }
  }
  // entities sorted by y
  const ents = [];
  for(const n of Game.npcs) if(isVisible(n)) ents.push({y:n.y*TILE+n.oy, npc:n});
  ents.push({y:P.y*TILE+P.oy, player:true});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){
    if(e.player){
      if(Game.surfing){
        const ax=P.x*TILE+P.ox, ay=P.y*TILE+P.oy;
        const sxp=Math.round((ax-cx)*DS), syp=Math.round((ay-cy)*DS);
        const bob=Math.round(Math.sin(Game.time/16)*1.2);
        x.save(); x.fillStyle='rgba(30,50,70,0.22)';
        x.beginPath(); x.ellipse(sxp+16, syp+40, 13, 4, 0, 0, 7); x.fill(); x.restore();
        x.drawImage(SPR.surfMount(P.dir, Math.floor(Game.time/16)%2), sxp-2, syp+6+bob, 20*DS, 16*DS);
        x.drawImage(SPR.char('hero', P.dir, 0), sxp, syp-8+bob, 16*DS, 20*DS);
      } else {
        drawActor(x, P.x*TILE+P.ox, P.y*TILE+P.oy, 'hero', P.dir, P.anim, cx, cy, m);
      }
    }
    else {
      const n = e.npc;
      if(n.sprite===null) continue;
      if(n.sprite==='moltres'){
        const img = SPR.moltresOW(Math.floor(Game.time/20)%2);
        const bob = Math.sin(Game.time/20)*1.5;
        x.drawImage(img, Math.round((n.x*TILE-cx)*DS), Math.round(((n.y*TILE-5+bob)-cy)*DS), 16*DS, 20*DS);
        continue;
      }
      if(n.sprite==='sign'){
        x.drawImage(SPR.sign(), Math.round((n.x*TILE-cx)*DS), Math.round((n.y*TILE-cy)*DS), 16*DS, 16*DS);
        continue;
      }
      drawActor(x, n.x*TILE+n.ox, n.y*TILE+n.oy, n.sprite, n.dirN, n.anim, cx, cy, m);
    }
  }
}
function drawActor(x, ax, ay, sprite, dir, anim, cx, cy, m){
  const sxp = Math.round((ax-cx)*DS), syp = Math.round((ay-5-cy)*DS);
  // shadow
  x.save(); x.fillStyle='rgba(30,40,50,0.25)';
  x.beginPath(); x.ellipse(sxp+16, syp+38, 11, 4, 0, 0, 7); x.fill(); x.restore();
  x.drawImage(SPR.char(sprite, dir, anim), sxp, syp, 16*DS, 20*DS);
  // tall grass overlay on feet
  const tx = Math.round(ax/TILE), ty = Math.round(ay/TILE);
  const ch = tileAt(m,tx,ty);
  if(ch==='G'||ch==='A'){
    x.drawImage(SPR.tile(ch,0), 0,9,16,7, Math.round((tx*TILE-cx)*DS), Math.round((ty*TILE+9-cy)*DS), 16*DS, 7*DS);
  }
}

// ---------------- start menu / party / bag ----------------
async function openStartMenu(){
  Game.busy = true;
  try{
    while(true){
      const items = ['POKéMON','BAG'];
      if(canFly()) items.push('FLY');
      items.push('SAVE');
      if(Game.flags.freeRoam) items.push('ENCOUNTERS: '+(Game.noEncounters?'OFF':'ON'));
      items.push('SOUND: '+(SND.muted?'OFF':'ON'), 'CLOSE');
      const w = Game.flags.freeRoam ? 214 : 182;
      const idx = await Menu.open(items, {x:VW-w-8, y:8, w});
      if(idx<0) break;
      const label = items[idx];
      if(label==='POKéMON'){ await partyScreen('world'); }
      else if(label==='BAG'){ await bagScreen('world'); }
      else if(label==='FLY'){ await flyMenu(); break; }
      else if(label==='SAVE'){
        const slot = await slotScreen('save');
        if(slot<0) continue;
        if(slotInfo(slot) && slot!==Game.saveSlot){
          await Dlg.sayHold('Overwrite the data in SLOT '+slot+'?');
          const ok = await UI.yesno();
          Dlg.active=false;
          if(!ok) continue;
        }
        if(saveGame(slot)){
          SND.sfx('save');
          await Dlg.say('Your progress has been saved to SLOT '+slot+'!');
        } else {
          await Dlg.say("Couldn't write the save data. Your browser may be blocking storage.");
        }
      }
      else if(label.startsWith('ENCOUNTERS')){ Game.noEncounters = !Game.noEncounters; continue; }
      else if(label.startsWith('SOUND')){ SND.toggleMute(); continue; }
      else break; // CLOSE
    }
  } finally { Game.busy=false; }
}

// bag — mode 'world'|'battle'. In battle returns {item} used or null
const BagUI = { active:false, sel:0 };
async function bagScreen(mode){
  const entries = ()=> Object.keys(Game.bag);
  BagUI.active=true; BagUI.sel=0;
  try{
    while(true){
      const list = entries();
      if(list.length===0){
        BagUI.active=false;
        await Dlg.say('The BAG is empty.');
        return null;
      }
      if(BagUI.sel>=list.length) BagUI.sel=list.length-1;
      if(Input.took('UP')){ BagUI.sel=(BagUI.sel+list.length-1)%list.length; SND.sfx('cursor'); }
      if(Input.took('DOWN')){ BagUI.sel=(BagUI.sel+1)%list.length; SND.sfx('cursor'); }
      if(Input.took('B')){ SND.sfx('cancel'); return null; }
      if(Input.took('A')){
        SND.sfx('confirm');
        const id = list[BagUI.sel];
        const it = ITEMS[id];
        if(it.kind==='key'){
          BagUI.active=false;
          await Dlg.say('THE RUBY glows softly, warm as a sunbeam. CELIO needs this!');
          BagUI.active=true;
          continue;
        }
        if(it.kind==='ball'){
          if(mode==='battle') return {item:id};
          BagUI.active=false;
          await Dlg.say("Now isn't the time to use that!");
          BagUI.active=true;
          continue;
        }
        // heal/cure/revive: pick a target
        BagUI.active=false;
        const idx = await partyScreen(mode==='battle'?'battle-item':'world-item');
        BagUI.active=true;
        if(idx<0) continue;
        const target = Game.party[idx];
        const ok = applyItem(id, target);
        if(!ok){ BagUI.active=false; await Dlg.say('It would have no effect.'); BagUI.active=true; continue; }
        bagTake(id,1);
        SND.sfx('heal');
        BagUI.active=false;
        await Dlg.say(useMessage(id, target));
        BagUI.active=true;
        if(mode==='battle') return {used:true};
      }
      await nextFrame();
    }
  } finally { BagUI.active=false; }
}
function applyItem(id, m){
  const it = ITEMS[id];
  if(it.kind==='heal'){
    if(m.hp===0 || m.hp===m.maxhp) return false;
    m.hp = Math.min(m.maxhp, m.hp+it.amt); return true;
  }
  if(it.kind==='cure'){
    if(!m.status) return false;
    m.status=null; m.sleepTurns=0; return true;
  }
  if(it.kind==='revive'){
    if(m.hp>0) return false;
    m.hp = Math.ceil(m.maxhp/2); m.status=null; return true;
  }
  return false;
}
function useMessage(id, m){
  const it = ITEMS[id];
  if(it.kind==='heal') return m.nick+"'s HP was restored!";
  if(it.kind==='cure') return m.nick+' became healthy!';
  return m.nick+' came back to its senses!';
}

// ---------------- save / load (3 slots) ----------------
const SAVE_SLOTS = 3;
function slotKey(n){ return 'sevii_save_'+n; }
function migrateLegacySave(){
  try{
    const old = localStorage.getItem('sevii_save');
    if(old){
      if(!localStorage.getItem(slotKey(1))) localStorage.setItem(slotKey(1), old);
      localStorage.removeItem('sevii_save');
    }
  }catch(e){}
}
function saveGame(slot){
  slot = slot || Game.saveSlot || 1;
  const P = Game.player;
  const data = {
    v:2, flags:Game.flags, bag:Game.bag, party:Game.party,
    map:Game.map.id, x:P.x, y:P.y, dir:P.dir, steps:Game.steps,
    playFrames:Game.playFrames||0, savedAt:Date.now(),
    noEncounters:!!Game.noEncounters,
  };
  try{
    localStorage.setItem(slotKey(slot), JSON.stringify(data));
    Game.saveSlot = slot;
    return true;
  }catch(e){ return false; }
}
function loadGame(slot){
  slot = slot || 1;
  try{
    const raw = localStorage.getItem(slotKey(slot));
    if(!raw) return false;
    const d = JSON.parse(raw);
    Game.flags = d.flags||{}; Game.bag = d.bag||defaultBag(); Game.party = d.party||defaultParty();
    Game.steps = d.steps||0; Game.playFrames = d.playFrames||0;
    Game.noEncounters = !!d.noEncounters;
    Game.saveSlot = slot;
    loadMap(d.map||'town', d.x??14, d.y??22, d.dir??1);
    return true;
  }catch(e){ return false; }
}
function slotInfo(n){
  try{
    const raw = localStorage.getItem(slotKey(n));
    if(!raw) return null;
    const d = JSON.parse(raw);
    return {
      mapName: (MAPS[d.map] && MAPS[d.map].name) || '???',
      party: (d.party||[]).map(m=>({sp:m.sp, lvl:m.lvl})),
      playFrames: d.playFrames||0,
      savedAt: d.savedAt||0,
      done: !!(d.flags && d.flags.deliveredRuby),
    };
  }catch(e){ return null; }
}
function hasSave(){
  migrateLegacySave();
  for(let i=1;i<=SAVE_SLOTS;i++) if(slotInfo(i)) return true;
  return false;
}
function fmtPlaytime(frames){
  const s = Math.floor(frames/60);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h+':'+String(m).padStart(2,'0');
}

// ---------------- save-slot picker ----------------
const SlotUI = { active:false, sel:0, mode:'save' };
async function slotScreen(mode){
  SlotUI.active=true; SlotUI.mode=mode;
  // default: current slot when saving, most recent save when loading
  if(mode==='save' && Game.saveSlot) SlotUI.sel = Game.saveSlot-1;
  else {
    let best=0, bestAt=-1;
    for(let i=0;i<SAVE_SLOTS;i++){
      const inf = slotInfo(i+1);
      if(inf && inf.savedAt>bestAt){ bestAt=inf.savedAt; best=i; }
    }
    SlotUI.sel = best;
  }
  try{
    while(true){
      if(Input.took('UP')){ SlotUI.sel=(SlotUI.sel+SAVE_SLOTS-1)%SAVE_SLOTS; SND.sfx('cursor'); }
      if(Input.took('DOWN')){ SlotUI.sel=(SlotUI.sel+1)%SAVE_SLOTS; SND.sfx('cursor'); }
      if(Input.took('B')){ SND.sfx('cancel'); return -1; }
      if(Input.took('A')){
        if(SlotUI.mode==='load' && !slotInfo(SlotUI.sel+1)){ SND.sfx('bump'); continue; }
        SND.sfx('confirm');
        return SlotUI.sel+1;
      }
      await nextFrame();
    }
  } finally { SlotUI.active=false; }
}
function slotDraw(x){
  if(!SlotUI.active) return;
  x.fillStyle='rgba(16,28,44,0.94)'; x.fillRect(0,0,VW,VH);
  UI.text(x, SlotUI.mode==='save'? 'SAVE — CHOOSE A SLOT' : 'LOAD GAME', 16, 30,

  UI.text(x, 'Z: '+(SlotUI.mode==='save'?'save here':'load')+'   X: back', VW-16, 30,
    {font:FONT_U, col:'#a8c8e8', align:'right', shadowCol:'rgba(0,0,0,0.5)'});
  for(let i=0;i<SAVE_SLOTS;i++){
    const inf = slotInfo(i+1);
    const yy = 46 + i*86;
    const seld = i===SlotUI.sel;
    const dim = SlotUI.mode==='load' && !inf;
    UI.rounded(x, 14, yy, VW-28, 78, 8);
    x.fillStyle = seld? '#f8f0d0' : 'rgba(248,248,248,0.88)';
    if(dim) x.fillStyle = seld? 'rgba(200,200,205,0.8)' : 'rgba(190,190,196,0.55)';
    x.fill();
    x.lineWidth=2.5; x.strokeStyle = seld? '#e05048' : '#5080c0'; x.stroke();
    if(seld){
      x.fillStyle='#e05048';
      x.beginPath(); x.moveTo(24,yy+31); x.lineTo(34,yy+38); x.lineTo(24,yy+45); x.closePath(); x.fill();
    }
    UI.text(x, 'SLOT '+(i+1), 46, yy+24, {font:FONT_U, col:'#c07830'});
    if(inf){
      UI.text(x, inf.mapName, 46, yy+48, {font:FONT_UB});
      if(inf.done) UI.text(x, '★', 46+inf.mapName.length*13+12, yy+48, {font:FONT_UB, col:'#e0a020'});
      const lead = inf.party[0];
      UI.text(x, lead? ('Lv'+lead.lvl) : '', 46, yy+66, {font:FONT_U, col:'#687080'});
      inf.party.slice(0,6).forEach((m,k)=>{
        x.drawImage(SPR.monIcon(m.sp), 96+k*26, yy+52, 20,20);
      });
      UI.text(x, fmtPlaytime(inf.playFrames), VW-44, yy+28, {font:FONT_UB, align:'right'});
      if(inf.savedAt){
        const d = new Date(inf.savedAt);
        UI.text(x, 'Saved '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'}),
          VW-44, yy+48, {font:FONT_U, align:'right', col:'#687080'});
      }
    } else {
      UI.text(x, '— empty —', 46, yy+50, {font:FONT_U, col:'#8890a0'});
    }
  }
}
/* ============================================================
   battle.js — FRLG-style turn-based battles.

function bmon(){ return Game.party[B.pIdx]; }
function emon(){ return B.eParty[B.eIdx]; }

function stageMul(s){ return s>=0 ? (2+s)/2 : 2/(2-s); }
function initVolatile(m){ m._st={atk:0,def:0,spa:0,spd:0,spe:0}; m._flinch=false; }
function clearVolatile(m){ delete m._st; delete m._flinch; }

function effSpe(m){
  let s = m.stats.spe * stageMul(m._st? m._st.spe:0);
  if(m.status==='par') s*=0.5;
  return s;
}

// ---------- battle text ----------
async function bmsg(text, opts){
  opts = opts||{};
  B.text = text; B.textShown = 0;
  const total = text.length;
  while(B.textShown < total){
    B.textShown = Math.min(total, B.textShown + (Input.held('A')? 3.4 : 1.7));
    if(Input.took('A')) { B.textShown = total; break; }
    await nextFrame();
  }
  if(opts.hold){
    B.arrow = true;
    while(!Input.took('A') && !Input.took('B')) await nextFrame();
    B.arrow = false;
    SND.sfx('confirm');
  } else {
    await waitMs(opts.ms||620);
  }
}

// ---------- HP/EXP bar animation ----------
async function animHp(side, mon){
  const target = Math.max(0, mon.hp/mon.maxhp);
  const key = side==='p' ? 'pHp' : 'eHp';
  const step = 0.02;
  while(Math.abs(B.view[key]-target) > step){
    B.view[key] += B.view[key]>target ? -step : step;
    await nextFrame();
  }
  B.view[key] = target;
}
async function animExp(mon){
  const lo = expForLevel(mon.lvl), hi = expForLevel(mon.lvl+1);
  const target = Math.max(0, Math.min(1,(mon.exp-lo)/(hi-lo)));
  while(Math.abs(B.view.exp-target) > 0.025){
    B.view.exp += B.view.exp>target ? -0.025 : 0.025;
    await nextFrame();
  }
  B.view.exp = target;
}

// ---------- start ----------
Battle.startWild = async function(mon, opts){
  B.kind='wild'; B.trainerId=null; B.trainer=null;
  B.eParty=[mon]; B.legendary=!!(opts&&opts.legendary);
  return await runBattle();
};
Battle.startTrainer = async function(id){
  B.kind='trainer'; B.trainerId=id; B.trainer=TRAINERS[id];
  B.eParty = B.trainer.party.map(([sp,lvl])=>makeMon(sp,lvl));
  B.legendary=false;
  return await runBattle();
};

function battleBg(){
  const id = Game.map ? Game.map.id : 'town';
  if(id==='ember') return {sky:['#f8b060','#e87040'], ground:'#c08050', plat:'#a06840'};
  if(id==='chamber') return {sky:['#4a4058','#2a2432'], ground:'#584838', plat:'#3e3228'};
  return {sky:['#a8e0f8','#70c0f0'], ground:'#88c860', plat:'#5aa848'};
}

async function runBattle(){
  const prevMusic = SND.songName;
  SND.music('battle');
  await UI.flashBattle();
  Game.mode='battle';
  B.active=true; B.result=null; B.runAttempts=0; B.menu=null; B.text='';
  B.pIdx = Game.party.findIndex(m=>m.hp>0);
  if(B.pIdx<0) B.pIdx=0;
  B.eIdx = 0;
  initVolatile(emon()); initVolatile(bmon());
  B.view = {
    eX:520, eY:0, pX:-200, pY:0, eHp:1, pHp:1, exp:0,
    eShake:0, pShake:0, eFlash:0, pFlash:0, eDrop:0, pDrop:0,
    trainerX:null, ballFrame:-1, ballX:0, ballY:0, eHidden:false, pHidden:true,
  };
  const pm0 = bmon();
  B.view.exp = (pm0.exp-expForLevel(pm0.lvl))/(expForLevel(pm0.lvl+1)-expForLevel(pm0.lvl));
  B.view.pHp = pm0.hp/pm0.maxhp;
  B.view.eHp = emon().hp/emon().maxhp;

  // --- intro ---
  if(B.kind==='trainer'){
    B.view.eHidden = true;
    B.view.trainerX = 520;
    for(let i=0;i<26;i++){ B.view.trainerX -= 8; await nextFrame(); }
    B.view.trainerX = 312;
    const tname = (B.trainer.cls+' '+B.trainer.name).trim();
    await bmsg(tname+' would like to battle!', {hold:true});
    for(let i=0;i<20;i++){ B.view.trainerX += 12; await nextFrame(); }
    B.view.trainerX = null;
    await bmsg(tname+' sent out '+emon().nick+'!');
    B.view.eX = 330; B.view.eHidden=false;
    SND.sfx('monCry');
  } else {
    B.view.eHidden=false;
    for(let i=0;i<26;i++){ B.view.eX -= 8; await nextFrame(); }
    B.view.eX = 330;
    SND.sfx('monCry');
    await bmsg(B.legendary ? emon().nick+' attacks!' : 'Wild '+emon().nick+' appeared!', {hold:true});
  }
  await bmsg('Go! '+bmon().nick+'!');
  B.view.pHidden=false;
  for(let i=0;i<20;i++){ B.view.pX += 9; await nextFrame(); }
  B.view.pX = 0;
  SND.sfx('monCry');

  // --- main loop ---
  while(!B.result){
    const action = await battleMenu();
    await executeRound(action);
  }

  // --- teardown ---
  clearVolatile(bmon()); B.eParty.forEach(clearVolatile);
  await UI.fadeOut(400);
  B.active=false;
  Game.mode='world';
  SND.stopMusic();
  SND.music(prevMusic);
  await UI.fadeIn(300);
  return B.result;
}

// ---------- menus ----------
async function battleMenu(){
  while(true){
    B.text = 'What will '+bmon().nick+' do?';
    B.textShown = 1e9;
    B.menu='main';
    let sel = B.menuSel||0;
    while(B.menu==='main'){
      if(Input.took('LEFT')&&(sel%2)) { sel--; SND.sfx('cursor'); }
      if(Input.took('RIGHT')&&!(sel%2)) { sel++; SND.sfx('cursor'); }
      if(Input.took('UP')&&sel>1) { sel-=2; SND.sfx('cursor'); }
      if(Input.took('DOWN')&&sel<2) { sel+=2; SND.sfx('cursor'); }
      B.menuSel = sel;
      if(Input.took('A')){
        SND.sfx('confirm');
        if(sel===0){ // FIGHT
          const mi = await battleMoveMenu();
          if(mi>=0){ B.menu=null; return {type:'move', idx:mi}; }
          B.menu='main';
        } else if(sel===1){ // BAG
          B.menu=null;
          const r = await bagScreen('battle');
          if(r && r.item) return {type:'ball', item:r.item};
          if(r && r.used) return {type:'pass'};
          B.menu='main';
        } else if(sel===2){ // POKéMON
          B.menu=null;
          const idx = await pickSwitchTarget(false);
          if(idx>=0) return {type:'switch', idx};
          B.menu='main';
        } else { // RUN
          B.menu=null;
          return {type:'run'};
        }
      }
      await nextFrame();
    }
  }
}
async function battleMoveMenu(){
  B.menu='moves';
  let sel = 0;
  const mv = bmon().moves;
  while(true){
    if(Input.took('LEFT')&&(sel%2)) { sel--; SND.sfx('cursor'); }
    if(Input.took('RIGHT')&&!(sel%2)&&sel+1<mv.length) { sel++; SND.sfx('cursor'); }
    if(Input.took('UP')&&sel>1) { sel-=2; SND.sfx('cursor'); }
    if(Input.took('DOWN')&&sel<2&&sel+2<mv.length) { sel+=2; SND.sfx('cursor'); }
    B.moveSel = sel;
    if(Input.took('B')){ SND.sfx('cancel'); B.menu='main'; return -1; }
    if(Input.took('A')){
      if(mv[sel].pp<=0){ SND.sfx('cancel'); await bmsg("There's no PP left for this move!"); B.menu='moves'; continue; }
      SND.sfx('confirm');
      return sel;
    }
    await nextFrame();
  }
}
async function pickSwitchTarget(forced){
  while(true){
    const idx = await partyScreen('battle-switch');
    if(idx<0){
      if(!forced) return -1;
      continue;
    }
    const m = Game.party[idx];
    if(m.hp===0){ await Dlg.say(m.nick+' has no energy left to battle!'); continue; }
    if(idx===B.pIdx){ await Dlg.say(m.nick+' is already in battle!'); continue; }
    return idx;
  }
}

// ---------- round execution ----------
async function executeRound(action){
  const eAct = chooseEnemyMove();
  // player non-move actions resolve first
  if(action.type==='run'){
    if(B.kind==='trainer'){
      await bmsg("There's no running from a TRAINER battle!", {hold:true});
      return;
    }
    B.runAttempts++;
    const f = Math.floor(effSpe(bmon())*128/Math.max(1,effSpe(emon()))) + 30*B.runAttempts;
    if(Math.random()*256 < f){
      SND.sfx('run');
      await bmsg('Got away safely!', {hold:true});
      B.result='ran';
      return;
    }
    await bmsg("Can't escape!");
    await enemyTurn(eAct);
    await endOfTurn();
    return;
  }
  if(action.type==='ball'){
    const done = await throwBall(action.item);
    if(done) return;
    await enemyTurn(eAct);
    await endOfTurn();
    return;
  }
  if(action.type==='pass'){
    await enemyTurn(eAct);
    await endOfTurn();
    return;
  }
  if(action.type==='switch'){
    await doSwitch(action.idx);
    await enemyTurn(eAct);
    await endOfTurn();
    return;
  }
  // both use moves: order by priority then speed
  const pm = bmon(), em = emon();
  const pMove = MOVES[pm.moves[action.idx].id];
  const eMove = MOVES[em.moves[eAct].id];
  const pPrio = pMove.prio||0, ePrio = eMove.prio||0;
  let pFirst;
  if(pPrio!==ePrio) pFirst = pPrio>ePrio;
  else if(effSpe(pm)!==effSpe(em)) pFirst = effSpe(pm)>effSpe(em);
  else pFirst = Math.random()<0.5;

  if(pFirst){
    await playerTurn(action.idx);
    if(!B.result && emon().hp>0) await enemyTurn(eAct);
  } else {
    await enemyTurn(eAct);
    if(!B.result && bmon().hp>0) await playerTurn(action.idx);
  }
  if(!B.result) await endOfTurn();
}

function chooseEnemyMove(){
  const em = emon(), pm = bmon();
  const usable = em.moves.map((mv,i)=>({mv,i})).filter(e=>e.mv.pp>0);
  if(usable.length===0) return 0;
  let best=usable[0], bestScore=-1;
  for(const e of usable){
    const M = MOVES[e.mv.id];
    let score;
    if(M.pow>0){
      const stab = SPECIES[em.sp].types.includes(M.type)?1.5:1;
      score = M.pow*stab*typeEff(M.type, SPECIES[pm.sp].types);
    } else {
      score = 0;
      if(M.fx){
        if((M.fx.status||M.fx.sleep) && !pm.status) score = 55;
        if(M.fx.stage) score = M.fx.stage.target==='self' ? 40 : 42;
      }
      if(em._usedStatus) score *= 0.3;
    }
    if(score>bestScore){ bestScore=score; best=e; }
  }
  if(Math.random()<0.2) best = usable[Math.floor(Math.random()*usable.length)];
  const M = MOVES[best.mv.id];
  if(M.pow===0) em._usedStatus = true;
  return best.i;
}

async function playerTurn(idx){
  const pm = bmon();
  if(!await canAct(pm,'p')) return;
  await useMove(pm, emon(), pm.moves[idx], 'p');
  if(emon().hp<=0) await enemyFainted();
}
async function enemyTurn(idx){
  const em = emon();
  if(em.hp<=0) return;
  if(!await canAct(em,'e')) return;
  await useMove(em, bmon(), em.moves[idx], 'e');
  if(bmon().hp<=0) await playerFainted();
}

async function canAct(m, side){
  if(m._flinch){ m._flinch=false; await bmsg(m.nick+' flinched!'); return false; }
  if(m.status==='slp'){
    if(m.sleepTurns>0){
      m.sleepTurns--;
      await bmsg(m.nick+' is fast asleep...');
      return false;
    }
    m.status=null;
    await bmsg(m.nick+' woke up!');
  }
  if(m.status==='par' && Math.random()<0.25){
    await bmsg(m.nick+" is paralyzed! It can't move!");
    return false;
  }
  return true;
}

async function useMove(user, target, slot, side){
  const M = MOVES[slot.id];
  slot.pp--;
  const userName = side==='p' ? user.nick : (B.kind==='wild'? 'Wild ':'Foe ')+user.nick;
  const targetName = side==='p' ? (B.kind==='wild'? 'Wild ':'Foe ')+target.nick : target.nick;
  await bmsg(userName+' used '+M.name+'!', {ms:420});

  // attack lunge animation
  if(side==='p'){ for(let i=0;i<4;i++){ B.view.pX+=3; await nextFrame(); } }
  else { for(let i=0;i<4;i++){ B.view.eX-=3; await nextFrame(); } }

  // accuracy
  if(!(M.fx&&M.fx.neverMiss) && M.acc<999 && Math.random()*100 >= M.acc){
    await resetLunge(side);
    await bmsg(userName+"'s attack missed!");
    return;
  }

  if(M.pow>0){
    const eff = typeEff(M.type, SPECIES[target.sp].types);
    if(eff===0){
      await resetLunge(side);
      await bmsg("It doesn't affect "+targetName+'...');
      return;
    }
    let hits = 1;
    if(M.fx && M.fx.multihit) hits = [2,2,3,3,4,5][Math.floor(Math.random()*6)];
    let anyCrit=false, totalDmg=0;
    for(let h=0; h<hits && target.hp>0; h++){
      const r = calcDamage(user, target, M, eff);
      anyCrit = anyCrit||r.crit;
      totalDmg += r.dmg;
      target.hp = Math.max(0, target.hp - r.dmg);
      // hit feedback
      SND.sfx(eff>1?'hitSuper': eff<1?'hitWeak':'hit');
      const vk = side==='p' ? 'eShake':'pShake';
      const fk = side==='p' ? 'eFlash':'pFlash';
      B.view[fk]=1;
      for(let i=0;i<10;i++){ B.view[vk]=(i%2? -3:3)*(eff>1?1.6:1); B.view[fk]=i%2; await nextFrame(); }
      B.view[vk]=0; B.view[fk]=0;
      await animHp(side==='p'?'e':'p', target);
    }
    await resetLunge(side);
    if(hits>1) await bmsg('Hit '+hits+' time(s)!');
    if(anyCrit) await bmsg('A critical hit!');
    if(eff>1) await bmsg("It's super effective!");
    if(eff<1) await bmsg("It's not very effective...");
    if(M.fx && M.fx.recoil && totalDmg>0){
      user.hp = Math.max(0, user.hp - Math.max(1,Math.floor(totalDmg*M.fx.recoil)));
      await animHp(side, user);
      await bmsg(userName+' is hit with recoil!');
      if(user.hp<=0){
        if(side==='p'){ await playerFainted(); } else { await enemyFainted(); }
        return;
      }
    }
    // secondary effects
    if(M.fx && target.hp>0){
      if(M.fx.flinch && Math.random()*100 < M.fx.flinch) target._flinch = true;
      if(M.fx.status && !target.status && Math.random()*100 < M.fx.chance){
        if(!(M.fx.status==='psn' && (SPECIES[target.sp].types.includes('poison')||SPECIES[target.sp].types.includes('steel'))) &&
           !(M.fx.status==='brn' && SPECIES[target.sp].types.includes('fire')) &&
           !(M.fx.status==='par' && SPECIES[target.sp].types.includes('electric'))){
          target.status = M.fx.status;
          await bmsg(targetName+statusText(M.fx.status));
        }
      }
    }
  } else {
    await resetLunge(side);
    // status move
    if(M.fx && M.fx.sleep){
      if(target.status){ await bmsg('But it failed!'); return; }
      target.status='slp'; target.sleepTurns = 1+Math.floor(Math.random()*3);
      await bmsg(targetName+' fell asleep!');
      return;
    }
    if(M.fx && M.fx.status==='par'){
      if(target.status || SPECIES[target.sp].types.includes('electric') || SPECIES[target.sp].types.includes('ground')){
        await bmsg('But it failed!'); return;
      }
      target.status='par';
      await bmsg(targetName+statusText('par'));
      return;
    }
    if(M.fx && M.fx.stage){
      const st = M.fx.stage;
      const who = st.target==='self' ? user : target;
      const whoName = st.target==='self' ? userName : targetName;
      if(!who._st) initVolatile(who);
      const cur = who._st[st.stat];
      const next = Math.max(-6, Math.min(6, cur+st.delta));
      if(next===cur){
        await bmsg(whoName+"'s "+statName(st.stat)+" won't go any "+(st.delta>0?'higher':'lower')+'!');
        return;
      }
      who._st[st.stat]=next;
      const adv = Math.abs(st.delta)>1 ? 'sharply ' : '';
      await bmsg(whoName+"'s "+statName(st.stat)+' '+adv+(st.delta>0?'rose!':'fell!'));
      return;
    }
    await bmsg('But nothing happened!');
  }
}
async function resetLunge(side){
  if(side==='p'){ B.view.pX=0; } else { B.view.eX=330; }
}
function statName(s){ return {atk:'ATTACK',def:'DEFENSE',spa:'SP. ATK',spd:'SP. DEF',spe:'SPEED'}[s]; }
function statusText(s){
  return {psn:' was poisoned!', brn:' was burned!', par:' is paralyzed! It may be unable to move!'}[s];
}
function calcDamage(user, target, M, eff){
  const special = SPECIAL_TYPES.includes(M.type);
  let atk = user.stats[special?'spa':'atk'] * stageMul(user._st? user._st[special?'spa':'atk']:0);
  let def = target.stats[special?'spd':'def'] * stageMul(target._st? target._st[special?'spd':'def']:0);
  if(!special && user.status==='brn') atk*=0.5;
  const crit = Math.random() < ((M.fx&&M.fx.highcrit)? 0.125 : 0.0625);
  const stab = SPECIES[user.sp].types.includes(M.type)?1.5:1;
  let dmg = Math.floor(Math.floor(Math.floor(2*user.lvl/5+2)*M.pow*atk/Math.max(1,def))/50)+2;
  dmg = Math.floor(dmg*stab*eff*(crit?2:1)*(0.85+Math.random()*0.15));
  return { dmg:Math.max(1,dmg), crit };
}

async function endOfTurn(){
  if(B.result) return;
  for(const [m, side, name] of [[bmon(),'p',bmon().nick],[emon(),'e',(B.kind==='wild'?'Wild ':'Foe ')+emon().nick]]){
    if(m.hp<=0) continue;
    if(m.status==='psn'){
      m.hp = Math.max(0, m.hp - Math.max(1,Math.floor(m.maxhp/8)));
      await bmsg(name+' is hurt by poison!');
      await animHp(side, m);
    } else if(m.status==='brn'){
      m.hp = Math.max(0, m.hp - Math.max(1,Math.floor(m.maxhp/16)));
      await bmsg(name+' is hurt by its burn!');
      await animHp(side, m);
    }
    if(m.hp<=0){
      if(side==='p') await playerFainted(); else await enemyFainted();
      if(B.result) return;
    }
  }
}

// ---------- faints, exp, switching ----------
async function enemyFainted(){
  const em = emon();
  SND.sfx('faint');
  for(let i=0;i<12;i++){ B.view.eDrop += 8; await nextFrame(); }
  B.view.eHidden = true;
  await bmsg((B.kind==='wild'?'Wild ':'Foe ')+em.nick+' fainted!', {hold:true});
  // EXP
  const pm = bmon();
  if(pm.hp>0 && pm.lvl<100){
    let gain = Math.floor(SPECIES[em.sp].exp * em.lvl / 7);
    if(B.kind==='trainer') gain = Math.floor(gain*1.5);
    pm.exp += gain;
    await bmsg(pm.nick+' gained '+gain+' EXP. Points!', {hold:true});
    while(pm.lvl<100 && pm.exp >= expForLevel(pm.lvl+1)){
      await animExp(pm);
      pm.lvl++;
      const old = pm.stats;
      pm.stats = calcStats(pm.sp, pm.lvl);
      pm.maxhp = pm.stats.hp;
      pm.hp = Math.min(pm.maxhp, pm.hp + (pm.stats.hp-old.hp));
      B.view.exp = 0;
      SND.sfx('lvl');
      await bmsg(pm.nick+' grew to Lv'+pm.lvl+'!', {hold:true});
    }
    await animExp(pm);
  }
  // next enemy or victory
  if(B.kind==='trainer' && B.eIdx+1 < B.eParty.length){
    B.eIdx++;
    initVolatile(emon());
    const tname = (B.trainer.cls+' '+B.trainer.name).trim();
    await bmsg(tname+' sent out '+emon().nick+'!');
    B.view.eDrop=0; B.view.eHidden=false; B.view.eHp = emon().hp/emon().maxhp;
    SND.sfx('monCry');
    return;
  }
  SND.music('victory');
  if(B.kind==='trainer'){
    const tname = (B.trainer.cls+' '+B.trainer.name).trim();
    B.view.trainerX = 312;
    await bmsg('You defeated '+tname+'!', {hold:true});
    await bmsg(B.trainer.lose, {hold:true});
  } else if(B.legendary){
    await bmsg('The FIREBIRD lets out a final, almost approving screech... and dives into the volcano!', {hold:true});
  }
  B.result='win';
}
async function playerFainted(){
  const pm = bmon();
  SND.sfx('faint');
  for(let i=0;i<12;i++){ B.view.pDrop += 10; await nextFrame(); }
  B.view.pHidden = true;
  await bmsg(pm.nick+' fainted!', {hold:true});
  clearVolatile(pm);
  if(!Game.party.some(m=>m.hp>0)){
    B.result='loss';
    return;
  }
  const idx = await pickSwitchTarget(true);
  await doSwitch(idx, true);
}
async function doSwitch(idx, afterFaint){
  const old = bmon();
  if(!afterFaint){
    clearVolatile(old);
    await bmsg('That\'s enough, '+old.nick+'! Come back!');
    B.view.pHidden = true;
  }
  B.pIdx = idx;
  const nm = bmon();
  initVolatile(nm);
  await bmsg('Go! '+nm.nick+'!');
  B.view.pHidden=false; B.view.pDrop=0; B.view.pX=-200;
  B.view.pHp = nm.hp/nm.maxhp;
  B.view.exp = (nm.exp-expForLevel(nm.lvl))/(expForLevel(nm.lvl+1)-expForLevel(nm.lvl));
  for(let i=0;i<20;i++){ B.view.pX += 10; await nextFrame(); }
  B.view.pX=0;
  SND.sfx('monCry');
}

// ---------- catching ----------
async function throwBall(item){
  if(B.kind==='trainer'){
    bagTake(item,1);
    await bmsg('The TRAINER blocked the BALL! Don\'t be a thief!', {hold:true});
    return false;
  }
  bagTake(item,1);
  const em = emon();
  await bmsg('You threw an '+ITEMS[item].name+'!', {ms:300});
  SND.sfx('throwBall');
  // arc animation
  B.view.ballFrame = 0;
  for(let i=0;i<=20;i++){
    const t = i/20;
    B.view.ballX = 100 + t*260;
    B.view.ballY = 170 - Math.sin(t*Math.PI)*120 - t*60;
    await nextFrame();
  }
  // mon absorbed
  B.view.eHidden = true;
  B.view.ballX = 366; B.view.ballY = 128;
  await waitMs(350);
  // shake checks
  const rate = SPECIES[em.sp].catch;
  let a = ((3*em.maxhp - 2*em.hp) * rate * (ITEMS[item].bonus||1)) / (3*em.maxhp);
  if(em.status==='slp') a*=2;
  else if(em.status) a*=1.5;
  let caught = a>=255;
  let shakes = 4;
  if(!caught){
    const b = 1048560 / Math.sqrt(Math.sqrt(16711680/Math.max(1,a)));
    shakes = 0;
    for(let i=0;i<4;i++){
      if(Math.random()*65536 < b) shakes++;
      else break;
    }
    caught = shakes===4;
  }
  for(let i=0;i<Math.min(shakes,3)+ (caught?0:0); i++){
    SND.sfx('shake');
    for(let k=0;k<8;k++){ B.view.ballX = 366 + (k%2? -3:3); await nextFrame(); }
    B.view.ballX = 366;
    await waitMs(260);
  }
  if(caught){
    SND.sfx('catch');
    await waitMs(400);
    SND.music('victory');
    await bmsg('Gotcha! '+em.nick+' was caught!', {hold:true});
    em.status = em.status; // keep status
    if(Game.party.length<6){
      Game.party.push(em);
      await bmsg(em.nick+' joined your team!', {hold:true});
    } else {
      await bmsg(em.nick+' was sent to BILL\'s PC on ONE ISLAND!', {hold:true});
    }
    B.view.ballFrame=-1;
    B.result='caught';
    return true;
  }
  B.view.ballFrame=-1;
  B.view.eHidden=false;
  await bmsg(['Oh no! The POKéMON broke free!','Aww! It appeared to be caught!','Aargh! Almost had it!','Shoot! It was so close, too!'][shakes], {ms:800});
  return false;
}

async function titleScreen(){
  Game.mode='title';

  while(!Input.took('START') && !Input.took('A')) await nextFrame();
  SND.sfx('confirm');

    const choice = await Menu.open(opts, {x:VW/2-90, y:146, w:180, noCancel:true});
    const pick = opts[choice];
    if(pick==='CONTINUE'){
      const slot = await slotScreen('load');

      if(loadGame(slot)){
        await UI.fadeOut(500);
        Game.mode='world';
        await UI.fadeIn(400);

      }

// ---------------- main loop ----------------
function drawFrame(){
  const x = G_ctx;
  x.imageSmoothingEnabled = false;
  if(Game.mode==='title'){ Title.draw(x); }
  else if(Game.mode==='ending'){ Ending.draw(x); }
  else if(Game.mode==='battle'){ Battle.draw(x); }
  else if(Game.mode==='world'){ worldDraw(x); }
  else { x.fillStyle='#101018'; x.fillRect(0,0,VW,VH); }
  // overlays
  partyDraw(x);
  summaryDraw(x);
  bagDraw(x);
  slotDraw(x);
  Dlg.draw(x);
  Menu.draw(x);
  if(Game.mode==='world') Banner.draw(x);
  UI.drawFx(x);
}

function loop(){
  requestAnimationFrame(loop);
  frameCount++;
  Game.time++;
  if(Game.mode!=='title' && Game.mode!=='boot') Game.playFrames = (Game.playFrames||0)+1;
  if(Game.mode==='world') worldUpdate();
  tickWaiters();
  drawFrame();
}

function fitCanvas(){
  const pad = document.getElementById('gamepad');
  const padH = (pad && getComputedStyle(pad).display!=='none') ? pad.offsetHeight+8 : 0;
  const availW = window.innerWidth - 16;
  const availH = window.innerHeight - 16 - padH;
  let scale = Math.min(availW/VW, availH/VH);
  if(scale>1) scale = Math.max(1, Math.floor(scale*2)/2);
  G_canvas.style.width = Math.round(VW*scale)+'px';
  G_canvas.style.height = Math.round(VH*scale)+'px';
}

  });
  // trainer sprites incl. leaders
  ['brock','misty','surge','sabrina','erika'].forEach((id,i)=>{ x.drawImage(SPR.trainer(id), 250+i*40, 176, 32,38); });
}

// ---------------- boot ----------------
window.addEventListener('load', async ()=>{
  G_canvas = document.getElementById('game');
  G_ctx = G_canvas.getContext('2d');
  G_ctx.imageSmoothingEnabled = false;
  bindInput();
  // keyboard focus insurance (esp. when embedded in an iframe/artifact)
  G_canvas.setAttribute('tabindex','0');
  G_canvas.style.outline = 'none';
  const grabFocus = ()=>{ try{ window.focus(); G_canvas.focus(); }catch(e){} SND.init(); };
  grabFocus();
  document.addEventListener('pointerdown', grabFocus);
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  try{ await document.fonts.ready; }catch(e){}
  try{ await Promise.all([
    document.fonts.load('9px "Press Start 2P"'),
    document.fonts.load('21px VT323'),
  ]);}catch(e){}

  const q = new URLSearchParams(location.search);
  window.__game = { Game, Battle, SPR, MAPS, loadMap, makeMon, Input, PartyUI, BagUI, Dlg, Menu, B, saveGame, loadGame, slotInfo, SlotUI, FLY_POINTS, newGame };
  if(q.get('debug')==='sprites'){
    requestAnimationFrame(function ds(){ requestAnimationFrame(ds); frameCount++; Game.time++; tickWaiters(); debugSpriteSheet(); });
    return;
  }
  if(q.get('debug')==='sprites2'){
    requestAnimationFrame(function ds(){ requestAnimationFrame(ds); frameCount++; Game.time++; tickWaiters(); debugSpriteSheet2(); });
    return;
  }
  loop();
  if(q.get('map')){
    // debug teleport straight into the world
    Game.flags={introDone:true}; Game.bag=defaultBag(); Game.party=defaultParty();
    loadMap(q.get('map'), Number(q.get('x')||5), Number(q.get('y')||5), Number(q.get('dir')||0));
    Game.mode='world';
    Fx.fade=0;
    return;
  }
  titleScreen();
});
</script>
