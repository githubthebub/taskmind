<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1420" />
  <meta name="description" content="Offline breath-training companion: 4-7-8 pacing with an animated coach, haptic cues, and resonant audio. Everything stays on your device." />
  <title>Stillpoint — somatic focus trainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230e1420'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%237ee0c0' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%237ee0c0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="brand">still<span>point</span></h1>
      <div id="hud"></div>
    </header>

    <main class="stage">
      <section class="coach-pane" aria-label="Your coach">
        <div id="avatar"></div>
        <div id="persona"></div>
        <div id="mudra"></div>
      </section>

      <section class="practice-pane" aria-label="Breathing pacer">
        <div id="ring"></div>
        <div id="prompts"></div>
        <div id="neuro"></div>
      </section>
    </main>

    <footer class="controls">
      <button id="start-btn" class="start-btn" type="button">Begin</button>
      <label class="toggle">
        <input type="checkbox" id="haptics-toggle" checked />
        <span>Haptics</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="audio-toggle" checked />
        <span>Sound</span>
      </label>
    </footer>
  </div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
