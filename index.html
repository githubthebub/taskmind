<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon FRLG: Sevii Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #101820;
    color: #cdd6e0;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
  }
  #game {
    width: 720px;
    height: 480px;
    max-width: 96vw;
    max-height: 64vw;
    image-rendering: pixelated;
    border: 4px solid #384858;
    border-radius: 6px;
    background: #000;
  }
  .controls {
    font-size: 13px;
    color: #7a8ba0;
    text-align: center;
    line-height: 1.6;
  }
  .controls b { color: #cdd6e0; }
</style>
</head>
<body>
  <canvas id="game" width="240" height="160"></canvas>
  <div class="controls">
    <b>Arrows / WASD</b> move &nbsp;·&nbsp; <b>Z / Enter</b> confirm, talk &nbsp;·&nbsp;
    <b>X / Esc</b> menu, back<br>
    Heal at the POKeMON CENTER · Wild POKeMON live in the tall grass on KINDLE ROAD
  </div>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
