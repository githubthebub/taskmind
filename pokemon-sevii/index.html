<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pokémon Sevii Adventures — FRLG-style fan demo</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<div id="gamepad">
  <div class="dpad">
    <button class="up" data-btn="UP">▲</button>
    <button class="left" data-btn="LEFT">◀</button>
    <button class="right" data-btn="RIGHT">▶</button>
    <button class="down" data-btn="DOWN">▼</button>
  </div>
  <div class="keys">
    <button class="st" data-btn="START">START</button>
    <button class="a" data-btn="A">A</button>
    <button class="b" data-btn="B">B</button>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
